name: Build PocketBase image

# PocketBase ships release binaries, not a container image, so the catalog
# template runs this one: services/pocketbase/image (pinned upstream release,
# checksum-verified, non-root, plus the StackBlaze boot hook). main/staging
# pushes publish the release tag the template uses; any other branch publishes
# only <version>-<sha> for pre-merge testing.
on:
  workflow_dispatch:
  push:
    paths:
      - 'services/pocketbase/image/**'
      - '.github/workflows/build-pocketbase.yaml'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/stackblaze/stack-templates/pocketbase
  VERSION: 0.40.6

jobs:
  build:
    # GitHub-hosted: the org's self-hosted runners are not visible to this repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        run: |
          short="${GITHUB_SHA::7}"
          tags="${IMAGE}:${VERSION}-${short}"
          if [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_REF" = refs/heads/staging ]; then
            tags="${tags},${IMAGE}:${VERSION}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/pocketbase/image
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            PB_VERSION=${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=https://github.com/stackblaze/stack-templates
            org.opencontainers.image.description=PocketBase ${{ env.VERSION }} for the StackBlaze catalog
            org.opencontainers.image.licenses=MIT
