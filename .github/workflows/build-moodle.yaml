name: Build Moodle image

# Moodle publishes no runtime image (Bitnami's moved behind a paywall in 2025),
# so the catalog template runs this one: services/moodle/image, the official
# checksum-pinned Moodle release on the official PHP Apache image.
# main/staging pushes publish the release tag the template uses; any other
# branch publishes only <version>-<sha> for pre-merge testing.
on:
  workflow_dispatch:
  push:
    paths:
      - 'services/moodle/image/**'
      - '.github/workflows/build-moodle.yaml'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/stackblaze/stack-templates/moodle
  VERSION: 5.3.1-1

jobs:
  build:
    # GitHub-hosted: the org's self-hosted runners are not visible to this
    # repo (the other build jobs here sit queued until they are cancelled).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        run: |
          short="${GITHUB_SHA::7}"
          tags="${IMAGE}:${VERSION}-${short}"
          if [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_REF" = refs/heads/staging ]; then
            tags="${tags},${IMAGE}:${VERSION}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/moodle/image
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/stackblaze/stack-templates
            org.opencontainers.image.description=Moodle ${{ env.VERSION }} for the StackBlaze catalog
            org.opencontainers.image.licenses=GPL-3.0-or-later
