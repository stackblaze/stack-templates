name: Build Excalidraw image

# Upstream publishes only excalidraw/excalidraw:latest, and that build sends
# collaboration and share links to excalidraw.com, which refuses other origins.
# The catalog template runs this one: services/excalidraw/image, a pinned
# upstream commit with its own collaboration relay and storage. main/staging
# pushes publish the release tag the template uses; any other branch publishes
# only <version>-<sha> for pre-merge testing.
on:
  workflow_dispatch:
  push:
    paths:
      - 'services/excalidraw/image/**'
      - '.github/workflows/build-excalidraw.yaml'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/stackblaze/stack-templates/excalidraw
  # <date of the upstream release-branch commit>-<upstream short sha>; keep in
  # step with EXCALIDRAW_COMMIT in the Dockerfile
  VERSION: 2026.11.12-1440f2d

jobs:
  build:
    # GitHub-hosted: the org's self-hosted runners are not visible to this repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        run: |
          short="${GITHUB_SHA::7}"
          tags="${IMAGE}:${VERSION}-${short}"
          if [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_REF" = refs/heads/staging ]; then
            tags="${tags},${IMAGE}:${VERSION}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/excalidraw/image
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/stackblaze/stack-templates
            org.opencontainers.image.description=Excalidraw ${{ env.VERSION }} with self-hosted collaboration, for the StackBlaze catalog
            org.opencontainers.image.licenses=MIT
