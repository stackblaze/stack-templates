name: Build Supabase Postgres image

# The Supabase template's database: CloudNativePG's PostgreSQL 16 image plus
# wal2json (Realtime's Postgres Changes). services/supabase/postgres-image.
# main/staging pushes publish the release tag the template uses; any other
# branch publishes only <version>-<sha> for pre-merge testing.
on:
  workflow_dispatch:
  push:
    paths:
      - 'services/supabase/postgres-image/**'
      - '.github/workflows/build-supabase-postgres.yaml'

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/stackblaze/stack-templates/supabase-postgres
  # <PostgreSQL version of the base image>-wal2json; keep in step with the Dockerfile
  VERSION: 16.15-wal2json

jobs:
  build:
    # GitHub-hosted: the org's self-hosted runners are not visible to this repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tags
        id: tags
        run: |
          short="${GITHUB_SHA::7}"
          tags="${IMAGE}:${VERSION}-${short}"
          if [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_REF" = refs/heads/staging ]; then
            tags="${tags},${IMAGE}:${VERSION}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: services/supabase/postgres-image
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/stackblaze/stack-templates
            org.opencontainers.image.description=CloudNativePG PostgreSQL ${{ env.VERSION }} for the StackBlaze Supabase template
            org.opencontainers.image.licenses=PostgreSQL
