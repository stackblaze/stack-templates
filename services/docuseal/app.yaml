apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: docuseal
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "Create, send, complete, and sign business documents from one streamlined workspace.\nA cost-effective alternative to DocuSign and Dropbox Sign."
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/docuseal/icon.png
    kubero.dev/template.installation: ''
    kubero.dev/template.links: '[]'
    kubero.dev/template.screenshots: '["https://www.docuseal.com/packs/static/images/resources/quick-start-1-216aeed1da1db5b3e718.jpg"]'
    kubero.dev/template.source: https://github.com/docusealco/docuseal
    kubero.dev/template.categories: '["work", "security"]'
    kubero.dev/template.title: "DocuSeal eSign"
    kubero.dev/template.website: https://www.docuseal.com/
  labels:
    manager: kubero
spec:
  name: docuseal
  deploymentstrategy: docker
  envVars:
  - name: DATABASE_URL
    value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  # CDN terminates TLS at the edge and talks HTTP to the pod. DocuSeal
  # defaults DEFAULT_URL_OPTIONS / cookies to http unless FORCE_SSL is set;
  # that yields "Not Secure" share links and CSRF 422s (Origin https vs
  # base_url http). FORCE_SSL enables assume_ssl + https URL generation.
  - name: HOST
    value: '{{KUBERO_APP_HOST}}'
  - name: FORCE_SSL
    value: 'true'
  - name: S3_ATTACHMENTS_BUCKET
    value: '$(S3_BUCKET)'
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /data
    name: '{{KUBERO_APP_NAME}}-data'
    size: 2Gi
    storageClass: shared
  cronjobs: []
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: docuseal
              owner: docuseal
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO docuseal
              - GRANT CREATE ON SCHEMA public TO docuseal
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO docuseal
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: docuseal
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: docuseal
          password: docuseal
  # Platform email (see README "Email contract"). DocuSeal ActionMailer
  # SMTP_* env (STARTTLS on 587 — do not enable implicit SSL/TLS).
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env:
    - name: SMTP_ADDRESS
      value: '$(SMTP_HOST)'
    - name: SMTP_PORT
      value: '$(SMTP_PORT)'
    - name: SMTP_USERNAME
      value: '$(SMTP_USER)'
    - name: SMTP_PASSWORD
      value: '$(SMTP_PASSWORD)'
    - name: SMTP_AUTHENTICATION
      value: plain
    - name: SMTP_ENABLE_STARTTLS
      value: 'true'
    - name: SMTP_ENABLE_SSL
      value: 'false'
    - name: SMTP_ENABLE_TLS
      value: 'false'
    resourceDefinitions: {}
  # Platform object storage (RustFS Tenant → communal-s3 logical bucket
  # on shared). Injects S3_*/AWS_*; map bucket for Active Storage.

  - displayName: RustFS
    env: []
    icon: /img/addons/rustfs.svg
    id: kubero-operator
    kind: Tenant
    resourceDefinitions:
      Tenant:
        apiVersion: rustfs.com/v1alpha1
        kind: Tenant
        metadata:
          name: '{{KUBERO_APP_NAME}}-rustfs'
          annotations:
            # The operator refuses custom-repo images it cannot verify for
            # RuntimeDefault seccomp ("WorkloadSecurityIncompatible") unless the
            # exact reference is acknowledged. Keep in sync with spec.image.
            operator.rustfs.com/runtime-default-image-ack: registry.stackblaze.cloud/rustfs/rustfs:1.0.0-beta.10
        spec:
          image: registry.stackblaze.cloud/rustfs/rustfs:1.0.0-beta.10
          credsSecret:
            name: '{{KUBERO_APP_NAME}}-rustfs-credentials'
          pools:
          - name: pool-0
            servers: 1
            persistence:
              volumesPerServer: 4
              volumeClaimTemplate:
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 2Gi
                storageClassName: slow
      credsSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-rustfs-credentials'
        type: Opaque
        stringData:
          accesskey: docuseal
          secretkey: '{{KUBERO_GEN_HEX:32}}'

  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  # Postgres comes up after the web pod on a fresh deploy. DocuSeal exits
  # immediately if the database refuses the connection, and that restart is
  # what the platform records as a startup-probe SLO breach. Wait here so
  # the process never crashes.
  #
  # Probe /up, not /. FORCE_SSL makes / return 302 to the public https URL.
  # kubelet follows that redirect out through the CDN and records
  # "Probe terminated redirects" as a cluster networking failure.
  # Rails /up is 200 with no redirect.
  healthcheck:
    enabled: true
    path: /up
    startupSeconds: 300
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '3000'
    pullPolicy: IfNotPresent
    command:
    - /bin/sh
    - -c
    - |
      # Image CMD is: /app/bin/bundle exec puma -C /app/config/puma.rb --dir /app
      # Wait for Postgres first so a cold database does not crash the process.
      ruby -e 'require "socket"; h=ENV.fetch("PGHOST"); p=ENV.fetch("PGPORT","5432").to_i; 90.times { begin; TCPSocket.new(h,p).close; exit 0; rescue; sleep 2; end }; abort("postgres not ready")'
      exec /app/bin/bundle exec puma -C /app/config/puma.rb --dir /app
    # Referenced as docker.io on purpose: zone nodes mirror docker.io through
    # the regional registry (containerd hosts.d -> registry.<region>/v2/docker,
    # the zot in each services cluster, on-demand sync, Docker Hub fallback).
    # Anonymous read, no pull secret. Not registry.stackblaze.cloud (sfo zot,
    # 503). Pinned patch tag, not :latest.
    repository: docker.io/docuseal/docuseal
    tag: '3.2.6'
    run:
      securityContext:
        readOnlyRootFilesystem: false
