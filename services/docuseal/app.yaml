apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: docuseal
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "Create, send, complete, and sign business documents from one streamlined workspace.\nA cost-effective alternative to DocuSign and Dropbox Sign."
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/docuseal/icon.png
    kubero.dev/template.installation: 'Open the app URL and sign in as admin@example.com
      (DOCUSEAL_ADMIN_EMAIL) with the password generated in DOCUSEAL_ADMIN_PASSWORD (both
      under Variables). The template completes DocuSeal''s first-run setup on the first
      start, before the app serves any request, so nobody else can claim the instance
      through the setup page. Change the email to your own and the company name under
      Settings afterwards, so signers see who sent the request (changing the variables
      later has no effect once a user exists). Upload a PDF, place
      signature and text fields, then send it: signature requests, reminders and the
      signed copies go out through the Email add-on. Uploaded and signed documents are
      kept on the data volume, with the database in Postgres. Each completed document
      is signed with a certificate generated for this instance. Keep SECRET_KEY_BASE
      unchanged after first use: it encrypts the stored settings and certificates.'
    kubero.dev/template.links: '["https://www.docuseal.com/docs"]'
    kubero.dev/template.screenshots: '["https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/docuseal/screenshot-builder.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/docuseal/screenshot-signing.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/docuseal/screenshot-completed.png"]'
    kubero.dev/template.source: https://github.com/docusealco/docuseal
    kubero.dev/template.categories: '["work", "security"]'
    kubero.dev/template.title: "DocuSeal eSign"
    kubero.dev/template.website: https://www.docuseal.com/
  labels:
    manager: kubero
spec:
  name: docuseal
  deploymentstrategy: docker
  addons:
  # The only database DocuSeal needs (config/database.yml: DATABASE_URL
  # postgres://...). Upstream's compose runs Postgres 18.
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: docuseal
              owner: docuseal
              secret:
                name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO docuseal
              - GRANT CREATE ON SCHEMA public TO docuseal
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO docuseal
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: docuseal
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
  # Platform email (README "Email contract"). DocuSeal's ActionMailer reads
  # SMTP_ADDRESS, SMTP_PORT, SMTP_USERNAME, SMTP_PASSWORD (production.rb) and
  # the sender from SMTP_FROM (lib/action_mailer_configs_interceptor.rb), which
  # the platform injects under that name. STARTTLS on 587, no implicit TLS.
  # Without SMTP_ADDRESS DocuSeal falls back to the SMTP form under Settings.
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env:
    - name: SMTP_ADDRESS
      value: '$(SMTP_HOST)'
    - name: SMTP_USERNAME
      value: '$(SMTP_USER)'
    - name: SMTP_AUTHENTICATION
      value: plain
    - name: SMTP_ENABLE_STARTTLS
      value: 'true'
    resourceDefinitions: {}
  envVars:
  - name: DATABASE_URL
    value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  # Rails secret. Upstream generates SecureRandom.hex(64) (config/dotenv.rb)
  # when it is unset; set here so it never lands in a file on the volume.
  # ENCRYPTION_SECRET is derived from it (production.rb) and encrypts the
  # stored settings and the signing certificates.
  - name: SECRET_KEY_BASE
    value: '{{STACKBLAZE_GEN_HEX:128}}'
  # The edge terminates TLS. FORCE_SSL turns on assume_ssl / force_ssl, so
  # links, cookies and CSRF origin checks use https.
  - name: FORCE_SSL
    value: 'true'
  # Read only by the start command below, on the very first start: it
  # completes /setup with these, so the first visitor cannot claim the
  # instance. Ignored once any user exists.
  - name: DOCUSEAL_ADMIN_EMAIL
    value: admin@example.com
  - name: DOCUSEAL_ADMIN_PASSWORD
    value: '{{STACKBLAZE_GEN_ALNUM:24}}'
  # Stored as the app URL setting (Settings > Account, editable there), used
  # for the links in signature request emails.
  - name: DOCUSEAL_APP_URL
    value: '{{STACKBLAZE_APP_URL}}'
  # Uploaded documents, signatures and signed PDFs go to the Disk service at
  # $WORKDIR/attachments (config/storage.yml), and the embedded Redis that
  # runs DocuSeal's Sidekiq jobs keeps its dump there too. WORKDIR is the
  # image's /data/docuseal (upstream compose mounts the same path).
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /data/docuseal
    name: '{{STACKBLAZE_APP_NAME}}-data'
    size: 10Gi
    storageClass: shared
  cronjobs: []
  # Sidekiq (emails, webhooks, PDF processing) and Redis run inside the web
  # process (puma plugins sidekiq_embed and redis_server), so no worker.
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 2Gi
  # Rails /up: 200 without the FORCE_SSL redirect that / returns.
  healthcheck:
    enabled: true
    path: /up
    startupSeconds: 300
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '3000'
    pullPolicy: IfNotPresent
    repository: docker.io/docuseal/docuseal
    tag: 3.3.6
    # 1. Wait for a real Postgres login (DocuSeal exits on a refused
    #    connection, and the operator creates the user after the port opens).
    # 2. First start only: run the migrations and complete the setup page
    #    (account, admin, app URL, signing certificates), the same records
    #    SetupController#create writes, then check the admin exists.
    # 3. Start puma, which also runs Sidekiq and Redis.
    command:
    - /bin/sh
    - -c
    - |
      set -e
      cd /app
      /app/bin/bundle exec ruby -e '
        require "pg"
        150.times do |i|
          begin
            PG.connect(ENV.fetch("DATABASE_URL")).close
            exit 0
          rescue PG::Error => e
            puts "Waiting for Postgres (#{e.message.lines.first.to_s.strip})" if (i % 10).zero?
            sleep 2
          end
        end
        abort "Postgres did not accept a login in 300 s"
      '
      cat > /tmp/docuseal-bootstrap.rb <<'RUBY'
      if User.exists?
        puts 'DocuSeal bootstrap: a user exists, setup is already complete.'
      else
        email = ENV['DOCUSEAL_ADMIN_EMAIL'].to_s.strip
        password = ENV['DOCUSEAL_ADMIN_PASSWORD'].to_s
        app_url = ENV['DOCUSEAL_APP_URL'].to_s.strip
        abort 'DocuSeal bootstrap: DOCUSEAL_ADMIN_PASSWORD is missing or shorter than 12 characters; refusing to start with the setup page open.' if password.length < 12
        abort 'DocuSeal bootstrap: DOCUSEAL_ADMIN_EMAIL is not a valid email.' unless email.match?(User::VALIDATE_EMAIL_REGEXP)
        abort 'DocuSeal bootstrap: DOCUSEAL_APP_URL is not an http(s) URL.' unless URI.parse(app_url).is_a?(URI::HTTP)
        ActiveRecord::Base.transaction do
          account = Account.create!(name: 'DocuSeal', timezone: 'UTC', locale: 'en-US')
          account.users.create!(first_name: 'Admin', last_name: '', email: email, password: password,
                                role: User::ADMIN_ROLE)
          account.encrypted_configs.create!([
            { key: EncryptedConfig::APP_URL_KEY, value: app_url },
            { key: EncryptedConfig::ESIGN_CERTS_KEY, value: GenerateCertificate.call.transform_values(&:to_pem) }
          ])
          account.account_configs.create!(key: :fulltext_search, value: true) if SearchEntry.table_exists?
        end
        user = User.find_by(email: email)
        abort 'DocuSeal bootstrap: the admin was not created.' unless user&.valid_password?(password)
        puts 'DocuSeal bootstrap: created the admin from DOCUSEAL_ADMIN_EMAIL / DOCUSEAL_ADMIN_PASSWORD.'
      end
      RUBY
      /app/bin/rails runner /tmp/docuseal-bootstrap.rb
      rm -f /tmp/docuseal-bootstrap.rb
      exec /app/bin/bundle exec puma -C /app/config/puma.rb --dir /app
    run:
      securityContext:
        readOnlyRootFilesystem: false
        runAsUser: 2000
        runAsGroup: 2000
