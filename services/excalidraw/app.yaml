apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: excalidraw
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: Virtual whiteboard for sketching hand-drawn
      style diagrams, with live collaboration and shareable links that are end-to-end
      encrypted and stored on your own instance.
    kubero.dev/template.icon: https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@e425b1bcd4aa3e76eef3ff2ece32e38fd1ade9f5/services/excalidraw/icon.png
    kubero.dev/template.installation: 'Excalidraw has no accounts and no sign-in:
      anyone with the app URL can open the whiteboard. Drawings live in each visitor''s
      browser until they share them. Share > Live collaboration starts a room on this
      instance: send the room link to others and you draw together in real time.
      Share > Shareable link stores a snapshot anyone with the link can open. Room scenes, room images and
      shared copies are encrypted in the browser and stored on the volume at /data;
      the key is the part of the link after #, which never reaches the server, so
      only people with the link can read a drawing. Anyone with the URL can also
      create rooms and links, which use space on the volume (writes stop when it
      is 95% full). Keep one replica: the collaboration relay keeps rooms in memory.
      The image is built from upstream Excalidraw with collaboration and storage
      on this instance instead of excalidraw.com, and without the analytics script.
      The AI diagram features and Excalidraw+ export use excalidraw.com services and
      do not work on a self-hosted instance. No database, SMTP or S3 is needed.'
    kubero.dev/template.links: '["https://docs.excalidraw.com", "https://github.com/excalidraw/excalidraw",
      "https://github.com/stackblaze/stack-templates/tree/main/services/excalidraw/image"]'
    kubero.dev/template.screenshots: '["https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@e425b1bcd4aa3e76eef3ff2ece32e38fd1ade9f5/services/excalidraw/screenshot-board.png", "https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@e425b1bcd4aa3e76eef3ff2ece32e38fd1ade9f5/services/excalidraw/screenshot-collab.png", "https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@e425b1bcd4aa3e76eef3ff2ece32e38fd1ade9f5/services/excalidraw/screenshot-export.png"]'
    kubero.dev/template.source: https://github.com/excalidraw/excalidraw
    kubero.dev/template.categories: '["documentation", "work", "collaboration"]'
    kubero.dev/template.title: Excalidraw
    kubero.dev/template.website: https://excalidraw.com/
  labels:
    manager: kubero
spec:
  name: excalidraw
  deploymentstrategy: docker
  addons: []
  envVars: []
  # Encrypted room scenes, room images and shareable-link copies
  # (image/server/server.mjs: /data/rooms, /data/files, /data/scenes).
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /data
    name: '{{STACKBLAZE_APP_NAME}}-data'
    size: 2Gi
    storageClass: shared
  cronjobs: []
  # One replica: the collaboration relay (socket.io) keeps rooms in memory.
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  healthcheck:
    enabled: true
    # writes a probe file to /data, so it fails if the volume is not writable
    path: /api/v2/health
    startupSeconds: 120
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '8080'
    pullPolicy: IfNotPresent
    # Built by .github/workflows/build-excalidraw.yaml from services/excalidraw/image
    # (upstream publishes only :latest). <upstream date>-<upstream commit>.
    repository: ghcr.io/stackblaze/stack-templates/excalidraw
    tag: 2026.11.12-1440f2d
    run:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: false
