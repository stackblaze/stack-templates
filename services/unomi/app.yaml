apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: unomi
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: Open-source Java/OSGi Customer Data Platform
      that manages profiles, segments and events with a privacy-first context server
      and standards-based API.
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/unomi/icon.png
    kubero.dev/template.installation: "Apache Unomi 3.x requires Elasticsearch 9.x\
      \ for all profile/event/segment storage. This template provisions a single-node\
      \ Elasticsearch 9.1.3 companion app (unomi-elasticsearch, wired through\
      \ UNOMI_ELASTICSEARCH_ADDRESSES; small heap for the default service size, raise\
      \ ES_JAVA_OPTS with the size) automatically; for production HA you may point UNOMI_ELASTICSEARCH_ADDRESSES at an external\
      \ cluster instead. Unomi's Karaf runtime state lives on the persistent volume\
      \ at /opt/apache-unomi/data. The HTTP context-server and REST API listen on\
      \ 8181 (TLS :9443 and Karaf SSH :8102 are also exposed but need separate routing).\
      \ Rotate UNOMI_THIRDPARTY_PROVIDER1_KEY and UNOMI_ROOT_PASSWORD from the placeholders\
      \ before production; tighten UNOMI_THIRDPARTY_PROVIDER1_IPADDRESSES from 0.0.0.0/0.\
      \ Manage profiles and rules via the REST API / Karaf console \u2014 there is\
      \ no bundled web admin UI."
    kubero.dev/template.links: '["https://unomi.apache.org/manual/latest/index.html",
      "https://github.com/apache/unomi/tree/master/docker"]'
    kubero.dev/template.screenshots: '["https://unomi.apache.org/assets/images/apache-unomi-380x85.png"]'
    kubero.dev/template.source: https://github.com/apache/unomi
    kubero.dev/template.categories: '["data", "crm", "automation"]'
    kubero.dev/template.title: Apache Unomi
    kubero.dev/template.website: https://unomi.apache.org
  labels:
    manager: kubero
spec:
  name: unomi
  deploymentstrategy: docker
  # No add-ons: the former "Elasticsearch" entry was a Valkey add-on (which
  # Unomi does not use) carrying an Elasticsearch Deployment, PVC and Service
  # in its resourceDefinitions, plus a privileged sysctl init container. The
  # server refuses both (#136); Elasticsearch is now the companion app below.
  addons: []
  envVars:
  # The Elasticsearch companion app below. Sibling apps of a catalog group
  # are reached as <nameHint>-<suffix>-kuberoapp on port 80.
  - name: UNOMI_ELASTICSEARCH_ADDRESSES
    value: unomi-elasticsearch-{{KUBERO_NAME_SUFFIX}}-kuberoapp:80
  - name: UNOMI_ELASTICSEARCH_CLUSTERNAME
    value: contextElasticSearch
  - name: UNOMI_CLUSTER_PUBLIC_ADDRESS
    value: '{{KUBERO_APP_URL}}'
  - name: UNOMI_CLUSTER_INTERNAL_ADDRESS
    value: http://localhost:8181
  - name: UNOMI_THIRDPARTY_PROVIDER1_KEY
    value: replace-with-openssl-rand-hex-32
  - name: UNOMI_THIRDPARTY_PROVIDER1_IPADDRESSES
    value: 0.0.0.0/0,::1,127.0.0.1
  - name: UNOMI_ROOT_PASSWORD
    value: replace-with-openssl-rand-hex-16
  - name: KARAF_OPTS
    value: -Dunomi.autoStart=true
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /opt/apache-unomi/data
    name: '{{KUBERO_APP_NAME}}-data'
    size: 2Gi
    storageClass: shared
  cronjobs: []
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: '1'
      memory: 2Gi
  healthcheck:
    enabled: true
    path: /
    startupSeconds: 900
    timeoutSeconds: 5
    periodSeconds: 10
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  image:
    containerPort: '8181'
    pullPolicy: Always
    repository: docker.io/apache/unomi
    tag: 3.0.0
    command:
    - bash
    - -c
    - sed -i '/org.ops4j.pax.web.config.file/d' /opt/apache-unomi/etc/org.ops4j.pax.web.cfg
      && exec ./entrypoint.sh
    run:
      securityContext:
        readOnlyRootFilesystem: false
  # Single-node Elasticsearch 9 for Unomi, as its own app. No privileged
  # sysctl init container (not allowed): with discovery.type=single-node the
  # bootstrap checks (vm.max_map_count among them) are not enforced, and
  # mmap is turned off so the node's default max_map_count is enough. The
  # chown init container is not needed either: app pods run with fsGroup
  # 1000, the image's user. Settings use the image's ES_SETTING_* env form
  # (a double underscore is a literal underscore). Heap is kept small for the
  # default service size; raise ES_JAVA_OPTS together with the service size.
  templateServices:
  - id: elasticsearch
    nameHint: unomi-elasticsearch
    serviceType: web
    exposeInternet: false
    image:
      repository: docker.io/library/elasticsearch
      tag: 9.1.3
      containerPort: '9200'
    envVars:
    - name: ES_SETTING_DISCOVERY_TYPE
      value: single-node
    - name: ES_SETTING_XPACK_SECURITY_ENABLED
      value: 'false'
    - name: ES_SETTING_CLUSTER_NAME
      value: contextElasticSearch
    - name: ES_SETTING_NODE_STORE_ALLOW__MMAP
      value: 'false'
    - name: ES_SETTING_BOOTSTRAP_MEMORY__LOCK
      value: 'false'
    - name: ES_JAVA_OPTS
      value: -Xms256m -Xmx256m
    extraVolumes:
    - accessModes:
      - ReadWriteMany
      emptyDir: false
      mountPath: /usr/share/elasticsearch/data
      name: '{{KUBERO_APP_NAME}}-es-data'
      size: 2Gi
      storageClass: shared
    healthcheck:
      enabled: true
      path: /_cluster/health
      startupSeconds: 600
      timeoutSeconds: 5
      periodSeconds: 10
