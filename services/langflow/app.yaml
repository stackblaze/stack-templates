apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: langflow
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: Visual builder for AI agents and RAG workflows.
      Drag components onto a canvas, connect any LLM or vector store, and serve
      each flow as an API.
    kubero.dev/template.icon: https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4101676552dfd463e36f50331fd559f403368be8/services/langflow/icon.png
    kubero.dev/template.installation: 'Sign in as the user in LANGFLOW_SUPERUSER
      with the password generated in LANGFLOW_SUPERUSER_PASSWORD (both under Variables).
      The first start runs database migrations and can take 2-3 minutes. Add your
      model provider keys (OpenAI, Anthropic, ...) in Settings > Global Variables;
      they are stored encrypted with LANGFLOW_SECRET_KEY, so do not change that
      key after first use.'
    kubero.dev/template.links: '["https://docs.langflow.org/"]'
    kubero.dev/template.screenshots: '["https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4101676552dfd463e36f50331fd559f403368be8/services/langflow/screenshot-agent-flow.png", "https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4101676552dfd463e36f50331fd559f403368be8/services/langflow/screenshot-rag-flow.png", "https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4101676552dfd463e36f50331fd559f403368be8/services/langflow/screenshot-flows.png"]'
    kubero.dev/template.source: https://github.com/langflow-ai/langflow
    kubero.dev/template.categories: '[ "ai", "development", "utilities" ]'
    kubero.dev/template.title: Langflow
    kubero.dev/template.website: https://www.langflow.org/
  labels:
    manager: kubero
spec:
  name: langflow
  deploymentstrategy: docker
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: langflow
              owner: langflow
              secret:
                name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO langflow
              - GRANT CREATE ON SCHEMA public TO langflow
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO langflow
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: langflow
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
  envVars:
  - name: LANGFLOW_DATABASE_URL
    value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  - name: LANGFLOW_CONFIG_DIR
    value: /app/langflow
  - name: LANGFLOW_AUTO_LOGIN
    value: 'false'
  - name: LANGFLOW_SUPERUSER
    value: admin
  - name: LANGFLOW_SUPERUSER_PASSWORD
    value: '{{STACKBLAZE_GEN_ALNUM:24}}'
  # Exactly 43 chars: Langflow treats a key of 32+ chars as url-safe base64
  # and Fernet needs it to decode to exactly 32 bytes (43 chars + padding).
  # 48 chars decodes to 36 bytes and every encrypted variable save fails.
  - name: LANGFLOW_SECRET_KEY
    value: '{{STACKBLAZE_GEN_ALNUM:43}}'
  - name: LANGFLOW_WORKERS
    value: '1'
  - name: LANGFLOW_LOG_LEVEL
    value: info
  - name: DO_NOT_TRACK
    value: 'true'
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /app/langflow
    name: '{{STACKBLAZE_APP_NAME}}-data'
    size: 5Gi
    storageClass: shared
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  image:
    containerPort: '7860'
    pullPolicy: IfNotPresent
    repository: docker.io/langflowai/langflow
    tag: '1.13.2'
    run:
      securityContext:
        readOnlyRootFilesystem: false
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 3Gi
  healthcheck:
    enabled: true
    path: /health
    startupSeconds: 300
    timeoutSeconds: 5
    periodSeconds: 10
