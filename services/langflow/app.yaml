apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: langflow
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: Visual builder for AI agents and RAG workflows.
      Drag components onto a canvas, connect any LLM or vector store, and serve
      each flow as an API.
    kubero.dev/template.icon: https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4101676552dfd463e36f50331fd559f403368be8/services/langflow/icon.png
    kubero.dev/template.installation: 'Sign in as the user in LANGFLOW_SUPERUSER
      with the password generated in LANGFLOW_SUPERUSER_PASSWORD (both under Variables).
      The first start runs database migrations and can take 2-3 minutes. Add your
      model provider keys (OpenAI, Anthropic, ...) in Settings > Global Variables;
      they are stored encrypted with LANGFLOW_SECRET_KEY, so do not change that
      key after first use. Your own model (optional, any OpenAI-compatible
      server): set MODEL_URL (base URL ending in /v1), MODEL_API_KEY and
      MODEL_NAME under Variables. After the restart they are Global Variables
      of the same names. In an OpenAI component, type the base URL
      (MODEL_URL''s value) into OpenAI API Base, pick MODEL_API_KEY with the
      globe icon of the API Key field, and type the model name: Langflow
      does not allow environment variables in non-secret fields. MODEL_URL''s
      host is allowlisted for MODEL_API_KEY automatically
      (LANGFLOW_PROVIDER_CREDENTIAL_ALLOWED_HOSTS).'
    kubero.dev/template.links: '["https://docs.langflow.org/"]'
    kubero.dev/template.screenshots: '["https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4101676552dfd463e36f50331fd559f403368be8/services/langflow/screenshot-agent-flow.png", "https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4101676552dfd463e36f50331fd559f403368be8/services/langflow/screenshot-rag-flow.png", "https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4101676552dfd463e36f50331fd559f403368be8/services/langflow/screenshot-flows.png"]'
    kubero.dev/template.source: https://github.com/langflow-ai/langflow
    kubero.dev/template.categories: '[ "ai", "development", "utilities" ]'
    kubero.dev/template.title: Langflow
    kubero.dev/template.website: https://www.langflow.org/
  labels:
    manager: kubero
spec:
  name: langflow
  deploymentstrategy: docker
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: langflow
              owner: langflow
              secret:
                name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO langflow
              - GRANT CREATE ON SCHEMA public TO langflow
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO langflow
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: langflow
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
  envVars:
  - name: LANGFLOW_DATABASE_URL
    value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  - name: LANGFLOW_CONFIG_DIR
    value: /app/langflow
  - name: LANGFLOW_AUTO_LOGIN
    value: 'false'
  - name: LANGFLOW_SUPERUSER
    value: admin
  - name: LANGFLOW_SUPERUSER_PASSWORD
    value: '{{STACKBLAZE_GEN_ALNUM:24}}'
  # Exactly 43 chars: Langflow treats a key of 32+ chars as url-safe base64
  # and Fernet needs it to decode to exactly 32 bytes (43 chars + padding).
  # 48 chars decodes to 36 bytes and every encrypted variable save fails.
  - name: LANGFLOW_SECRET_KEY
    value: '{{STACKBLAZE_GEN_ALNUM:43}}'
  - name: LANGFLOW_WORKERS
    value: '1'
  - name: LANGFLOW_LOG_LEVEL
    value: info
  - name: DO_NOT_TRACK
    value: 'true'
  # YOUR OWN MODEL (optional): an OpenAI-compatible server, such as vLLM on
  # a rented GPU or the LiteLLM app. Its base URL (ending in /v1), its API
  # key or password, and the model name. Same names as the Kestra, LiteLLM
  # and vLLM templates.
  - name: MODEL_URL
    value: ''
  - name: MODEL_API_KEY
    value: ''
  - name: MODEL_NAME
    value: ''
  # Langflow turns these into Global Variables (Settings > Global Variables)
  # at start, so a flow picks them from the globe icon of a field. Empty ones
  # are skipped; a changed value updates the variable on restart.
  - name: LANGFLOW_VARIABLES_TO_GET_FROM_ENVIRONMENT
    value: MODEL_URL,MODEL_API_KEY,MODEL_NAME
  # Langflow only sends a key that comes from the server environment (such as
  # MODEL_API_KEY) to a provider's own endpoint or to hosts listed here. The
  # start command adds MODEL_URL's host automatically; list any other hosts
  # (comma-separated) yourself.
  - name: LANGFLOW_PROVIDER_CREDENTIAL_ALLOWED_HOSTS
    value: ''
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /app/langflow
    name: '{{STACKBLAZE_APP_NAME}}-data'
    size: 5Gi
    storageClass: shared
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  image:
    containerPort: '7860'
    pullPolicy: IfNotPresent
    repository: docker.io/langflowai/langflow
    tag: '1.13.2'
    # The image's own command is `langflow run` (no entrypoint; Debian-based
    # Python image, so /bin/sh exists). It is kept; the wrapper only adds
    # MODEL_URL's host to LANGFLOW_PROVIDER_CREDENTIAL_ALLOWED_HOSTS first.
    command:
    - /bin/sh
    - -c
    - |
      if [ -n "$MODEL_URL" ]; then
        h="${MODEL_URL#*://}"; h="${h%%/*}"; h="${h%%:*}"
        case ",$LANGFLOW_PROVIDER_CREDENTIAL_ALLOWED_HOSTS," in
          *",$h,"*) ;;
          *) export LANGFLOW_PROVIDER_CREDENTIAL_ALLOWED_HOSTS="${LANGFLOW_PROVIDER_CREDENTIAL_ALLOWED_HOSTS:+$LANGFLOW_PROVIDER_CREDENTIAL_ALLOWED_HOSTS,}$h" ;;
        esac
      fi
      exec langflow run
    run:
      securityContext:
        readOnlyRootFilesystem: false
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 3Gi
  healthcheck:
    enabled: true
    path: /health
    startupSeconds: 300
    timeoutSeconds: 5
    periodSeconds: 10
