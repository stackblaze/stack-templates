apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: akaunting
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "Manage invoices, expenses, customers, and financial reporting from one approachable dashboard. A practical alternative to QuickBooks and FreshBooks."
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/akaunting/icon.png
    kubero.dev/template.installation: "Akaunting is a Laravel app backed by MariaDB/MySQL\
      \ (it does NOT support Postgres). On first boot the entrypoint installs the\
      \ schema and seeds the admin user from ADMIN_EMAIL/ADMIN_PASSWORD, then the\
      \ web installer is bypassed. Rotate the MariaDB password (default 'akaunting'),\
      \ ADMIN_PASSWORD, and APP_KEY (must be a 32-char value; the placeholder is intentionally\
      \ weak \u2014 regenerate with 'php artisan key:generate' or set base64:<openssl\
      \ rand -base64 32>). After the DB add-on is healthy, log in at the app URL with\
      \ ADMIN_EMAIL/ADMIN_PASSWORD and change the admin password immediately. Uploaded\
      \ files, generated PDFs, and logos persist under /var/www/html/storage (mounted\
      \ volume)."
    kubero.dev/template.links: '["https://akaunting.com/hc/docs/on-premise/installation/",
      "https://github.com/akaunting/docker"]'
    kubero.dev/template.screenshots: '[]'
    kubero.dev/template.source: https://github.com/akaunting/akaunting
    kubero.dev/template.categories: '["finance", "erp", "work"]'
    kubero.dev/template.title: "Akaunting Finance"
    kubero.dev/template.website: https://akaunting.com
  labels:
    manager: kubero
spec:
  name: akaunting
  deploymentstrategy: docker
  addons:
  - displayName: MariaDB
    env: []
    icon: /img/addons/mysql.svg
    id: kubero-operator
    kind: MariaDB
    resourceDefinitions:
      MariaDB:
        apiVersion: k8s.mariadb.com/v1alpha1
        kind: MariaDB
        metadata:
          name: '{{KUBERO_APP_NAME}}-mysql'
        spec:
          metrics:
            enabled: true
          rootPasswordSecretKeyRef:
            name: '{{KUBERO_APP_NAME}}-mysql-root'
            key: password
          database: akaunting
          username: akaunting
          passwordSecretKeyRef:
            name: '{{KUBERO_APP_NAME}}-mysql-app'
            key: password
          storage:
            size: 5Gi
            storageClassName: fast
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
      rootSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-mysql-root'
        type: Opaque
        stringData:
          password: akaunting
      appSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-mysql-app'
        type: Opaque
        stringData:
          password: akaunting
  # Platform email (see README "Email contract"). Laravel MAIL_* mapping.
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env:
    - name: MAIL_MAILER
      value: smtp
    - name: MAIL_HOST
      value: '$(SMTP_HOST)'
    - name: MAIL_PORT
      value: '$(SMTP_PORT)'
    - name: MAIL_USERNAME
      value: '$(SMTP_USER)'
    - name: MAIL_PASSWORD
      value: '$(SMTP_PASSWORD)'
    - name: MAIL_ENCRYPTION
      value: tls
    - name: MAIL_FROM_ADDRESS
      value: '$(SMTP_FROM)'
    - name: MAIL_FROM_NAME
      value: Akaunting
    resourceDefinitions: {}
  # Platform object storage (RustFS Tenant → communal-s3 logical bucket
  # on shared). Laravel filesystem S3 disk; compose from injected S3_*/AWS_*
  # in envVars (same $(VAR) pattern as PGHOST — Tenant always provisions).

  - displayName: RustFS
    env: []
    icon: /img/addons/rustfs.svg
    id: kubero-operator
    kind: Tenant
    resourceDefinitions:
      Tenant:
        apiVersion: rustfs.com/v1alpha1
        kind: Tenant
        metadata:
          name: '{{KUBERO_APP_NAME}}-rustfs'
          annotations:
            # The operator refuses custom-repo images it cannot verify for
            # RuntimeDefault seccomp ("WorkloadSecurityIncompatible") unless the
            # exact reference is acknowledged. Keep in sync with spec.image.
            operator.rustfs.com/runtime-default-image-ack: registry.stackblaze.cloud/rustfs/rustfs:1.0.0-beta.10
        spec:
          image: registry.stackblaze.cloud/rustfs/rustfs:1.0.0-beta.10
          credsSecret:
            name: '{{KUBERO_APP_NAME}}-rustfs-credentials'
          pools:
          - name: pool-0
            servers: 1
            persistence:
              volumesPerServer: 4
              volumeClaimTemplate:
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 2Gi
                storageClassName: slow
      credsSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-rustfs-credentials'
        type: Opaque
        stringData:
          accesskey: akaunting
          secretkey: '{{KUBERO_GEN_HEX:32}}'

  envVars:
  - name: APP_URL
    value: '{{KUBERO_APP_URL}}'
  - name: APP_ENV
    value: production
  - name: APP_DEBUG
    value: 'false'
  - name: APP_LOCALE
    value: en-US
  - name: AKAUNTING_SETUP
    value: 'true'
  - name: DB_CONNECTION
    value: mysql
  - name: DB_HOST
    value: '$(MYSQL_HOST)'
  - name: DB_PORT
    value: '$(MYSQL_PORT)'
  - name: DB_DATABASE
    value: '$(MYSQL_DATABASE)'
  - name: DB_NAME
    value: '$(MYSQL_DATABASE)'
  - name: DB_USERNAME
    value: '$(MYSQL_USER)'
  - name: DB_PASSWORD
    value: '$(MYSQL_PASSWORD)'
  - name: DB_PREFIX
    value: ak_
  - name: COMPANY_NAME
    value: My Company
  - name: COMPANY_EMAIL
    value: admin@example.com
  - name: ADMIN_EMAIL
    value: admin@example.com
  - name: ADMIN_PASSWORD
    value: replace-with-strong-password
  - name: LOCALE
    value: en-US
  - name: FILESYSTEM_DISK
    value: s3
  - name: FILESYSTEM_CLOUD
    value: s3
  - name: AWS_BUCKET
    value: '$(S3_BUCKET)'
  - name: AWS_ENDPOINT
    value: '$(S3_ENDPOINT)'
  - name: AWS_USE_PATH_STYLE_ENDPOINT
    value: 'true'
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /var/www/html/storage
    name: '{{KUBERO_APP_NAME}}-data'
    size: 2Gi
    storageClass: shared
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  healthcheck:
    enabled: true
    path: /manifest.json
    startupSeconds: 600
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '80'
    pullPolicy: Always
    repository: registry.stackblaze.cloud/akaunting/akaunting
    tag: latest
    run:
      securityContext:
        readOnlyRootFilesystem: false
