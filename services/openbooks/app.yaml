apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: openbooks
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "Run accounting, projects, job costing, inventory, payroll, and month-end close on one audit-ready ledger. A modern alternative to NetSuite, Sage Intacct, Acumatica, and Odoo — currently in alpha."
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/openbooks/icon.png
    kubero.dev/template.installation: "OpenBooks is ALPHA and not open for deploy\
      \ on StackBlaze shared plans yet. Bootstrap creates PostgreSQL roles (openbooks_read)\
      \ and needs privileges communal tenant logins do not have. Dedicated Postgres\
      \ works but burns a limited volume slot — we are not offering that path. Upstream\
      \ precreated-roles support is tracked at https://github.com/braedonsaunders/openbooks/pull/29;\
      \ deploy will open after that and our communal hook land. Do not deploy from\
      \ the dashboard in the meantime. Image ghcr.io/braedonsaunders/openbooks:0.1.0-alpha.17.\
      \ Valkey is bundled. Health: GET /api/v1/health."
    kubero.dev/template.links: '["https://github.com/braedonsaunders/openbooks", "https://github.com/braedonsaunders/openbooks/blob/main/SECURITY.md"]'
    kubero.dev/template.screenshots: '["https://raw.githubusercontent.com/braedonsaunders/openbooks/main/.github/assets/screenshots/executive-dashboard.jpg",
      "https://raw.githubusercontent.com/braedonsaunders/openbooks/main/.github/assets/screenshots/profit-and-loss.jpg",
      "https://raw.githubusercontent.com/braedonsaunders/openbooks/main/.github/assets/screenshots/project-profitability.jpg"]'
    kubero.dev/template.source: https://github.com/braedonsaunders/openbooks
    kubero.dev/template.categories: '["finance", "erp", "work"]'
    kubero.dev/template.title: "OpenBooks Financial ERP"
    kubero.dev/template.website: https://openbooks-site.vercel.app
  labels:
    manager: kubero
spec:
  name: openbooks
  deploymentstrategy: docker
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    # Bootstrap runs CREATE ROLE. Communal logical logins cannot. Keep a real
    # CNPG cluster so the injected PGUSER is the postgres superuser.
    mode: server
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 10Gi
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: '1'
              memory: 2Gi
          bootstrap:
            initdb:
              database: openbooks
              owner: openbooks
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO openbooks
              - GRANT CREATE ON SCHEMA public TO openbooks
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO openbooks
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: openbooks-change-me-min-24-chars
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: openbooks
          # OpenBooks requires the runtime DB password to be ≥24 characters.
          password: openbooks-change-me-min-24-chars
  - displayName: Valkey
    env: []
    icon: /img/addons/redis.svg
    id: kubero-operator
    kind: Valkey
    resourceDefinitions:
      Valkey:
        apiVersion: rds.valkey.buf.red/v1alpha1
        kind: Valkey
        metadata:
          name: '{{KUBERO_APP_NAME}}-valkey'
        spec:
          version: '8.0'
          arch: replica
          replicas:
            shards: 1
            replicasOfShard: 1
          access:
            serviceType: ClusterIP
          storage:
            capacity: 1Gi
            storageClassName: fast
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
  # Platform email (see README "Email contract"). OpenBooks configures the
  # mail provider in Admin → Email; SMTP_* is injected while Email is live so
  # the host/user/password/from can be pasted there (no native env mapping).
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env: []
    resourceDefinitions: {}
  # Platform object storage (RustFS Tenant → communal-s3 logical bucket
  # on shared). OpenBooks reads S3_*; rename access keys from the
  # injected AWS_* contract (S3_ENDPOINT/S3_BUCKET arrive as-is).

  - displayName: RustFS
    env: []
    icon: /img/addons/rustfs.svg
    id: kubero-operator
    kind: Tenant
    resourceDefinitions:
      Tenant:
        apiVersion: rustfs.com/v1alpha1
        kind: Tenant
        metadata:
          name: '{{KUBERO_APP_NAME}}-rustfs'
          annotations:
            # The operator refuses custom-repo images it cannot verify for
            # RuntimeDefault seccomp ("WorkloadSecurityIncompatible") unless the
            # exact reference is acknowledged. Keep in sync with spec.image.
            operator.rustfs.com/runtime-default-image-ack: registry.stackblaze.cloud/rustfs/rustfs:1.0.0-beta.10
        spec:
          image: registry.stackblaze.cloud/rustfs/rustfs:1.0.0-beta.10
          credsSecret:
            name: '{{KUBERO_APP_NAME}}-rustfs-credentials'
          pools:
          - name: pool-0
            servers: 1
            persistence:
              volumesPerServer: 4
              volumeClaimTemplate:
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 2Gi
                storageClassName: slow
      credsSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-rustfs-credentials'
        type: Opaque
        stringData:
          accesskey: openbooks
          secretkey: '{{KUBERO_GEN_HEX:32}}'

  envVars:
  - name: NODE_ENV
    value: production
  # Next.js SSR OOMs on the default ~256MB heap during first compile.
  # Pod limit is 3Gi — give V8 room without eating the whole limit.
  - name: NODE_OPTIONS
    value: '--max-old-space-size=2048'
  - name: HOSTNAME
    value: 0.0.0.0
  - name: PORT
    value: '3000'
  # Dedicated CNPG injects PGUSER=postgres (superuser). Bootstrap uses that
  # connection to CREATE ROLE. The running app and worker use openbooks_app,
  # which bootstrap creates from OPENBOOKS_RUNTIME_DB_URL. Password must be
  # >= 24 characters (OpenBooks rejects shorter runtime passwords).
  - name: OPENBOOKS_APP_PASSWORD
    value: '{{KUBERO_GEN_HEX:32}}'
  - name: OPENBOOKS_DB_URL
    value: 'postgres://openbooks_app:$(OPENBOOKS_APP_PASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  - name: OPENBOOKS_RUNTIME_DB_URL
    value: 'postgres://openbooks_app:$(OPENBOOKS_APP_PASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  - name: OPENBOOKS_MIGRATION_DB_URL
    value: 'postgres://postgres:$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  - name: OPENBOOKS_REDIS_URL
    value: 'redis://$(REDISHOST):$(REDISPORT)'
  - name: OPENBOOKS_APP_URL
    value: '{{KUBERO_APP_URL}}'
  - name: APP_BASE_URL
    value: '{{KUBERO_APP_URL}}'
  - name: OPENBOOKS_TRUST_PROXY
    value: '1'
  - name: SESSION_SECRET
    value: '{{KUBERO_GEN_HEX:64}}'
  - name: OPENBOOKS_DATA_KEY
    value: '{{KUBERO_GEN_HEX:64}}'
  - name: OPENBOOKS_INTERNAL_TOKEN
    value: '{{KUBERO_GEN_HEX:48}}'
  # Worker → web (same-app Service targets web pods).
  # Same-pod loopback. The Kubero Service only exposes :80 (→ container :3000);
  # http://{{KUBERO_APP_NAME}}:3000 hangs SSR and leaves the UI on the splash.
  - name: OPENBOOKS_INTERNAL_URL
    value: 'http://127.0.0.1:3000'
  - name: ORG_NAME
    value: OpenBooks
  - name: ORG_COUNTRY
    value: US
  - name: ORG_CURRENCY
    value: USD
  - name: ADMIN_EMAIL
    value: admin@example.com
  - name: ADMIN_NAME
    value: Administrator
  # Fixed ≥24-char password so catalog e2e can sign in without scraping
  # a generated secret from the deploy. Rotate for production.
  - name: ADMIN_PASSWORD
    value: KuberoQaOpenBooksPass123
  - name: S3_REGION
    value: '$(AWS_REGION)'
  - name: S3_ACCESS_KEY_ID
    value: '$(AWS_ACCESS_KEY_ID)'
  - name: S3_SECRET_ACCESS_KEY
    value: '$(AWS_SECRET_ACCESS_KEY)'
  extraVolumes: []
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 1
  resources:
    requests:
      cpu: 500m
      memory: 1536Mi
    limits:
      cpu: '2'
      memory: 3Gi
  healthcheck:
    enabled: true
    path: /api/v1/health
    startupSeconds: 1500
    timeoutSeconds: 10
    periodSeconds: 15
  image:
    containerPort: '3000'
    pullPolicy: IfNotPresent
    # Prefer ghcr.io so regional zot pull-through can cache it.
    repository: ghcr.io/braedonsaunders/openbooks
    tag: 0.1.0-alpha.17
    # Chart shares this command for web and worker; branch on PROC_TYPE.
    # Bootstrap must not leave OPENBOOKS_BOOTSTRAP=1 on the long-running web
    # process (that would keep using the migration connection selector).
    command:
    - sh
    - -c
    - >-
      if [ "$PROC_TYPE" = worker ]; then
        exec node scripts/worker.mjs;
      else
        OPENBOOKS_BOOTSTRAP=1 node scripts/bootstrap.mjs &&
        exec env -u OPENBOOKS_BOOTSTRAP node web/server.js;
      fi
    run:
      securityContext:
        readOnlyRootFilesystem: false
