apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: mattermost
  annotations:
    kubero.dev/template.architecture: '["arm64", "amd64"]'
    kubero.dev/template.description: "Mattermost is an open-source, self-hosted collaboration\
      \ platform for messaging, file sharing and ChatOps \u2014 an alternative to\
      \ Slack."
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/mattermost/icon.png
    kubero.dev/template.installation: Ships the MIT-licensed Team Edition. Set MM_SERVICESETTINGS_SITEURL
      to your public URL before going live, then create the initial admin at
      /signup_user_complete on first visit.
    kubero.dev/template.links: '["https://docs.mattermost.com/"]'
    kubero.dev/template.screenshots: '["https://media.stackblaze.cloud/templates/mattermost/demo.mp4", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/mattermost/dashboard.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/mattermost/screenshot-town-square.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/mattermost/screenshot-engineering.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/mattermost/screenshot-product-launch.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/mattermost/screenshot-releases.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/mattermost/screenshot-customer-success.png"]'
    kubero.dev/template.source: https://github.com/mattermost/mattermost
    kubero.dev/template.categories: '["communication", "work"]'
    kubero.dev/template.title: Mattermost
    kubero.dev/template.website: https://mattermost.com/
  labels:
    manager: kubero
spec:
  name: mattermost
  deploymentstrategy: docker
  envVars:
  - name: MM_SERVICESETTINGS_SITEURL
    value: '{{KUBERO_APP_URL}}'
  - name: MM_SQLSETTINGS_DRIVERNAME
    value: postgres
  - name: MM_SQLSETTINGS_DATASOURCE
    value: 'postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)?sslmode=disable&connect_timeout=10'
  - name: TZ
    value: Etc/UTC
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    storageClass: shared
    emptyDir: false
    mountPath: /mattermost/data
    name: '{{KUBERO_APP_NAME}}-data'
    size: 5Gi
  cronjobs: []
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: mattermost
              owner: mattermost
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: mattermost
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: mattermost
          password: mattermost
  # Platform email (see README "Email contract"). Applied only while the
  # Email add-on is live (paid plans); without it Mattermost keeps its
  # defaults (SendEmailNotifications=false, no SMTP server) and simply does
  # not mail. Env-set values show as locked in the System Console.
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env:
    - name: MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS
      value: 'true'
    - name: MM_EMAILSETTINGS_SMTPSERVER
      value: '$(SMTP_HOST)'
    - name: MM_EMAILSETTINGS_SMTPPORT
      value: '$(SMTP_PORT)'
    - name: MM_EMAILSETTINGS_ENABLESMTPAUTH
      value: 'true'
    - name: MM_EMAILSETTINGS_SMTPUSERNAME
      value: '$(SMTP_USER)'
    - name: MM_EMAILSETTINGS_SMTPPASSWORD
      value: '$(SMTP_PASSWORD)'
    - name: MM_EMAILSETTINGS_CONNECTIONSECURITY
      value: STARTTLS
    - name: MM_EMAILSETTINGS_FEEDBACKEMAIL
      value: '$(SMTP_FROM)'
    - name: MM_EMAILSETTINGS_REPLYTOADDRESS
      value: '$(SMTP_FROM)'
    - name: MM_EMAILSETTINGS_FEEDBACKNAME
      value: Mattermost
    resourceDefinitions: {}
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  image:
    containerPort: '8065'
    pullPolicy: IfNotPresent
    # Referenced as docker.io on purpose: zone nodes mirror docker.io through
    # the regional registry (containerd hosts.d -> registry.<region>/v2/docker,
    # the zot in each services cluster, on-demand sync, Docker Hub fallback).
    # Anonymous read, no pull secret. Not registry.stackblaze.cloud (sfo zot,
    # 503). Pinned patch tag, not :latest and not the floating 10.5 tag.
    # Modern Mattermost images are shell-less. Use the default entrypoint.
    repository: docker.io/mattermost/mattermost-team-edition
    tag: '10.5.14'
    run:
      securityContext:
        readOnlyRootFilesystem: false
