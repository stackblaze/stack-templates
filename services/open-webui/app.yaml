apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: open-webui
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "Self-hosted ChatGPT-style AI chat for Ollama and OpenAI-compatible APIs, with chat over your documents (RAG), multi-model chats and MCP tool servers. Locked down and run in a Kata micro-VM."
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/0f041325c384fa2e69637f16f09678492358586b/services/open-webui/icon.png
    kubero.dev/template.installation: "Sign in at the app URL as admin@example.com (WEBUI_ADMIN_EMAIL) with the password generated in WEBUI_ADMIN_PASSWORD (under Variables). The admin is created on first start, so nobody can claim the instance first, and sign-up is closed (ENABLE_SIGNUP=false): add people in Admin Panel > Users (there is no email, so no invites or password resets by mail; the admin sets passwords there). WEBUI_ADMIN_PASSWORD is only read on the very first start; change the password later in Settings > Account. Models: deploy the Ollama template in the same project and it answers at http://ollama (OLLAMA_BASE_URL, port 80, no :11434), or set OPENAI_API_KEY / OPENAI_API_BASE_URL for an OpenAI-compatible API. This is the slim image, so documents are embedded by Ollama with nomic-embed-text (pull it, e.g. MODELS_TO_PULL on the Ollama app) or by an API you choose in Admin Panel > Settings > Documents. Users, chats and document vectors (pgvector) are stored in the Postgres add-on; uploaded files on the data volume. Locked down: Tools and Functions (Python that would run on the server) and pip installs are switched off by environment variables, so the admin panel cannot turn them on; MCP/OpenAPI tool servers still work. Telemetry, the version check and community sharing are off. Runs in a Kata micro-VM. Never change WEBUI_SECRET_KEY after the first start. Licence: Open WebUI License (BSD-3 with a branding clause). Open WebUI 0.13.3."
    kubero.dev/template.links: '["https://docs.openwebui.com/", "https://github.com/open-webui/open-webui"]'
    kubero.dev/template.screenshots: '["https://raw.githubusercontent.com/stackblaze/stack-templates/0f041325c384fa2e69637f16f09678492358586b/services/open-webui/screenshot-chat.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/0f041325c384fa2e69637f16f09678492358586b/services/open-webui/screenshot-rag.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/0f041325c384fa2e69637f16f09678492358586b/services/open-webui/screenshot-admin.png"]'
    kubero.dev/template.source: https://github.com/open-webui/open-webui
    kubero.dev/template.categories: '["ai", "utilities"]'
    kubero.dev/template.title: Open WebUI
    kubero.dev/template.website: https://openwebui.com
  labels:
    manager: kubero
spec:
  name: open-webui
  deploymentstrategy: docker
  # Kata micro-VM (Dean, 2026-11-14): Open WebUI runs as root and upstream can
  # exec admin-written Python (Tools/Functions) in the web process. Those are
  # switched off below, but the tenant can switch them back on, so the VM is the
  # hard boundary. Under Kata the limits below are the VM's size.
  runtimeClass: kata-qemu-runtime-rs
  exposeInternet: true
  addons:
  # Postgres holds users, chats and settings (DATABASE_URL) and the RAG vectors
  # (VECTOR_DB=pgvector, same database). `vector` is not a trusted extension,
  # so it is created here as the superuser at bootstrap; the app's own
  # CREATE EXTENSION check (PGVECTOR_CREATE_EXTENSION) is then a no-op.
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: openwebui
              owner: openwebui
              secret:
                name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - CREATE EXTENSION IF NOT EXISTS vector
              - GRANT ALL ON SCHEMA public TO openwebui
              - GRANT CREATE ON SCHEMA public TO openwebui
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO openwebui
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: openwebui
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
  envVars:
  - name: DATABASE_URL
    value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  - name: VECTOR_DB
    value: pgvector
  # Signs session JWTs and encrypts MFA/OAuth secrets. Generated per deploy;
  # never change it afterwards (everyone is signed out, MFA secrets are lost).
  - name: WEBUI_SECRET_KEY
    value: '{{STACKBLAZE_GEN_ALNUM:64}}'
  - name: WEBUI_URL
    value: '{{STACKBLAZE_APP_URL}}'
  # Browsers may call the API only from the app's own URL (upstream warns about
  # the default '*'). Add a custom domain here, separated by ';'.
  - name: CORS_ALLOW_ORIGIN
    value: '{{STACKBLAZE_APP_URL}}'
  # The admin is created on first start, before the app serves any request, so
  # nobody can claim the instance by signing up first. Sign-up stays closed;
  # the admin adds users in Admin Panel > Users.
  - name: WEBUI_ADMIN_EMAIL
    value: admin@example.com
  - name: WEBUI_ADMIN_PASSWORD
    value: '{{STACKBLAZE_GEN_ALNUM:24}}'
  - name: WEBUI_ADMIN_NAME
    value: Admin
  - name: ENABLE_SIGNUP
    value: 'false'
  - name: WEBUI_AUTH_COOKIE_SECURE
    value: 'true'
  # Models: an Ollama app in the same project answers at http://ollama (port
  # 80), or set an OpenAI-compatible API key.
  - name: OLLAMA_BASE_URL
    value: http://ollama
  - name: OPENAI_API_BASE_URL
    value: https://api.openai.com/v1
  - name: OPENAI_API_KEY
    value: null
  # The slim image has no local embedding model: documents are embedded by the
  # Ollama app (ollama pull nomic-embed-text). Change it in Admin Panel >
  # Settings > Documents to use an OpenAI-compatible API instead.
  - name: RAG_EMBEDDING_ENGINE
    value: ollama
  - name: RAG_EMBEDDING_MODEL
    value: nomic-embed-text
  # Search attached files and knowledge bases on every message and add the
  # passages to the prompt ("legacy" function calling). Upstream's default
  # ("native") leaves it to the model to call a search tool, which small
  # Ollama models don't do, so their answers ignore your documents. First-run
  # default; change it in Admin Panel > Settings > Models.
  - name: DEFAULT_MODEL_PARAMS
    value: '{"function_calling": "legacy"}'
  # Lockdown: hard switches, read only from the environment. No admin- or
  # user-written Python (Tools, Functions) runs in the pod, nothing is pip
  # installed at runtime, no model repo code is imported.
  - name: ENABLE_TOOLS
    value: 'false'
  - name: ENABLE_FUNCTIONS
    value: 'false'
  - name: ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS
    value: 'false'
  - name: RAG_EMBEDDING_MODEL_TRUST_REMOTE_CODE
    value: 'false'
  - name: RAG_RERANKING_MODEL_TRUST_REMOTE_CODE
    value: 'false'
  # Keep the SSRF guard: user-supplied URLs (web pages, uploads by URL) may not
  # reach private addresses.
  - name: ENABLE_LOCAL_WEB_FETCH
    value: 'false'
  - name: ENABLE_COMMUNITY_SHARING
    value: 'false'
  - name: ENABLE_VERSION_UPDATE_CHECK
    value: 'false'
  - name: SCARF_NO_ANALYTICS
    value: 'true'
  - name: DO_NOT_TRACK
    value: 'true'
  - name: ANONYMIZED_TELEMETRY
    value: 'false'
  # Uploaded files (uploads/) and caches (cache/) live in DATA_DIR. With
  # Postgres and pgvector nothing else is written here.
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /app/backend/data
    name: '{{STACKBLAZE_APP_NAME}}-data'
    size: 5Gi
    storageClass: shared
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 2Gi
  healthcheck:
    enabled: true
    path: /health
    startupSeconds: 300
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '8080'
    pullPolicy: IfNotPresent
    repository: ghcr.io/open-webui/open-webui
    tag: v0.13.3-slim
    # Open WebUI exits when Postgres refuses the first connection (the add-on
    # often comes up after the app), so wait for a real login first, then run
    # the image's own start script (Dockerfile CMD, WORKDIR /app/backend).
    command:
    - bash
    - -c
    - |
      for i in $(seq 1 150); do
        python3 -c 'import os, psycopg2; psycopg2.connect(os.environ["DATABASE_URL"], connect_timeout=3).close()' 2>/dev/null && break
        echo "waiting for Postgres ($i)"; sleep 2
      done
      cd /app/backend && exec bash start.sh
    run:
      securityContext:
        readOnlyRootFilesystem: false
