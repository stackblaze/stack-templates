apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: moodle
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: Moodle is the world's most popular open-source
      learning management system (LMS) for building online courses, classrooms and
      e-learning.
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/moodle/icon.png
    kubero.dev/template.installation: 'Moodle is installed from the command line on
      the first start (a few minutes), so its web installer is never open to the
      first visitor. Sign in at /login as the user in MOODLE_ADMIN_USER (admin) with
      the password generated in MOODLE_ADMIN_PASSWORD (both under Variables), then
      set your own email under your profile and the site name under Site administration.
      Changing those variables after the first start has no effect: manage users in
      Moodle. The site address is MOODLE_URL (the app URL); change it when you add a
      custom domain. Course files and uploads live on the volume at /var/www/moodledata;
      the database is PostgreSQL 17. A worker runs Moodle''s cron every minute (forum
      and notification email, completion, cleanup). Email (password resets, enrolment
      and forum notifications) goes through the platform Email add-on and is always
      sent from its address. For safety, plugins cannot be installed or updated from
      Site administration: the Moodle code ships in the template image, and new
      Moodle versions arrive as a new image, upgraded automatically on start.'
    kubero.dev/template.links: '["https://docs.moodle.org/503/en/Main_page", "https://github.com/stackblaze/stack-templates/tree/main/services/moodle/image"]'
    kubero.dev/template.screenshots: '["https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/moodle/screenshot-course.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/moodle/screenshot-quiz.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/moodle/screenshot-dashboard.png"]'
    kubero.dev/template.source: https://github.com/moodle/moodle
    kubero.dev/template.categories: '["school", "collaboration", "productivity"]'
    kubero.dev/template.title: Moodle
    kubero.dev/template.website: https://moodle.org/
  labels:
    manager: kubero
spec:
  name: moodle
  deploymentstrategy: docker
  addons:
  # Moodle 5.3 needs PostgreSQL 17+ (public/admin/environment.xml).
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:17
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: moodle
              owner: moodle
              secret:
                name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO moodle
              - GRANT CREATE ON SCHEMA public TO moodle
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO moodle
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: moodle
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
  # Platform email (README "Email contract"): password resets, enrolment,
  # forum and assignment notifications. Moodle has no email environment
  # variables of its own; the image's config.php reads the injected SMTP_*
  # (smtphosts, smtpuser, smtppass, noreplyaddress) and does nothing without
  # SMTP_HOST, so no mapping is needed here.
  - displayName: Email
    env: []
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    resourceDefinitions: {}
  envVars:
  - name: MOODLE_DB_HOST
    value: '$(PGHOST)'
  - name: MOODLE_DB_PORT
    value: '$(PGPORT)'
  - name: MOODLE_DB_NAME
    value: '$(PGDATABASE)'
  - name: MOODLE_DB_USER
    value: '$(PGUSER)'
  - name: MOODLE_DB_PASSWORD
    value: '$(PGPASSWORD)'
  # The site address ($CFG->wwwroot).
  - name: MOODLE_URL
    value: '{{STACKBLAZE_APP_URL}}'
  # First-start install (moodle-start). Changing these later does nothing.
  - name: MOODLE_ADMIN_USER
    value: admin
  - name: MOODLE_ADMIN_PASSWORD
    value: '{{STACKBLAZE_GEN_ALNUM:24}}'
  - name: MOODLE_ADMIN_EMAIL
    value: admin@example.com
  - name: MOODLE_SITE_NAME
    value: My Moodle site
  - name: MOODLE_SITE_SHORTNAME
    value: moodle
  # moodledata: course files, uploads, submissions, backups, language packs and
  # the shared cache. Not served by Apache (only public/ is).
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /var/www/moodledata
    name: '{{STACKBLAZE_APP_NAME}}-moodledata'
    size: 10Gi
    storageClass: shared
  cronjobs: []
  # One image, two processes: the web pod serves Moodle (PROC_TYPE=web), the
  # worker runs admin/cli/cron.php every minute (PROC_TYPE=worker). Both mount
  # moodledata.
  web:
    replicaCount: 1
  worker:
    replicaCount: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: '1'
      memory: 1Gi
  # A static file Apache serves without PHP or the database.
  healthcheck:
    enabled: true
    path: /pix/moodlelogo.svg
    startupSeconds: 600
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '80'
    pullPolicy: IfNotPresent
    # Built by .github/workflows/build-moodle.yaml from services/moodle/image:
    # Moodle 5.3.1 (official package, checksum-pinned) on php:8.4-apache.
    repository: ghcr.io/stackblaze/stack-templates/moodle
    tag: 5.3.1-1
    run:
      securityContext:
        readOnlyRootFilesystem: false
