apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: nodebb
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "Next-generation forum software \u2014 powerful,\
      \ mobile-ready, and fully customizable."
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/nodebb/icon.png
    kubero.dev/template.installation: First boot runs `nodebb setup` (NODEBB_INIT_VERB) against the platform database using the NODEBB_*
      env vars (takes several minutes). Change admin password after login.
    kubero.dev/template.links: '["https://docs.nodebb.org/"]'
    kubero.dev/template.screenshots: '["https://nodebb.org/assets/images/nodebb-screenshot.png"]'
    kubero.dev/template.source: https://github.com/NodeBB/NodeBB
    kubero.dev/template.categories: '["communication", "social", "work"]'
    kubero.dev/template.title: NodeBB
    kubero.dev/template.website: https://nodebb.org/
  labels:
    manager: kubero
spec:
  name: nodebb
  deploymentstrategy: docker
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 3
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: nodebb
              owner: nodebb
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO nodebb
              - GRANT CREATE ON SCHEMA public TO nodebb
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO nodebb
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: nodebb
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: nodebb
          password: nodebb
  envVars:
  - name: NODEBB_URL
    value: '{{KUBERO_APP_URL}}'
  - name: NODEBB_PORT
    value: '4567'
  - name: NODEBB_ADMIN_USERNAME
    value: admin
  - name: NODEBB_ADMIN_PASSWORD
    value: change-me-on-first-login
  - name: NODEBB_ADMIN_EMAIL
    value: admin@example.com
  - name: NODEBB_DB
    value: postgres
  - name: NODEBB_INIT_VERB
    value: setup
  # First boot has no /opt/config/config.json (persisted volume): the
  # entrypoint then runs `nodebb $NODEBB_INIT_VERB` — with verb `setup` that
  # is the AUTOMATED install driven by the NODEBB_* env above (install.js
  # checkSetupFlagEnv), which exits when done; the restart finds config.json
  # and starts the forum. Do NOT use the SETUP env for this: the entrypoint
  # re-runs setup on EVERY boot while it is set (exec, never reaches start).
  - name: NODEBB_DB_HOST
    value: '$(PGHOST)'
  - name: NODEBB_DB_PORT
    value: '$(PGPORT)'
  - name: NODEBB_DB_USER
    value: '$(PGUSER)'
  - name: NODEBB_DB_PASSWORD
    value: '$(PGPASSWORD)'
  - name: NODEBB_DB_NAME
    value: '$(PGDATABASE)'
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /usr/src/app/build
    name: nodebb-build
    size: 1Gi
    storageClass: shared
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /usr/src/app/public/uploads
    name: '{{KUBERO_APP_NAME}}-uploads'
    size: 2Gi
    storageClass: shared
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /opt/config
    name: '{{KUBERO_APP_NAME}}-config'
    size: 1Gi
    storageClass: shared
  cronjobs: []
  web:
    replicaCount: 2
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '1'
      memory: 2Gi
  healthcheck:
    enabled: true
    path: /
    startupSeconds: 900
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '4567'
    pullPolicy: Always
    repository: ghcr.io/nodebb/nodebb
    tag: latest
    run:
      securityContext:
        readOnlyRootFilesystem: false
