apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: psono
  annotations:
    kubero.dev/template.architecture: '["amd64"]'
    kubero.dev/template.description: "Psono is an open-source, self-hosted password\
      \ manager for teams \u2014 end-to-end encrypted secret storage with sharing,\
      \ an admin portal and a REST API."
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/psono/icon.png
    kubero.dev/template.installation: "The six server keys are generated uniquely\
      \ per deploy by kubero and persisted (they never change for the life of the\
      \ instance) \u2014 no manual setup. The web client is served at /, the admin\
      \ portal at /portal and the server API at /server; create the first admin account\
      \ via the registration flow. The optional file-repository (large file storage)\
      \ needs a separate psono-fileserver deployment."
    kubero.dev/template.links: '["https://doc.psono.com/"]'
    kubero.dev/template.screenshots: '["https://psono.com/static/img/section-3.png"]'
    kubero.dev/template.source: https://gitlab.com/psono/psono-combo
    kubero.dev/template.categories: '["security", "work"]'
    kubero.dev/template.title: Psono
    kubero.dev/template.website: https://psono.com/
  labels:
    manager: kubero
spec:
  name: psono
  deploymentstrategy: docker
  envVars:
  - name: PSONO_HOST_URL
    value: '{{KUBERO_APP_URL}}/server'
  - name: PSONO_ALLOWED_HOSTS
    value: '*'
  - name: PSONO_ALLOWED_DOMAINS
    value: '{{KUBERO_APP_HOST}}'
  - name: PSONO_WEB_CLIENT_URL
    value: '{{KUBERO_APP_URL}}'
  - name: PSONO_DATABASE_URL
    value: 'postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  - name: PSONO_SECRET_KEY
    value: '{{KUBERO_GEN_ALNUM:64}}'
  - name: PSONO_ACTIVATION_LINK_SECRET
    value: '{{KUBERO_GEN_ALNUM:64}}'
  - name: PSONO_DB_SECRET
    value: '{{KUBERO_GEN_ALNUM:64}}'
  - name: PSONO_EMAIL_SECRET_SALT
    value: '{{KUBERO_GEN_BCRYPT_SALT}}'
  - name: PSONO_PRIVATE_KEY
    value: '{{KUBERO_GEN_X25519_SK}}'
  - name: PSONO_PUBLIC_KEY
    value: '{{KUBERO_GEN_X25519_PK}}'
  extraVolumes: []
  cronjobs: []
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: psono
              owner: psono
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: psono
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: psono
          password: psono
  # Platform email (see README "Email contract"). Psono cannot onboard a
  # user without mail (registration and recovery links go out by email), so
  # every mail variable lives here and nothing in envVars: a same-named var
  # there would win over this mapping. Email is metered on every plan, so
  # the mapping is live from the first deploy; only with the platform switch
  # off does Psono fall back to its smtp→localhost default (registration
  # then fails with REGISTRATION_EMAIL_DELIVERY_FAILED).
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env:
    - name: PSONO_EMAIL_BACKEND
      value: django.core.mail.backends.smtp.EmailBackend
    - name: PSONO_EMAIL_HOST
      value: '$(SMTP_HOST)'
    - name: PSONO_EMAIL_PORT
      value: '$(SMTP_PORT)'
    - name: PSONO_EMAIL_HOST_USER
      value: '$(SMTP_USER)'
    - name: PSONO_EMAIL_HOST_PASSWORD
      value: '$(SMTP_PASSWORD)'
    - name: PSONO_EMAIL_USE_TLS
      value: 'True'
    - name: PSONO_EMAIL_FROM
      value: '$(SMTP_FROM)'
    resourceDefinitions: {}
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  healthcheck:
    enabled: true
    # Probe nginx on / . The API /server/healthcheck/ path is rate limited
    # and will crash the pod when startup probes hit every second.
    path: /
    startupSeconds: 300
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: 80
    pullPolicy: IfNotPresent
    repository: docker.io/psono/psono-combo
    tag: 7.4.3-4.8.2-1.10.0
    run:
      securityContext:
        readOnlyRootFilesystem: false
