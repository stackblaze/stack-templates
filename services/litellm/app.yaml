apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: litellm
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: LLM gateway with one OpenAI-compatible API
      for 100+ model providers. Virtual keys, budgets, rate limits, spend tracking
      and an admin UI.
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/litellm/icon.png
    kubero.dev/template.installation: 'Open the app URL (it redirects to /ui) and
      sign in as admin with the password generated in UI_PASSWORD (under Variables).
      Every API call needs a key: the master key in LITELLM_MASTER_KEY, or a virtual
      key you create under Virtual Keys. Nothing is open without one. Add models
      and their provider keys under Models; provider keys are stored encrypted with
      LITELLM_SALT_KEY, so never change that value after adding a model. Then call
      {{STACKBLAZE_APP_URL}}/v1 with any OpenAI SDK. The API reference is at /docs.
      Email (invites, key and budget alerts) goes through the Email add-on once you
      turn on email alerting in Settings. Enterprise features (SSO for more than
      5 users, audit logs, guardrail add-ons) need a LiteLLM licence.'
    kubero.dev/template.links: '["https://docs.litellm.ai/"]'
    kubero.dev/template.screenshots: '[]'
    kubero.dev/template.source: https://github.com/BerriAI/litellm
    kubero.dev/template.categories: '["ai", "development", "utilities"]'
    kubero.dev/template.title: LiteLLM
    kubero.dev/template.website: https://www.litellm.ai/
  labels:
    manager: kubero
spec:
  name: litellm
  deploymentstrategy: docker
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: litellm
              owner: litellm
              secret:
                name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO litellm
              - GRANT CREATE ON SCHEMA public TO litellm
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO litellm
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: litellm
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
  # LiteLLM reads SMTP_HOST, SMTP_PORT and SMTP_PASSWORD under the platform's own
  # names, so only the two names that differ are mapped here.
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env:
    - name: SMTP_USERNAME
      value: '$(SMTP_USER)'
    - name: SMTP_SENDER_EMAIL
      value: '$(SMTP_FROM)'
    - name: SMTP_TLS
      value: 'True'
    resourceDefinitions: {}
  envVars:
  - name: DATABASE_URL
    value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  # Admin key for the API. LiteLLM requires the sk- prefix. Every route except
  # the health checks and the UI login needs this or a virtual key.
  - name: LITELLM_MASTER_KEY
    value: 'sk-{{STACKBLAZE_GEN_ALNUM:48}}'
  # Encrypts provider API keys stored in the database (sha256 of the value, so
  # any length works). Must never change once a model has been added.
  - name: LITELLM_SALT_KEY
    value: '{{STACKBLAZE_GEN_ALNUM:48}}'
  - name: UI_USERNAME
    value: admin
  - name: UI_PASSWORD
    value: '{{STACKBLAZE_GEN_ALNUM:24}}'
  - name: STORE_MODEL_IN_DB
    value: 'True'
  # Base URL for invite links and SSO redirects.
  - name: PROXY_BASE_URL
    value: '{{STACKBLAZE_APP_URL}}'
  # The card link lands on the admin UI; the Swagger reference moves to /docs.
  - name: DOCS_URL
    value: /docs
  - name: ROOT_REDIRECT_URL
    value: /ui
  # DEV mode would also load a .env file from the working directory.
  - name: LITELLM_MODE
    value: PRODUCTION
  extraVolumes: []
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: '2'
      memory: 2Gi
  healthcheck:
    enabled: true
    path: /health/liveliness
    startupSeconds: 300
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '4000'
    pullPolicy: IfNotPresent
    repository: docker.io/litellm/litellm
    tag: v1.108.8
    run:
      securityContext:
        readOnlyRootFilesystem: false
