apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "Automate repetitive work and connect your apps, APIs, and data with visual workflows.\nA powerful alternative to Zapier and Make."
    kubero.dev/template.icon: https://avatars.githubusercontent.com/u/45487711?s=200&v=4
    kubero.dev/template.installation: With Load demo data enabled, first boot creates
      owner demo@stackblaze.local / changeme and three sample workflows. Without it,
      complete the one-time owner setup at your app URL, then sign in. Queue mode
      uses Valkey as the job queue and a companion worker for executions. N8N_ENCRYPTION_KEY
      is generated at deploy and shared with the worker — do not change it on only
      one of the apps. AI Assistant searches the web through a bundled SearXNG
      companion app; code execution in the n8n sandbox is not included (it needs
      privileged containers, which the platform does not allow). Add an Anthropic, OpenAI, or OpenRouter key in n8n AI settings or set
      N8N_INSTANCE_AI_MODEL_API_KEY. Optionally set INSTANCE_AI_BRAVE_SEARCH_API_KEY
      to prefer Brave over SearXNG. If you are sent back to /setup, delete the app
      and its PostgreSQL addon together, redeploy, and verify POST /rest/login returns
      200 (not 404) before signing in.
    kubero.dev/template.links: '["https://docs.n8n.io/deploy/host-n8n/configure-n8n/set-up-ai-assistant"]'
    kubero.dev/template.screenshots: '["https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/n8n/screenshot-workflow.png"]'
    kubero.dev/template.source: https://github.com/n8n-io/n8n
    kubero.dev/template.categories: '["work", "productivity", "utilities"]'
    kubero.dev/template.title: "n8n Automation"
    kubero.dev/template.website: https://n8n.io
  name: n8n
spec:
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgres'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: n8n
              owner: n8n
              secret:
                name: '{{KUBERO_APP_NAME}}-postgres-app'
              postInitApplicationSQL:
              - CREATE EXTENSION IF NOT EXISTS "uuid-ossp"
              - GRANT ALL ON SCHEMA public TO n8n
              - GRANT CREATE ON SCHEMA public TO n8n
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO n8n
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgres-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgres-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: '{{KUBERO_GEN_ALNUM:32}}'
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgres-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: n8n
          password: '{{KUBERO_GEN_ALNUM:32}}'
  - displayName: Valkey
    env: []
    icon: /img/addons/redis.svg
    id: kubero-operator
    kind: Valkey
    resourceDefinitions:
      Valkey:
        apiVersion: rds.valkey.buf.red/v1alpha1
        kind: Valkey
        metadata:
          name: '{{KUBERO_APP_NAME}}-valkey'
        spec:
          version: '8.0'
          arch: replica
          replicas:
            shards: 1
            replicasOfShard: 1
          access:
            serviceType: ClusterIP
          storage:
            capacity: 1Gi
            storageClassName: fast
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
  # Platform email (see README "Email contract"). Applied only while the
  # Email add-on is live (paid plans); without it N8N_SMTP_HOST stays empty
  # and n8n falls back to invite links instead of invite emails. SES is
  # STARTTLS on 587, so implicit SSL (n8n's default) is switched off.
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env:
    - name: N8N_EMAIL_MODE
      value: smtp
    - name: N8N_SMTP_HOST
      value: '$(SMTP_HOST)'
    - name: N8N_SMTP_PORT
      value: '$(SMTP_PORT)'
    - name: N8N_SMTP_USER
      value: '$(SMTP_USER)'
    - name: N8N_SMTP_PASS
      value: '$(SMTP_PASSWORD)'
    - name: N8N_SMTP_SENDER
      value: 'n8n <$(SMTP_FROM)>'
    - name: N8N_SMTP_SSL
      value: 'false'
    - name: N8N_SMTP_STARTTLS
      value: 'true'
    resourceDefinitions: {}
  cronjobs: []
  deploymentstrategy: docker
  # Synthetic monorepo key — Overview groups api + worker siblings by
  # clone_url (+ branch), same Architecture UX as Plane / voting-app.
  gitrepo:
    admin: false
    clone_url: https://github.com/n8n-io/n8n.git
    default_branch: master
    private: false
    ssh_url: ''
  envVars:
  - name: DB_TYPE
    value: postgresdb
  - name: DB_POSTGRESDB_HOST
    value: '$(PGHOST)'
  - name: DB_POSTGRESDB_PORT
    value: '$(PGPORT)'
  - name: DB_POSTGRESDB_USER
    value: '$(PGUSER)'
  - name: DB_POSTGRESDB_PASSWORD
    value: '$(PGPASSWORD)'
  - name: N8N_BASIC_AUTH_ACTIVE
    value: 'false'
  - name: WEBHOOK_URL
    value: '{{KUBERO_APP_URL}}'
  - name: N8N_EDITOR_BASE_URL
    value: '{{KUBERO_APP_URL}}'
  - name: N8N_HOST
    value: '{{KUBERO_APP_HOST}}'
  - name: N8N_PORT
    value: '5678'
  - name: N8N_PROTOCOL
    value: https
  - name: N8N_PROXY_HOPS
    value: '2'
  - name: N8N_PUSH_BACKEND
    value: websocket
  - name: DB_POSTGRESDB_DATABASE
    value: '$(PGDATABASE)'
  - name: EXECUTIONS_MODE
    value: queue
  - name: QUEUE_BULL_REDIS_HOST
    value: '$(REDISHOST)'
  - name: QUEUE_BULL_REDIS_PORT
    value: '$(REDISPORT)'
  - name: QUEUE_HEALTH_CHECK_ACTIVE
    value: 'true'
  - name: OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS
    value: 'true'
  - name: N8N_ENCRYPTION_KEY
    value: '{{KUBERO_GEN_ALNUM:32}}'
  - name: STACKBLAZE_LOAD_DEMO_DATA
    value: 'false'
  - name: STACKBLAZE_DEMO_EMAIL
    value: demo@stackblaze.local
  - name: STACKBLAZE_DEMO_PASSWORD
    value: changeme
  - name: N8N_ENABLED_MODULES
    value: instance-ai
  # The n8n code sandbox (n8n-sandbox-service runner-dind) needs a privileged
  # Docker-in-Docker container, which the platform does not allow (#136), so
  # it is not bundled: AI Assistant runs without code execution.
  - name: N8N_INSTANCE_AI_SANDBOX_ENABLED
    value: 'false'
  # Web search through the SearXNG companion below. Sibling apps of a catalog
  # group are reached as <nameHint>-<suffix>-kuberoapp on port 80.
  - name: N8N_INSTANCE_AI_SEARXNG_URL
    value: http://n8n-searxng-{{KUBERO_NAME_SUFFIX}}-kuberoapp
  extraVolumes: []
  image:
    containerPort: '5678'
    pullPolicy: IfNotPresent
    # Pinned, NOT :latest. Upstream re-tagged latest 2.38.7 -> 2.39.5 on
    # 2026-09-15 and every fresh deploy crash-looped (2.39.x refuses to start
    # when the auto-generated instance encryption key changes across the
    # first-boot restart). Bump deliberately; 2.39+ needs a fixed
    # N8N_ENCRYPTION_KEY first. Pulled through the shared registry like the
    # other pinned templates (mattermost, twenty).
    # Referenced as docker.io on purpose: zone nodes mirror docker.io through
    # the REGIONAL registry (containerd hosts.d -> registry.<region>/v2/docker,
    # the zot in each services cluster, on-demand sync, Docker Hub fallback),
    # so each region serves this from its own cache. Not docker.n8n.io (never
    # mirrored; used 2026-09-15..10-16 as a stopgap) and not
    # registry.stackblaze.cloud (the old sfo zot, 503 since 2026-09-14 and
    # retired by #131). The worker image in templateServices below must keep
    # the same repository and tag (#132).
    repository: docker.io/n8nio/n8n
    tag: '2.38.7'
    command:
    - /bin/sh
    - -c
    - "node -e \"fetch(process.argv[1]).then(async r=>{if(!r.ok)process.exit(1);require('fs').writeFileSync(process.argv[2],await r.text())})\"\
      \ \"https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/n8n/kubero-entrypoint.sh\"\
      \ /tmp/kubero-entrypoint.sh\nchmod +x /tmp/kubero-entrypoint.sh\nexec /tmp/kubero-entrypoint.sh\n"
    run:
      securityContext:
        readOnlyRootFilesystem: false
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
      nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
      nginx.ingress.kubernetes.io/proxy-buffering: 'off'
  name: n8n
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  # Catalog-only. Dashboard expands this into a second docker card that shares
  # env (including the generated encryption key) and runs `n8n worker`.
  templateServices:
  - id: worker
    nameHint: n8n-worker
    serviceType: worker
    exposeInternet: false
    image:
      # Same pin and regional-mirror path as spec.image above (#132).
      repository: docker.io/n8nio/n8n
      tag: '2.38.7'
      containerPort: '5678'
      command:
      - n8n
      - worker
    inheritEnvFrom: primary
    healthcheck:
      enabled: true
      path: /healthz
      timeoutSeconds: 5
      periodSeconds: 10
  # SearXNG web search for AI Assistant (was a Deployment baked into the
  # Postgres add-on's resourceDefinitions, which the server refuses: #136).
  # Private web service; n8n dials it through N8N_INSTANCE_AI_SEARXNG_URL.
  # n8n queries SearXNG's JSON API, which the default settings.yml turns off,
  # so the command writes a settings file that enables it, then starts the
  # image's own entrypoint (the image ships /bin/sh).
  - id: searxng
    nameHint: n8n-searxng
    serviceType: web
    exposeInternet: false
    image:
      repository: docker.io/searxng/searxng
      tag: 2026.10.17-1c10abe2d
      containerPort: '8080'
      command:
      - /bin/sh
      - -c
      - |
        printf 'use_default_settings: true\nsearch:\n  formats:\n    - html\n    - json\n' > /etc/searxng/settings.yml
        exec /usr/local/searxng/entrypoint.sh
    envVars:
    - name: SEARXNG_SECRET
      value: '{{KUBERO_GEN_ALNUM:32}}'
    - name: SEARXNG_PORT
      value: '8080'
    - name: SEARXNG_BIND_ADDRESS
      value: 0.0.0.0
    healthcheck:
      enabled: true
      path: /healthz
      timeoutSeconds: 5
      periodSeconds: 10
