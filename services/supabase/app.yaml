apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: supabase
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "The open-source Postgres development platform: database, Auth, instant APIs, Realtime, Storage and Edge Functions, managed from Studio."
    kubero.dev/template.icon: https://avatars.githubusercontent.com/u/54469796?s=200
    kubero.dev/template.installation: |
      Deploys Supabase as one group of services: the Kong gateway (the public URL), Studio, Auth, PostgREST (plus a read-replica twin), Realtime, Storage, postgres-meta, Edge Functions and imgproxy, with its own PostgreSQL, a RustFS bucket and the Email add-on. Open the gateway URL and sign in to Studio as DASHBOARD_USERNAME (supabase) with DASHBOARD_PASSWORD, generated per deploy (on the gateway and Studio cards). Every secret is generated per deploy: JWT_SECRET (on every card), the database passwords, the sb_publishable_ / sb_secret_ API keys and the Realtime and pg-meta keys. The legacy anon and service_role keys are signed from JWT_SECRET when the services start; Studio shows them under Project Settings > API Keys. Keep the secret and service_role keys server-side: they bypass Row Level Security. Edge Functions run in a Kata micro-VM. Data API reads (GET/HEAD on /rest/v1) are served from the Postgres replicas; set KONG_REST_READ_REPLICAS=off on the gateway to keep every read on the primary. New users confirm their email through the Email add-on (GOTRUE_MAILER_AUTOCONFIRM=false on the Auth card).
    kubero.dev/template.links: '["https://supabase.com/docs/guides/self-hosting/docker"]'
    kubero.dev/template.screenshots: '[]'
    kubero.dev/template.source: https://github.com/supabase/supabase
    kubero.dev/template.categories: '["development", "data"]'
    kubero.dev/template.title: Supabase
    kubero.dev/template.website: https://supabase.com/
  labels:
    manager: kubero
spec:
  name: supabase
  deploymentstrategy: docker
  ingress:
    annotations:
      # ingress-nginx defaults to 1m, which rejects Studio's 6 MB upload
      # chunks. Storage's own FILE_SIZE_LIMIT (50 MiB) stays the real cap.
      nginx.ingress.kubernetes.io/proxy-body-size: 64m
  gitrepo:
    admin: false
    clone_url: https://github.com/supabase/supabase.git
    default_branch: master
    private: false
    ssh_url: ''
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql'
          annotations:
            # Communal zones: kubero-server runs its Supabase init as the zone
            # superuser and injects SUPABASE_DB_*_USER next to PG*. Dedicated
            # zones run postInitApplicationSQL below.
            kubero.dev/supabase-init: "true"
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 8Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: supabase
              owner: supabase
              secret:
                name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
              # Dedicated zones. The same per-tenant login users the communal init
              # creates (kubero-server supabase-communal-init.ts, generated for
              # owner "supabase" and this deployment's generated password), run in the supabase database. CNPG
              # executes this over a plain connection, so no psql meta-commands.
              # Named dollar quotes only ($do$, $fn$): the platform turns "$$" into "$"
              # in add-on definitions (reported 2026-11-14).
              postInitApplicationSQL:
              - |
                -- Shared, passwordless labels. Server-wide, like every Postgres role, and safe
                -- to share: what they may touch is granted per database.
                DO $do$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres NOLOGIN; END IF; END $do$;
                DO $do$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN NOINHERIT; END IF; END $do$;
                DO $do$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN NOINHERIT; END IF; END $do$;
                DO $do$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS; END IF; END $do$;
                DO $do$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'supabase_realtime_admin') THEN CREATE ROLE supabase_realtime_admin NOLOGIN NOINHERIT; END IF; END $do$;
                ALTER ROLE anon SET statement_timeout = '3s';
                ALTER ROLE authenticated SET statement_timeout = '8s';

                -- This tenant's login users, all on the tenant Secret password.
                DO $do$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'supabase_admin') THEN CREATE ROLE "supabase_admin" LOGIN; END IF; END $do$;
                ALTER ROLE "supabase_admin" WITH LOGIN INHERIT BYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD '{{STACKBLAZE_GEN_SHARED:SB_DB_PASSWORD:ALNUM:32}}';
                DO $do$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'supabase_auth') THEN CREATE ROLE "supabase_auth" LOGIN; END IF; END $do$;
                ALTER ROLE "supabase_auth" WITH LOGIN NOINHERIT NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD '{{STACKBLAZE_GEN_SHARED:SB_DB_PASSWORD:ALNUM:32}}';
                DO $do$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'supabase_storage') THEN CREATE ROLE "supabase_storage" LOGIN; END IF; END $do$;
                ALTER ROLE "supabase_storage" WITH LOGIN NOINHERIT NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD '{{STACKBLAZE_GEN_SHARED:SB_DB_PASSWORD:ALNUM:32}}';
                DO $do$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'supabase_authenticator') THEN CREATE ROLE "supabase_authenticator" LOGIN; END IF; END $do$;
                ALTER ROLE "supabase_authenticator" WITH LOGIN NOINHERIT NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD '{{STACKBLAZE_GEN_SHARED:SB_DB_PASSWORD:ALNUM:32}}';
                DO $do$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'supabase_readonly') THEN CREATE ROLE "supabase_readonly" LOGIN; END IF; END $do$;
                ALTER ROLE "supabase_readonly" WITH LOGIN INHERIT BYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD '{{STACKBLAZE_GEN_SHARED:SB_DB_PASSWORD:ALNUM:32}}';
                GRANT "supabase" TO "supabase_admin";
                -- Studio's read-only mode (POSTGRES_USER_READ_ONLY) sees what admin sees;
                -- its sessions start read-only. Studio connects as this user on request.
                GRANT "supabase_admin" TO "supabase_readonly";
                ALTER ROLE "supabase_readonly" SET default_transaction_read_only = on;
                GRANT anon, authenticated, service_role TO "supabase_authenticator";
                GRANT anon, authenticated, service_role TO "supabase_auth";
                GRANT anon, authenticated, service_role TO "supabase_storage";
                GRANT supabase_realtime_admin TO "supabase_admin" WITH ADMIN OPTION;
                GRANT SET ON PARAMETER log_min_messages TO "supabase_admin";
                -- Studio reads auth.users / storage.* through pg-meta as the admin user.
                GRANT "supabase_auth", "supabase_storage" TO "supabase_admin";
                ALTER ROLE "supabase_auth" SET search_path = 'auth';
                ALTER ROLE "supabase_storage" SET search_path = 'storage';

                -- Only this tenant's roles may connect to its database.
                REVOKE CONNECT ON DATABASE "supabase" FROM PUBLIC;
                GRANT CONNECT, CREATE ON DATABASE "supabase" TO "supabase", "supabase_admin", "supabase_auth", "supabase_storage";
                GRANT CONNECT ON DATABASE "supabase" TO "supabase_authenticator", "supabase_readonly";
                -- Deployments from before per-tenant users still connect as the old
                -- server-wide roles; keep them working until they are redeployed.
                DO $do$ DECLARE r text; BEGIN
                  FOREACH r IN ARRAY ARRAY['supabase_admin', 'supabase_auth_admin', 'supabase_storage_admin', 'authenticator'] LOOP
                    IF EXISTS (SELECT FROM pg_roles WHERE rolname = r) THEN EXECUTE format('GRANT CONNECT ON DATABASE %I TO %I', 'supabase', r); END IF;
                  END LOOP;
                END $do$;

                -- Extensions + public schema
                CREATE SCHEMA IF NOT EXISTS extensions;
                CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA extensions;
                CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
                GRANT USAGE ON SCHEMA extensions TO postgres, anon, authenticated, service_role;
                GRANT ALL ON SCHEMA extensions TO "supabase_admin";
                GRANT USAGE ON SCHEMA public TO postgres, anon, authenticated, service_role;
                GRANT USAGE, CREATE ON SCHEMA public TO "supabase_admin";
                -- Tables made in Studio (admin) or by the owner role are reachable through
                -- the API, as upstream's defaults for its postgres role make them.
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_admin" IN SCHEMA public GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_admin" IN SCHEMA public GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_admin" IN SCHEMA public GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase" IN SCHEMA public GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase" IN SCHEMA public GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase" IN SCHEMA public GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
                GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;
                GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;
                GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO anon, authenticated, service_role;

                -- Auth (GoTrue connects as supabase_auth)
                CREATE SCHEMA IF NOT EXISTS auth;
                DO $do$ BEGIN IF (SELECT pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname = 'auth') = current_user THEN EXECUTE format('ALTER SCHEMA auth OWNER TO %I', 'supabase_auth'); END IF; END $do$;
                GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
                -- Same bodies GoTrue's own migrations install (they read request.jwt.claims,
                -- which PostgREST sets). CREATE OR REPLACE keeps an existing owner; a function
                -- we just created belongs to the superuser and is handed to the auth user, so
                -- GoTrue can replace it later.
                CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid AS $fn$
                  SELECT coalesce(
                    nullif(current_setting('request.jwt.claim.sub', true), ''),
                    (nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub')
                  )::uuid;
                $fn$ LANGUAGE sql STABLE;
                CREATE OR REPLACE FUNCTION auth.role() RETURNS text AS $fn$
                  SELECT coalesce(
                    nullif(current_setting('request.jwt.claim.role', true), ''),
                    (nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'role')
                  )::text;
                $fn$ LANGUAGE sql STABLE;
                CREATE OR REPLACE FUNCTION auth.email() RETURNS text AS $fn$
                  SELECT coalesce(
                    nullif(current_setting('request.jwt.claim.email', true), ''),
                    (nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'email')
                  )::text;
                $fn$ LANGUAGE sql STABLE;
                DO $do$ DECLARE f text; BEGIN
                  FOREACH f IN ARRAY ARRAY['auth.uid()', 'auth.role()', 'auth.email()'] LOOP
                    IF (SELECT pg_get_userbyid(proowner) FROM pg_proc WHERE oid = f::regprocedure) = current_user THEN
                      EXECUTE format('ALTER FUNCTION %s OWNER TO %I', f, 'supabase_auth');
                    END IF;
                  END LOOP;
                END $do$;

                -- Storage (storage-api connects as supabase_storage)
                CREATE SCHEMA IF NOT EXISTS storage;
                DO $do$ BEGIN IF (SELECT pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname = 'storage') = current_user THEN EXECUTE format('ALTER SCHEMA storage OWNER TO %I', 'supabase_storage'); END IF; END $do$;
                GRANT USAGE ON SCHEMA storage TO postgres, anon, authenticated, service_role;
                GRANT ALL ON SCHEMA storage TO "supabase_storage" WITH GRANT OPTION;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_storage" IN SCHEMA storage GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_storage" IN SCHEMA storage GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_storage" IN SCHEMA storage GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;

                -- Realtime (connects as supabase_admin; its tenant migrations expect these)
                CREATE SCHEMA IF NOT EXISTS _realtime;
                DO $do$ BEGIN IF (SELECT pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname = '_realtime') = current_user THEN EXECUTE format('ALTER SCHEMA _realtime OWNER TO %I', 'supabase_admin'); END IF; END $do$;
                CREATE SCHEMA IF NOT EXISTS realtime;
                DO $do$ BEGIN IF (SELECT pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname = 'realtime') = current_user THEN EXECUTE format('ALTER SCHEMA realtime OWNER TO %I', 'supabase_admin'); END IF; END $do$;
                CREATE SCHEMA IF NOT EXISTS graphql_public;
                GRANT USAGE ON SCHEMA graphql_public TO anon, authenticated, service_role;
                GRANT ALL ON SCHEMA graphql_public TO "supabase_admin";
                DO $do$ BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = 'supabase_realtime') THEN
                    CREATE PUBLICATION supabase_realtime;
                  END IF;
                END $do$;
                ALTER PUBLICATION supabase_realtime OWNER TO "supabase_admin";
                -- PostgREST schema reload on DDL (upstream pgrst_ddl_watch / pgrst_drop_watch).
                -- Without these a table made in Studio is a 404 on the Data API until a reload.
                CREATE OR REPLACE FUNCTION extensions.pgrst_ddl_watch() RETURNS event_trigger LANGUAGE plpgsql AS $fn$
                DECLARE cmd record;
                BEGIN
                  FOR cmd IN SELECT * FROM pg_event_trigger_ddl_commands() LOOP
                    IF cmd.command_tag IN ('CREATE SCHEMA', 'ALTER SCHEMA', 'CREATE TABLE', 'CREATE TABLE AS', 'SELECT INTO', 'ALTER TABLE',
                                           'CREATE FOREIGN TABLE', 'ALTER FOREIGN TABLE', 'CREATE VIEW', 'ALTER VIEW',
                                           'CREATE MATERIALIZED VIEW', 'ALTER MATERIALIZED VIEW', 'CREATE FUNCTION', 'ALTER FUNCTION',
                                           'CREATE TRIGGER', 'CREATE TYPE', 'ALTER TYPE', 'CREATE RULE', 'COMMENT')
                       AND cmd.schema_name IS DISTINCT FROM 'pg_temp' THEN
                      NOTIFY pgrst, 'reload schema';
                    END IF;
                  END LOOP;
                END $fn$;
                CREATE OR REPLACE FUNCTION extensions.pgrst_drop_watch() RETURNS event_trigger LANGUAGE plpgsql AS $fn$
                DECLARE obj record;
                BEGIN
                  FOR obj IN SELECT * FROM pg_event_trigger_dropped_objects() LOOP
                    IF obj.object_type IN ('schema', 'table', 'foreign table', 'view', 'materialized view', 'function', 'trigger', 'type', 'rule')
                       AND obj.is_temporary IS false THEN
                      NOTIFY pgrst, 'reload schema';
                    END IF;
                  END LOOP;
                END $fn$;
                DROP EVENT TRIGGER IF EXISTS pgrst_ddl_watch;
                CREATE EVENT TRIGGER pgrst_ddl_watch ON ddl_command_end EXECUTE PROCEDURE extensions.pgrst_ddl_watch();
                DROP EVENT TRIGGER IF EXISTS pgrst_drop_watch;
                CREATE EVENT TRIGGER pgrst_drop_watch ON sql_drop EXECUTE PROCEDURE extensions.pgrst_drop_watch();
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: '{{STACKBLAZE_GEN_ALNUM:32}}'
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: supabase
          # The same value as the per-tenant users' password in the init SQL above.
          password: '{{STACKBLAZE_GEN_SHARED:SB_DB_PASSWORD:ALNUM:32}}'
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env: []
    resourceDefinitions: {}
  - displayName: RustFS
    env: []
    icon: /img/addons/rustfs.svg
    id: kubero-operator
    kind: Tenant
    resourceDefinitions:
      Tenant:
        apiVersion: rustfs.com/v1alpha1
        kind: Tenant
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-rustfs'
          annotations:
            operator.rustfs.com/runtime-default-image-ack: docker.io/rustfs/rustfs:1.0.0-beta.10
        spec:
          image: docker.io/rustfs/rustfs:1.0.0-beta.10
          credsSecret:
            name: '{{STACKBLAZE_APP_NAME}}-rustfs-credentials'
          pools:
          - name: pool-0
            servers: 1
            persistence:
              volumesPerServer: 4
              volumeClaimTemplate:
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 2Gi
                storageClassName: slow
      credsSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-rustfs-credentials'
        type: Opaque
        stringData:
          accesskey: '{{STACKBLAZE_GEN_ALNUM:20}}'
          secretkey: '{{STACKBLAZE_GEN_HEX:40}}'
  envVars:
  - name: KONG_DATABASE
    value: 'off'
  - name: KONG_DECLARATIVE_CONFIG
    value: /usr/local/kong/kong.yml
  - name: KONG_DNS_ORDER
    value: LAST,A,CNAME
  - name: KONG_DNS_NOT_FOUND_TTL
    value: '1'
  - name: KONG_DNS_VALID_TTL
    value: '5'
  - name: KONG_PLUGINS
    value: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,post-function
  - name: KONG_ROUTER_FLAVOR
    value: expressions
  - name: KONG_NGINX_WORKER_PROCESSES
    value: '2'
  - name: KONG_NGINX_PROXY_PROXY_BUFFER_SIZE
    value: 160k
  - name: KONG_NGINX_PROXY_PROXY_BUFFERS
    value: 64 160k
  - name: KONG_PROXY_LISTEN
    value: 0.0.0.0:8000
  - name: KONG_LOG_LEVEL
    value: warn
  # Trust the ingress's X-Forwarded-Proto/Port so upstreams see https:443,
  # not Kong's own http:8000. Storage builds resumable-upload URLs from them.
  - name: KONG_TRUSTED_IPS
    value: 0.0.0.0/0,::/0
  - name: KONG_REAL_IP_HEADER
    value: X-Forwarded-For
  # One JSON line per request (client, country, sizes, timing) for the platform's
  # log collector, which turns it into Studio's API Gateway logs and reports.
  - name: KONG_NGINX_HTTP_LOG_FORMAT
    value: >-
      sb_json escape=json '{"client":"$remote_addr","country":"$http_cf_ipcountry","cdn_country":"$http_cdn_requestcountrycode","method":"$request_method","uri":"$request_uri","protocol":"$server_protocol","status":$status,"bytes_out":$body_bytes_sent,"bytes_in":$request_length,"request_time":$request_time,"host":"$host","referer":"$http_referer","agent":"$http_user_agent","cache_status":"$upstream_http_cf_cache_status","error_code":"$upstream_http_x_sb_error_code"}'
  - name: KONG_PROXY_ACCESS_LOG
    value: /dev/stdout sb_json
  # This deployment's JWT signing secret, generated at deploy and shared by
  # every Supabase service (one value per deployment). The legacy anon and
  # service_role keys are HS256 JWTs signed with it when each service starts;
  # they are never stored as variables. Studio shows them under Project
  # Settings > API Keys.
  - name: JWT_SECRET
    value: '{{STACKBLAZE_GEN_SHARED:SB_JWT_SECRET:ALNUM:48}}'
  # API keys (sb_publishable_ / sb_secret_), one pair per deployment, shared
  # by name with the Studio and functions cards. The publishable key is safe
  # in a browser (RLS applies); the secret key bypasses RLS: keep it server-side.
  - name: SUPABASE_PUBLISHABLE_KEY
    value: 'sb_publishable_{{STACKBLAZE_GEN_ALNUM:32}}'
  - name: SUPABASE_SECRET_KEY
    value: 'sb_secret_{{STACKBLAZE_GEN_ALNUM:40}}'
  # Studio sign-in (on the Studio card too: one generated value per name).
  - name: DASHBOARD_USERNAME
    value: supabase
  - name: DASHBOARD_PASSWORD
    value: '{{STACKBLAZE_GEN_ALNUM:24}}'
  # Data API reads (GET/HEAD on /rest/v1) are served by a PostgREST on the
  # Postgres replicas; 'off' sends them to the primary like writes.
  - name: KONG_REST_READ_REPLICAS
    value: 'on'
  # How the gateway finds this group's services (supabase-<role>-<suffix>-kuberoapp).
  - name: SB_NAME_SUFFIX
    value: '{{STACKBLAZE_NAME_SUFFIX}}'
  extraVolumes: []
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi
  healthcheck:
    enabled: false
  image:
    containerPort: '8000'
    pullPolicy: IfNotPresent
    repository: docker.io/kong/kong
    tag: '3.9.3'
    # kong.yml and kong-entrypoint.sh next to this file are the same text,
    # for reading and diffing.
    command:
    - /bin/bash
    - -c
    - |
      set -euo pipefail
      cat > /usr/local/kong/template.yml << 'ENDKONG'
      _format_version: '2.1'
      _transform: true

      ###
      ### Consumers / Users
      ###
      consumers:
        - username: anon
          keyauth_credentials:
            - key: $SUPABASE_ANON_KEY
            - key: $SUPABASE_PUBLISHABLE_KEY
        - username: service_role
          keyauth_credentials:
            - key: $SUPABASE_SERVICE_KEY
            - key: $SUPABASE_SECRET_KEY

      ###
      ### Access Control List
      ###
      acls:
        - consumer: anon
          group: anon
        - consumer: service_role
          group: admin

      ###
      ### API Routes
      ###
      services:
        ## Open Auth routes
        - name: auth-v1-open
          _comment: 'Auth: /auth/v1/verify* -> http://auth:9999/verify*'
          url: http://auth:9999/verify
          routes:
            - name: auth-v1-open
              strip_path: true
              paths:
                - /auth/v1/verify
          plugins:
            - name: cors
        - name: auth-v1-open-callback
          _comment: 'Auth: /auth/v1/callback* -> http://auth:9999/callback*'
          url: http://auth:9999/callback
          routes:
            - name: auth-v1-open-callback
              strip_path: true
              paths:
                - /auth/v1/callback
          plugins:
            - name: cors
        - name: auth-v1-open-authorize
          _comment: 'Auth: /auth/v1/authorize* -> http://auth:9999/authorize*'
          url: http://auth:9999/authorize
          routes:
            - name: auth-v1-open-authorize
              strip_path: true
              paths:
                - /auth/v1/authorize
          plugins:
            - name: cors
        - name: auth-v1-open-jwks
          _comment: 'Auth: /auth/v1/.well-known/jwks.json -> http://auth:9999/.well-known/jwks.json'
          url: http://auth:9999/.well-known/jwks.json
          routes:
            - name: auth-v1-open-jwks
              strip_path: true
              paths:
                - /auth/v1/.well-known/jwks.json
          plugins:
            - name: cors
        - name: auth-v1-open-well-known-oauth
          _comment: 'Auth: /auth/v1/.well-known/oauth-authorization-server -> http://auth:9999/.well-known/oauth-authorization-server'
          url: http://auth:9999/.well-known/oauth-authorization-server
          routes:
            - name: auth-v1-open-well-known-oauth
              strip_path: true
              paths:
                - /auth/v1/.well-known/oauth-authorization-server
          plugins:
            - name: cors
        - name: auth-v1-open-well-known-openid
          _comment: 'Auth: /auth/v1/.well-known/openid-configuration -> http://auth:9999/.well-known/openid-configuration'
          url: http://auth:9999/.well-known/openid-configuration
          routes:
            - name: auth-v1-open-well-known-openid
              strip_path: true
              paths:
                - /auth/v1/.well-known/openid-configuration
          plugins:
            - name: cors

        - name: auth-v1-open-sso-acs
          url: "http://auth:9999/sso/saml/acs"
          routes:
            - name: auth-v1-open-sso-acs
              strip_path: true
              paths:
              - /auth/v1/sso/saml/acs
          plugins:
            - name: cors

        - name: auth-v1-open-sso-metadata
          url: "http://auth:9999/sso/saml/metadata"
          routes:
            - name: auth-v1-open-sso-metadata
              strip_path: true
              paths:
              - /auth/v1/sso/saml/metadata
          plugins:
            - name: cors

        ## Secure Auth routes
        - name: auth-v1
          _comment: 'Auth: /auth/v1/* -> http://auth:9999/*'
          url: http://auth:9999/
          routes:
            - name: auth-v1-all
              strip_path: true
              paths:
                - /auth/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## OpenAPI root - admin only
        - name: rest-v1-openapi
          _comment: 'PostgREST OpenAPI root: /rest/v1/ -> <http://rest:3000/> (admin only). See <https://github.com/orgs/supabase/discussions/42949>'
          url: http://rest:3000/
          routes:
            - name: rest-v1-openapi-root
              strip_path: true
              expression: 'http.path == "/rest/v1/"'
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin

        ## PostgREST reads (StackBlaze): GET/HEAD on /rest/v1/* go to the instance on the
        ## Postgres replicas. Writes and RPC POSTs stay on rest-v1 (primary).
        ## KONG_REST_READ_REPLICAS=off points this at the primary instance instead.
        - name: rest-v1-ro
          _comment: 'PostgREST reads: GET/HEAD /rest/v1/* -> http://rest-ro:3000/*'
          url: http://rest-ro:3000/
          routes:
            - name: rest-v1-reads
              strip_path: true
              paths:
                - /rest/v1/
              methods:
                - GET
                - HEAD
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Secure PostgREST routes
        - name: rest-v1
          _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
          url: http://rest:3000/
          routes:
            - name: rest-v1-all
              strip_path: true
              paths:
                - /rest/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Secure GraphQL routes
        - name: graphql-v1
          _comment: 'PostgREST: /graphql/v1/* -> http://rest:3000/rpc/graphql'
          url: http://rest:3000/rpc/graphql
          routes:
            - name: graphql-v1-all
              strip_path: true
              paths:
                - /graphql/v1
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Content-Profile: graphql_public"
                    - "Authorization: $LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Secure Realtime routes
        - name: realtime-v1-ws
          _comment: 'Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
          url: http://realtime-dev.supabase-realtime:4000/socket
          protocol: ws
          routes:
            - name: realtime-v1-ws
              strip_path: true
              paths:
                - /realtime/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "x-api-key:$LUA_RT_WS_EXPR"
                replace:
                  querystring:
                    - "apikey:$LUA_RT_WS_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        # Block access to /realtime/v1/api/openapi
        - name: realtime-v1-rest-openapi
          _comment: 'Realtime: /realtime/v1/api/openapi/* -> http://realtime:4000/api/openapi/* (blocked)'
          url: http://realtime-dev.supabase-realtime:4000/api/openapi
          protocol: http
          routes:
            - name: realtime-v1-rest-openapi
              strip_path: true
              paths:
                - /realtime/v1/api/openapi
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."

        # Block access to /realtime/v1/api/tenants
        - name: realtime-v1-rest-tenants
          _comment: 'Realtime: /realtime/v1/api/tenants/* -> http://realtime:4000/api/tenants/* (blocked)'
          url: http://realtime-dev.supabase-realtime:4000/api/tenants
          protocol: http
          routes:
            - name: realtime-v1-rest-tenants
              strip_path: true
              paths:
                - /realtime/v1/api/tenants
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."

        - name: realtime-v1-rest
          _comment: 'Realtime: /realtime/v1/api/* -> http://realtime:4000/api/*'
          url: http://realtime-dev.supabase-realtime:4000/api
          protocol: http
          routes:
            - name: realtime-v1-rest
              strip_path: true
              paths:
                - /realtime/v1/api
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Storage API endpoint (with Authorization header transformation).
        ## No key-auth - S3 protocol requests don't carry an apikey header.
        ##
        ## The request-transformer translates opaque API keys to asymmetric JWTs
        ## and passes through existing Authorization headers (user JWTs, AWS SigV4).
        ## When no Authorization or apikey header is present (S3 presigned URLs),
        ## the Lua expression evaluates to nil which Kong renders as empty string.
        ## The post-function strips this empty header so Storage's S3 signature
        ## verification falls through to query-parameter parsing.
        - name: storage-v1
          _comment: 'Storage: /storage/v1/* -> http://storage:5000/*'
          url: http://storage:5000/
          routes:
            - name: storage-v1-all
              strip_path: true
              paths:
                - /storage/v1/
          plugins:
            - name: cors
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
                replace:
                  headers:
                    - "Authorization: $LUA_AUTH_EXPR"
            - name: post-function
              config:
                access:
                  - |
                    local auth = kong.request.get_header("authorization")
                    if auth == nil or auth == "" or auth:find("^%s*$") then
                      kong.service.request.clear_header("authorization")
                    end

        ## Edge Functions routes
        ##
        ## Functions header handling: opaque sb_ keys are translated to the pre-signed
        ## internal asymmetric JWT and injected as a raw `sb-api-key` header (no
        ## `Bearer` prefix), while `Authorization` is left untouched so user-session
        ## JWTs and legacy bearers flow through to the runtime.
        ##
        ## No `key-auth`: Functions is a passthrough that does NOT validate keys. Kong
        ## cannot reject an invalid key while still letting unauthenticated requests
        ## through (key-auth's `anonymous` fallback accepts missing AND invalid keys
        ## alike), so unknown/invalid keys simply pass to the runtime, which handles
        ## verify_jwt itself.
        ##
        ## The request-transformer strips any client-supplied `sb-api-key` (anti-spoof)
        ## and re-adds the translated value; on no match the Lua expression yields nil
        ## (an empty header) which the post-function then removes.
        ##
        ## No `cors`: functions handle CORS themselves, as on the platform. Preflights
        ## reach the function and its responses pass through unchanged.
        - name: functions-v1
          _comment: 'Edge Functions: /functions/v1/* -> http://functions:9000/*'
          url: http://functions:9000/
          # Limit inactivity between reads, leaving 10s for the runtime's 150s idle timeout.
          read_timeout: 160000
          routes:
            - name: functions-v1-all
              strip_path: true
              paths:
                - /functions/v1/
          plugins:
            - name: request-transformer
              config:
                remove:
                  headers:
                    - "sb-api-key"
                add:
                  headers:
                    - "sb-api-key:$LUA_FUNCTIONS_EXPR"
            - name: post-function
              config:
                access:
                  - |
                    local v = kong.request.get_header("sb-api-key")
                    if v == nil or v == "" or v:find("^%s*$") then
                      kong.service.request.clear_header("sb-api-key")
                    end

        ## OAuth 2.0 Authorization Server Metadata (RFC 8414)
        - name: well-known-oauth
          _comment: 'Auth: /.well-known/oauth-authorization-server/auth/v1 -> http://auth:9999/.well-known/oauth-authorization-server'
          url: http://auth:9999/.well-known/oauth-authorization-server
          routes:
            - name: well-known-oauth
              strip_path: true
              paths:
                - /.well-known/oauth-authorization-server/auth/v1
          plugins:
            - name: cors

        ## Analytics routes
        ## Not used - Studio and Vector talk directly to analytics via Docker networking.
        ## If external access is needed, add routes with key-auth matching Logflare's x-api-key auth.
        # - name: analytics-v1-api
        #   _comment: 'Analytics: /analytics/v1/api/endpoints/* -> http://logflare:4000/api/endpoints/*'
        #   url: http://analytics:4000/api/endpoints
        #   routes:
        #     - name: analytics-v1-api
        #       strip_path: true
        #       paths:
        #         - /analytics/v1/api/endpoints/
        # - name: analytics-v1
        #   _comment: 'Analytics: /analytics/v1/* -> http://logflare:4000/*'
        #   url: http://analytics:4000/
        #   routes:
        #     - name: dashboard-v1-all
        #       strip_path: true
        #       paths:
        #         - /analytics/v1
        #   plugins:
        #     - name: cors
        #     - name: basic-auth
        #       config:
        #         hide_credentials: true

        ## Secure Database routes
        - name: meta
          _comment: 'pg-meta: /pg/* -> http://pg-meta:8080/*'
          url: http://meta:8080/
          routes:
            - name: meta-all
              strip_path: true
              paths:
                - /pg/
          plugins:
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin

        ## Block access to /api/mcp
        - name: mcp-blocker
          _comment: 'Block direct access to /api/mcp'
          url: http://studio:3000/api/mcp
          routes:
            - name: mcp-blocker-route
              strip_path: true
              paths:
                - /api/mcp
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."

        ## MCP endpoint - local access
        - name: mcp
          _comment: 'MCP: /mcp -> http://studio:3000/api/mcp (local access)'
          url: http://studio:3000/api/mcp
          routes:
            - name: mcp
              strip_path: true
              paths:
                - /mcp
          plugins:
            # Block access to /mcp by default
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."
            # Enable local access (danger zone!)
            # 1. Comment out the 'request-termination' section above
            # 2. Uncomment the entire section below, including 'deny'
            # 3. Add your local IPs to the 'allow' list
            #- name: cors
            #- name: ip-restriction
            #  config:
            #    allow:
            #      - 127.0.0.1
            #      - ::1
            #    deny: []

        ## Protected Dashboard - catch all remaining routes
        - name: dashboard
          _comment: 'Studio: /* -> http://studio:3000/*'
          url: http://studio:3000/
          routes:
            - name: dashboard-all
              strip_path: true
              paths:
                - /
          plugins:
            - name: cors
            # No basic-auth (StackBlaze): Studio's own sign-in page
            # (STUDIO_SELF_HOSTED_LOGIN) protects / and Studio's API routes.
      ENDKONG
      cat > /tmp/kong-entrypoint.sh << 'ENDENTRY'
      #!/bin/bash
      # Supabase API gateway (Kong) entrypoint for StackBlaze. Upstream's
      # docker/volumes/api/kong-entrypoint.sh (supabase/supabase master 33c8ab1)
      # plus two StackBlaze steps: the legacy anon / service_role keys are signed
      # here from this deployment's JWT_SECRET (they are never stored as variables),
      # and the compose service names are rewritten to this group's Kubero Services.
      # This copy is for reading and diffing; app.yaml embeds the same text.
      set -euo pipefail

      # --- Legacy API keys: HS256 JWTs signed with JWT_SECRET ---------------------
      # Every Supabase service of this deployment derives the same two keys from the
      # same secret, with the same fixed claims (Studio, Storage and the functions
      # router do it in their own start commands).
      b64url() { base64 -w0 | tr '+/' '-_' | tr -d '='; }
      hmac_sha256() {
        # stdin: data; $1: key. Kong's image has no openssl CLI everywhere, so fall
        # back to OpenResty's lua-resty-openssl, which Kong itself ships.
        if command -v openssl > /dev/null 2>&1; then
          openssl dgst -sha256 -hmac "$1" -binary
        else
          { printf '%s\n' "$1"; cat; } | resty -e '
            local key = io.read("*l")
            local data = io.read("*a")
            local hmac = assert(require("resty.openssl.hmac").new(key, "sha256"))
            io.write(assert(hmac:final(data)))'
        fi
      }
      sb_jwt() {
        local h p s
        h=$(printf '%s' '{"alg":"HS256","typ":"JWT"}' | b64url)
        p=$(printf '{"role":"%s","iss":"supabase","iat":1763078400,"exp":2078438400}' "$1" | b64url)
        s=$(printf '%s' "$h.$p" | hmac_sha256 "$JWT_SECRET" | b64url)
        printf '%s.%s.%s' "$h" "$p" "$s"
      }
      if [ "${#JWT_SECRET}" -lt 32 ]; then
        echo "JWT_SECRET must be at least 32 characters" >&2
        exit 1
      fi
      SUPABASE_ANON_KEY=$(sb_jwt anon)
      SUPABASE_SERVICE_KEY=$(sb_jwt service_role)
      # The internal JWTs the opaque sb_ keys are translated to (upstream: the
      # asymmetric keys; here the same HS256 keys).
      ANON_KEY_ASYMMETRIC=$SUPABASE_ANON_KEY
      SERVICE_ROLE_KEY_ASYMMETRIC=$SUPABASE_SERVICE_KEY
      export SUPABASE_ANON_KEY SUPABASE_SERVICE_KEY ANON_KEY_ASYMMETRIC SERVICE_ROLE_KEY_ASYMMETRIC

      # --- Upstream: Lua expressions for request-transformer ----------------------
      if [ -n "${SUPABASE_SECRET_KEY:-}" ] && [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
        export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '$SUPABASE_SECRET_KEY' and 'Bearer $SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.apikey == '$SUPABASE_PUBLISHABLE_KEY' and 'Bearer $ANON_KEY_ASYMMETRIC') or headers.apikey)"
        export LUA_RT_WS_EXPR="\$((query_params.apikey == '$SUPABASE_SECRET_KEY' and '$SERVICE_ROLE_KEY_ASYMMETRIC') or (query_params.apikey == '$SUPABASE_PUBLISHABLE_KEY' and '$ANON_KEY_ASYMMETRIC') or query_params.apikey)"
        export LUA_FUNCTIONS_EXPR="\$((headers.apikey == '$SUPABASE_SECRET_KEY' and '$SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.apikey == '$SUPABASE_PUBLISHABLE_KEY' and '$ANON_KEY_ASYMMETRIC') or (headers.authorization == 'Bearer $SUPABASE_SECRET_KEY' and '$SERVICE_ROLE_KEY_ASYMMETRIC') or (headers.authorization == 'Bearer $SUPABASE_PUBLISHABLE_KEY' and '$ANON_KEY_ASYMMETRIC') or nil)"
      else
        export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or headers.apikey)"
        export LUA_RT_WS_EXPR="\$(query_params.apikey)"
        export LUA_FUNCTIONS_EXPR="\$(nil)"
      fi

      # --- Upstream: substitute $NAME in the declarative config -------------------
      awk '{
        result = ""
        rest = $0
        while (match(rest, /\$[A-Za-z_][A-Za-z_0-9]*/)) {
          varname = substr(rest, RSTART + 1, RLENGTH - 1)
          if (varname in ENVIRON) {
            result = result substr(rest, 1, RSTART - 1) ENVIRON[varname]
          } else {
            result = result substr(rest, 1, RSTART + RLENGTH - 1)
          }
          rest = substr(rest, RSTART + RLENGTH)
        }
        print result rest
      }' /usr/local/kong/template.yml > "$KONG_DECLARATIVE_CONFIG"
      sed -i '/^[[:space:]]*- key:[[:space:]]*$/d' "$KONG_DECLARATIVE_CONFIG"

      # --- StackBlaze: dial this group's Kubero Services --------------------------
      # Catalog companions are Kubero Services named supabase-<role>-<suffix>-kuberoapp
      # (port 80 → the container port), reachable by their install names.
      # SB_NAME_SUFFIX: the group's suffix (set on this card at deploy);
      # <hint>-<suffix>-kuberoapp is each service's alias by its install name.
      suffix="${SB_NAME_SUFFIX:?SB_NAME_SUFFIX is not set}"
      sb_svc() { printf 'supabase-%s-%s-kuberoapp' "$1" "$suffix"; }
      if [ "${KONG_REST_READ_REPLICAS:-on}" = "off" ]; then rest_ro=$(sb_svc rest); else rest_ro=$(sb_svc rest-ro); fi
      sed -i \
        -e "s|http://auth:9999|http://$(sb_svc auth)|g" \
        -e "s|http://rest-ro:3000|http://$rest_ro|g" \
        -e "s|http://rest:3000|http://$(sb_svc rest)|g" \
        -e "s|http://realtime-dev.supabase-realtime:4000|http://$(sb_svc realtime)|g" \
        -e "s|http://storage:5000|http://$(sb_svc storage)|g" \
        -e "s|http://functions:9000|http://$(sb_svc functions)|g" \
        -e "s|http://meta:8080|http://$(sb_svc meta)|g" \
        -e "s|http://studio:3000|http://$(sb_svc studio)|g" \
        "$KONG_DECLARATIVE_CONFIG"

      exec /entrypoint.sh kong docker-start
      ENDENTRY
      chmod +x /tmp/kong-entrypoint.sh
      exec /tmp/kong-entrypoint.sh
    run:
      securityContext:
        readOnlyRootFilesystem: false
  templateServices:
  - id: studio
    nameHint: supabase-studio
    exposeInternet: false
    usePrimaryAddons: true
    image:
      # stackblaze/supabase fork (github.com/stackblaze/supabase): Studio's own
      # sign-in page, Edge Function deploy/delete from the UI, and the screens
      # backed by the hosting platform (backups, branching, GitHub, merge
      # requests, members, Auth settings, function secrets, service versions).
      repository: ghcr.io/stackblaze/supabase-studio
      tag: sha-b4b6b28
      containerPort: '3000'
      command:
      - /bin/sh
      - -c
      - |
        set -eu
        # Studio 500s on the Edge Functions page unless its management folders
        # exist; a no-op on the mounted volume.
        mkdir -p /app/edge-functions /tmp/snippets
        # The legacy anon / service_role keys: HS256 JWTs signed from
        # JWT_SECRET with the same fixed claims as the gateway.
        sb_jwt() {
          node -e 'const c=require("crypto"),b=x=>Buffer.from(x).toString("base64url"),h=b(`{"alg":"HS256","typ":"JWT"}`),p=b(`{"role":"${process.argv[1]}","iss":"supabase","iat":1763078400,"exp":2078438400}`);process.stdout.write(`${h}.${p}.${c.createHmac("sha256",process.env.JWT_SECRET).update(`${h}.${p}`).digest("base64url")}`)' "$1"
        }
        SUPABASE_ANON_KEY=$(sb_jwt anon)
        SUPABASE_SERVICE_KEY=$(sb_jwt service_role)
        export SUPABASE_ANON_KEY SUPABASE_SERVICE_KEY
        exec docker-entrypoint.sh node apps/studio/server.js
    # Function code lives on one volume: Studio owns the claim and lists it,
    # the functions service mounts the same claim and serves it.
    extraVolumes:
    - name: '{{STACKBLAZE_APP_NAME}}-functions'
      mountPath: /app/edge-functions
      emptyDir: false
      storageClass: shared
      # 5Gi is the smallest size the dashboard provisions.
      size: 5Gi
      accessModes:
      - ReadWriteMany
    envVars:
    - name: HOSTNAME
      value: '::'
    - name: STUDIO_PORT
      value: '3000'
    - name: SUPABASE_URL
      value: http://supabase-api-{{STACKBLAZE_NAME_SUFFIX}}-kuberoapp
    - name: SUPABASE_PUBLIC_URL
      value: '{{STACKBLAZE_APP_URL}}'
    - name: STUDIO_PG_META_URL
      value: http://supabase-meta-{{STACKBLAZE_NAME_SUFFIX}}-kuberoapp
    - name: POSTGRES_HOST
      value: '$(PGHOST)'
    - name: POSTGRES_PORT
      value: '$(PGPORT)'
    - name: POSTGRES_DB
      value: '$(PGDATABASE)'
    - name: POSTGRES_PASSWORD
      value: '$(PGPASSWORD)'
    # Studio builds pg-meta's connection string itself; without these it
    # dials supabase_admin, which no longer carries this tenant's password.
    - name: POSTGRES_USER_READ_WRITE
      value: '$(SUPABASE_DB_ADMIN_USER)'
    - name: POSTGRES_USER_READ_ONLY
      value: '$(SUPABASE_DB_READONLY_USER)'
    # Encrypts the connection strings Studio hands pg-meta (same value on meta).
    - name: PG_META_CRYPTO_KEY
      value: '{{STACKBLAZE_GEN_SHARED:SB_PG_META_CRYPTO_KEY:ALNUM:32}}'
    - name: PGRST_DB_SCHEMAS
      value: public,storage,graphql_public
    - name: PGRST_DB_MAX_ROWS
      value: '1000'
    - name: PGRST_DB_EXTRA_SEARCH_PATH
      value: public
    - name: JWT_SECRET
      value: '{{STACKBLAZE_GEN_SHARED:SB_JWT_SECRET:ALNUM:48}}'
    - name: AUTH_JWT_SECRET
