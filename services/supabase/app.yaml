      startupSeconds: 180
  - id: meta
    nameHint: supabase-meta
    exposeInternet: false
    usePrimaryAddons: true
    image:
      repository: docker.io/supabase/postgres-meta
      tag: v0.96.3
      containerPort: '8080'
    envVars:
    - name: PG_META_PORT
      value: '8080'
    - name: PG_META_DB_HOST
      value: '$(PGHOST)'
    - name: PG_META_DB_PORT
      value: '$(PGPORT)'
    - name: PG_META_DB_NAME
      value: '$(PGDATABASE)'
    - name: PG_META_DB_USER
      value: '$(SUPABASE_DB_ADMIN_USER)'
    - name: PG_META_DB_PASSWORD
      value: '$(PGPASSWORD)'
    healthcheck:
      enabled: true
      path: /health
      startupSeconds: 120
  - id: functions
    nameHint: supabase-functions
    exposeInternet: false
    usePrimaryAddons: true
    image:
      repository: docker.io/supabase/edge-runtime
      tag: v1.71.2
      containerPort: '9000'
      command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        # The router stays off the shared volume so Studio does not list it.
        mkdir -p /home/deno/main /home/deno/functions
        if [ -z "$(ls -A /home/deno/functions 2>/dev/null)" ]; then
          mkdir -p /home/deno/functions/hello
          cat > /home/deno/functions/hello/index.ts << 'ENDHELLO'
        Deno.serve(async (req: Request) => {
          const { name } = await req.json().catch(() => ({}))
          return new Response(JSON.stringify({ message: `Hello ${name || "world"}!` }), {
            headers: { "Content-Type": "application/json" },
          })
        })
        ENDHELLO
        fi
        cat > /home/deno/main/index.ts << 'ENDFN'
        Deno.serve(async (req: Request) => {
          const service = new URL(req.url).pathname.split("/")[1] || ""
          if (!service) {
            return new Response(JSON.stringify({ msg: "missing function name in request" }), {
              status: 400,
              headers: { "Content-Type": "application/json" },
            })
          }
          try {
            const worker = await EdgeRuntime.userWorkers.create({
              servicePath: `/home/deno/functions/${service}`,
              memoryLimitMb: 150,
              workerTimeoutMs: 60000,
              noModuleCache: false,
              importMapPath: null,
              envVars: Object.entries(Deno.env.toObject()),
            })
            return await worker.fetch(req)
          } catch (e) {
            return new Response(JSON.stringify({ msg: String(e) }), {
              status: 500,
              headers: { "Content-Type": "application/json" },
            })
          }
        })
        ENDFN
        exec edge-runtime start --main-service /home/deno/main
    extraVolumes:
    - name: '{{KUBERO_APP_NAME}}-functions'
      existingClaim: supabase-studio-{{KUBERO_NAME_SUFFIX}}-functions
      mountPath: /home/deno/functions
      emptyDir: false
      storageClass: shared
      size: 5Gi
      accessModes:
      - ReadWriteMany
    envVars:
    - name: VERIFY_JWT
      value: 'false'
    - name: SUPABASE_URL
      value: http://supabase-api-{{KUBERO_NAME_SUFFIX}}-kuberoapp
    - name: SUPABASE_ANON_KEY
      value: *anonKey
    - name: SUPABASE_SERVICE_ROLE_KEY
      value: *serviceKey
    - name: SUPABASE_DB_URL
      value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)?sslmode=disable'
    - name: JWT_SECRET
      value: your-super-secret-jwt-token-with-at-least-32-characters-long
    healthcheck:
      enabled: false
  - id: imgproxy
    nameHint: supabase-imgproxy
    exposeInternet: false
    image:
      repository: docker.io/darthsim/imgproxy
      tag: v3.30.1
      containerPort: '5001'
    envVars:
    - name: IMGPROXY_BIND
      value: ':5001'
    - name: IMGPROXY_LOCAL_FILESYSTEM_ROOT
      value: /
    - name: IMGPROXY_USE_ETAG
      value: 'true'
    healthcheck:
      enabled: false
