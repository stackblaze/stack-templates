    - name: DB_PORT
      value: '$(PGPORT)'
    - name: DB_USER
      value: '$(SUPABASE_DB_ADMIN_USER)'
    - name: DB_PASSWORD
      value: '$(PGPASSWORD)'
    - name: DB_NAME
      value: '$(PGDATABASE)'
    - name: DB_SSL
      value: 'false'
    - name: DB_AFTER_CONNECT_QUERY
      value: SET search_path TO _realtime
    - name: DB_ENC_KEY
      value: supabaserealtime
    - name: API_JWT_SECRET
      value: your-super-secret-jwt-token-with-at-least-32-characters-long
    - name: SECRET_KEY_BASE
      value: your-super-secret-jwt-token-with-at-least-32-characters-long
    - name: ERL_AFLAGS
      value: -proto_dist inet_tcp
    - name: DNS_NODES
      value: "''"
    - name: APP_NAME
      value: realtime
    - name: SEED_SELF_HOST
      value: 'true'
    # Realtime looks its tenant up by the first label of the Host header,
    # which is this service's name when Kong dials it.
    - name: SELF_HOST_TENANT_NAME
      value: supabase-realtime-{{KUBERO_NAME_SUFFIX}}-kuberoapp
    - name: RUN_JANITOR
      value: 'true'
    healthcheck:
      enabled: false
  - id: storage
    nameHint: supabase-storage
    exposeInternet: false
    usePrimaryAddons: true
    image:
      repository: docker.io/supabase/storage-api
      tag: v1.48.26
      containerPort: '5000'
    envVars:
    - name: STORAGE_BACKEND
      value: s3
    # Keep Kong's /storage/v1 prefix in resumable-upload (TUS) URLs.
    - name: REQUEST_ALLOW_X_FORWARDED_PATH
      value: 'true'
    - name: FILE_SIZE_LIMIT
      value: '52428800'
    - name: TENANT_ID
      value: stub
    - name: REGION
      value: us-east-1
    - name: GLOBAL_S3_BUCKET
      value: '$(S3_BUCKET)'
    - name: STORAGE_S3_BUCKET
      value: '$(S3_BUCKET)'
    - name: GLOBAL_S3_ENDPOINT
      value: '$(S3_ENDPOINT)'
    - name: STORAGE_S3_ENDPOINT
      value: '$(S3_ENDPOINT)'
    - name: GLOBAL_S3_FORCE_PATH_STYLE
      value: 'true'
    - name: STORAGE_S3_FORCE_PATH_STYLE
      value: 'true'
    - name: AWS_DEFAULT_REGION
      value: us-east-1
    - name: S3_PROTOCOL_ACCESS_KEY_ID
      value: '$(AWS_ACCESS_KEY_ID)'
    - name: S3_PROTOCOL_ACCESS_KEY_SECRET
      value: '$(AWS_SECRET_ACCESS_KEY)'
    - name: DATABASE_URL
      value: 'postgres://$(SUPABASE_DB_STORAGE_USER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)?sslmode=disable'
    - name: POSTGREST_URL
      value: http://supabase-rest-{{KUBERO_NAME_SUFFIX}}-kuberoapp
    - name: ENABLE_IMAGE_TRANSFORMATION
      value: 'true'
    - name: IMGPROXY_URL
      value: http://supabase-imgproxy-{{KUBERO_NAME_SUFFIX}}-kuberoapp
    - name: PGRST_JWT_SECRET
      value: your-super-secret-jwt-token-with-at-least-32-characters-long
    - name: AUTH_JWT_SECRET
      value: your-super-secret-jwt-token-with-at-least-32-characters-long
    - name: ANON_KEY
      value: *anonKey
    - name: SERVICE_KEY
      value: *serviceKey
    healthcheck:
