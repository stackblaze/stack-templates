apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: supabase
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "Build a Postgres backend with auth, storage, and a dashboard from one project.\nAn open-source alternative to Firebase."
    kubero.dev/template.icon: https://avatars.githubusercontent.com/u/54469796?s=200
    kubero.dev/template.installation: |
      Deploys Supabase as a multi-service group (Kong gateway, Studio, Auth, PostgREST, Realtime, Storage, Meta, Edge Functions, imgproxy). PostgreSQL and object storage are platform add-ons: on shared zones they are a communal logical database and a communal-s3 bucket. Kong is the public URL and proxies Studio at /. Sign in to Studio with DASHBOARD_USERNAME (supabase) and DASHBOARD_PASSWORD (generated per deploy; the gateway and Studio cards carry the same value). The anon and service_role keys are the upstream demo JWTs — rotate JWT_SECRET and those keys before production use. A zone should run one Supabase against communal Postgres; the Auth and Storage roles are cluster-wide.
    kubero.dev/template.links: '["https://supabase.com/docs/guides/self-hosting/docker"]'
    kubero.dev/template.screenshots: '[]'
    kubero.dev/template.source: https://github.com/supabase/supabase
    kubero.dev/template.categories: '["development", "data"]'
    kubero.dev/template.title: Supabase
    kubero.dev/template.website: https://supabase.com/
  labels:
    manager: kubero
spec:
  name: supabase
  deploymentstrategy: docker
  ingress:
    annotations:
      # ingress-nginx defaults to 1m, which rejects Studio's 6 MB upload
      # chunks. Storage's own FILE_SIZE_LIMIT (50 MiB) stays the real cap.
      nginx.ingress.kubernetes.io/proxy-body-size: 64m
  gitrepo:
    admin: false
    clone_url: https://github.com/supabase/supabase.git
    default_branch: master
    private: false
    ssh_url: ''
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
          annotations:
            # Communal zones: kubero-server runs its Supabase init as the zone
            # superuser and injects SUPABASE_DB_*_USER next to PG*. Dedicated
            # zones run postInitApplicationSQL below.
            kubero.dev/supabase-init: "true"
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 8Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: supabase
              owner: supabase
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
              # Dedicated zones. The same per-tenant login users the communal init
              # creates (kubero-server supabase-communal-init.ts, generated for
              # owner/password "supabase"), run in the supabase database. CNPG
              # executes this over a plain connection, so no psql meta-commands.
              postInitApplicationSQL:
              - |
                -- Shared, passwordless labels. Server-wide, like every Postgres role, and safe
                -- to share: what they may touch is granted per database.
                DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'postgres') THEN CREATE ROLE postgres NOLOGIN; END IF; END $$;
                DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN CREATE ROLE anon NOLOGIN NOINHERIT; END IF; END $$;
                DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN CREATE ROLE authenticated NOLOGIN NOINHERIT; END IF; END $$;
                DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS; END IF; END $$;
                DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'supabase_realtime_admin') THEN CREATE ROLE supabase_realtime_admin NOLOGIN NOINHERIT; END IF; END $$;
                ALTER ROLE anon SET statement_timeout = '3s';
                ALTER ROLE authenticated SET statement_timeout = '8s';

                -- This tenant's login users, all on the tenant Secret password.
                DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'supabase_admin') THEN CREATE ROLE "supabase_admin" LOGIN; END IF; END $$;
                ALTER ROLE "supabase_admin" WITH LOGIN INHERIT BYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD $sbpw$supabase$sbpw$;
                DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'supabase_auth') THEN CREATE ROLE "supabase_auth" LOGIN; END IF; END $$;
                ALTER ROLE "supabase_auth" WITH LOGIN NOINHERIT NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD $sbpw$supabase$sbpw$;
                DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'supabase_storage') THEN CREATE ROLE "supabase_storage" LOGIN; END IF; END $$;
                ALTER ROLE "supabase_storage" WITH LOGIN NOINHERIT NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD $sbpw$supabase$sbpw$;
                DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'supabase_authenticator') THEN CREATE ROLE "supabase_authenticator" LOGIN; END IF; END $$;
                ALTER ROLE "supabase_authenticator" WITH LOGIN NOINHERIT NOBYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD $sbpw$supabase$sbpw$;
                DO $$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'supabase_readonly') THEN CREATE ROLE "supabase_readonly" LOGIN; END IF; END $$;
                ALTER ROLE "supabase_readonly" WITH LOGIN INHERIT BYPASSRLS NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION PASSWORD $sbpw$supabase$sbpw$;
                GRANT "supabase" TO "supabase_admin";
                -- Studio's read-only mode (POSTGRES_USER_READ_ONLY) sees what admin sees;
                -- its sessions start read-only. Studio connects as this user on request.
                GRANT "supabase_admin" TO "supabase_readonly";
                ALTER ROLE "supabase_readonly" SET default_transaction_read_only = on;
                GRANT anon, authenticated, service_role TO "supabase_authenticator";
                GRANT anon, authenticated, service_role TO "supabase_auth";
                GRANT anon, authenticated, service_role TO "supabase_storage";
                GRANT supabase_realtime_admin TO "supabase_admin" WITH ADMIN OPTION;
                GRANT SET ON PARAMETER log_min_messages TO "supabase_admin";
                -- Studio reads auth.users / storage.* through pg-meta as the admin user.
                GRANT "supabase_auth", "supabase_storage" TO "supabase_admin";
                ALTER ROLE "supabase_auth" SET search_path = 'auth';
                ALTER ROLE "supabase_storage" SET search_path = 'storage';

                -- Only this tenant's roles may connect to its database.
                REVOKE CONNECT ON DATABASE "supabase" FROM PUBLIC;
                GRANT CONNECT, CREATE ON DATABASE "supabase" TO "supabase", "supabase_admin", "supabase_auth", "supabase_storage";
                GRANT CONNECT ON DATABASE "supabase" TO "supabase_authenticator", "supabase_readonly";
                -- Deployments from before per-tenant users still connect as the old
                -- server-wide roles; keep them working until they are redeployed.
                DO $$ DECLARE r text; BEGIN
                  FOREACH r IN ARRAY ARRAY['supabase_admin', 'supabase_auth_admin', 'supabase_storage_admin', 'authenticator'] LOOP
                    IF EXISTS (SELECT FROM pg_roles WHERE rolname = r) THEN EXECUTE format('GRANT CONNECT ON DATABASE %I TO %I', 'supabase', r); END IF;
                  END LOOP;
                END $$;

                -- Extensions + public schema
                CREATE SCHEMA IF NOT EXISTS extensions;
                CREATE EXTENSION IF NOT EXISTS "uuid-ossp" WITH SCHEMA extensions;
                CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA extensions;
                GRANT USAGE ON SCHEMA extensions TO postgres, anon, authenticated, service_role;
                GRANT ALL ON SCHEMA extensions TO "supabase_admin";
                GRANT USAGE ON SCHEMA public TO postgres, anon, authenticated, service_role;
                GRANT USAGE, CREATE ON SCHEMA public TO "supabase_admin";
                -- Tables made in Studio (admin) or by the owner role are reachable through
                -- the API, as upstream's defaults for its postgres role make them.
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_admin" IN SCHEMA public GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_admin" IN SCHEMA public GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_admin" IN SCHEMA public GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase" IN SCHEMA public GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase" IN SCHEMA public GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase" IN SCHEMA public GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
                GRANT ALL ON ALL TABLES IN SCHEMA public TO anon, authenticated, service_role;
                GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO anon, authenticated, service_role;
                GRANT ALL ON ALL FUNCTIONS IN SCHEMA public TO anon, authenticated, service_role;

                -- Auth (GoTrue connects as supabase_auth)
                CREATE SCHEMA IF NOT EXISTS auth;
                DO $$ BEGIN IF (SELECT pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname = 'auth') = current_user THEN EXECUTE format('ALTER SCHEMA auth OWNER TO %I', 'supabase_auth'); END IF; END $$;
                GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
                -- Same bodies GoTrue's own migrations install (they read request.jwt.claims,
                -- which PostgREST sets). CREATE OR REPLACE keeps an existing owner; a function
                -- we just created belongs to the superuser and is handed to the auth user, so
                -- GoTrue can replace it later.
                CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid AS $$
                  SELECT coalesce(
                    nullif(current_setting('request.jwt.claim.sub', true), ''),
                    (nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'sub')
                  )::uuid;
                $$ LANGUAGE sql STABLE;
                CREATE OR REPLACE FUNCTION auth.role() RETURNS text AS $$
                  SELECT coalesce(
                    nullif(current_setting('request.jwt.claim.role', true), ''),
                    (nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'role')
                  )::text;
                $$ LANGUAGE sql STABLE;
                CREATE OR REPLACE FUNCTION auth.email() RETURNS text AS $$
                  SELECT coalesce(
                    nullif(current_setting('request.jwt.claim.email', true), ''),
                    (nullif(current_setting('request.jwt.claims', true), '')::jsonb ->> 'email')
                  )::text;
                $$ LANGUAGE sql STABLE;
                DO $$ DECLARE f text; BEGIN
                  FOREACH f IN ARRAY ARRAY['auth.uid()', 'auth.role()', 'auth.email()'] LOOP
                    IF (SELECT pg_get_userbyid(proowner) FROM pg_proc WHERE oid = f::regprocedure) = current_user THEN
                      EXECUTE format('ALTER FUNCTION %s OWNER TO %I', f, 'supabase_auth');
                    END IF;
                  END LOOP;
                END $$;

                -- Storage (storage-api connects as supabase_storage)
                CREATE SCHEMA IF NOT EXISTS storage;
                DO $$ BEGIN IF (SELECT pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname = 'storage') = current_user THEN EXECUTE format('ALTER SCHEMA storage OWNER TO %I', 'supabase_storage'); END IF; END $$;
                GRANT USAGE ON SCHEMA storage TO postgres, anon, authenticated, service_role;
                GRANT ALL ON SCHEMA storage TO "supabase_storage" WITH GRANT OPTION;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_storage" IN SCHEMA storage GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_storage" IN SCHEMA storage GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
                ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_storage" IN SCHEMA storage GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;

                -- Realtime (connects as supabase_admin; its tenant migrations expect these)
                CREATE SCHEMA IF NOT EXISTS _realtime;
                DO $$ BEGIN IF (SELECT pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname = '_realtime') = current_user THEN EXECUTE format('ALTER SCHEMA _realtime OWNER TO %I', 'supabase_admin'); END IF; END $$;
                CREATE SCHEMA IF NOT EXISTS realtime;
                DO $$ BEGIN IF (SELECT pg_get_userbyid(nspowner) FROM pg_namespace WHERE nspname = 'realtime') = current_user THEN EXECUTE format('ALTER SCHEMA realtime OWNER TO %I', 'supabase_admin'); END IF; END $$;
                CREATE SCHEMA IF NOT EXISTS graphql_public;
                GRANT USAGE ON SCHEMA graphql_public TO anon, authenticated, service_role;
                GRANT ALL ON SCHEMA graphql_public TO "supabase_admin";
                DO $$ BEGIN
                  IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = 'supabase_realtime') THEN
                    CREATE PUBLICATION supabase_realtime;
                  END IF;
                END $$;
                ALTER PUBLICATION supabase_realtime OWNER TO "supabase_admin";
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: supabase
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: supabase
          password: supabase
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env: []
    resourceDefinitions: {}
  - displayName: RustFS
    env: []
    icon: /img/addons/rustfs.svg
    id: kubero-operator
    kind: Tenant
    resourceDefinitions:
      Tenant:
        apiVersion: rustfs.com/v1alpha1
        kind: Tenant
        metadata:
          name: '{{KUBERO_APP_NAME}}-rustfs'
          annotations:
            operator.rustfs.com/runtime-default-image-ack: registry.stackblaze.cloud/rustfs/rustfs:1.0.0-beta.10
        spec:
          image: registry.stackblaze.cloud/rustfs/rustfs:1.0.0-beta.10
          credsSecret:
            name: '{{KUBERO_APP_NAME}}-rustfs-credentials'
          pools:
          - name: pool-0
            servers: 1
            persistence:
              volumesPerServer: 4
              volumeClaimTemplate:
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 2Gi
                storageClassName: slow
      credsSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-rustfs-credentials'
        type: Opaque
        stringData:
          accesskey: supabase
          secretkey: '{{KUBERO_GEN_HEX:32}}'
  envVars:
  - name: KONG_DATABASE
    value: 'off'
  - name: KONG_DECLARATIVE_CONFIG
    value: /usr/local/kong/kong.yml
  - name: KONG_DNS_ORDER
    value: LAST,A,CNAME
  - name: KONG_DNS_NOT_FOUND_TTL
    value: '1'
  - name: KONG_PLUGINS
    value: request-transformer,cors,key-auth,acl,basic-auth,request-termination,ip-restriction,pre-function,post-function
  - name: KONG_ROUTER_FLAVOR
    value: expressions
  - name: KONG_NGINX_WORKER_PROCESSES
    value: '2'
  - name: KONG_PROXY_LISTEN
    value: 0.0.0.0:8000
  - name: KONG_LOG_LEVEL
    value: warn
  # Trust the ingress's X-Forwarded-Proto/Port so upstreams see https:443,
  # not Kong's own http:8000. Storage builds resumable-upload URLs from them.
  - name: KONG_TRUSTED_IPS
    value: 0.0.0.0/0,::/0
  - name: KONG_REAL_IP_HEADER
    value: X-Forwarded-For
  - name: SUPABASE_ANON_KEY
    value: &anonKey eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE
  - name: SUPABASE_SERVICE_KEY
    value: &serviceKey eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJzZXJ2aWNlX3JvbGUiLAogICAgImlzcyI6ICJzdXBhYmFzZS1kZW1vIiwKICAgICJpYXQiOiAxNjQxNzY5MjAwLAogICAgImV4cCI6IDE3OTk1MzU2MDAKfQ.DaYlNEoUrrEn2Ig7tqibS-PHK5vgusbcbo7X36XVt4Q
  - name: DASHBOARD_USERNAME
    value: supabase
  - name: DASHBOARD_PASSWORD
    value: '{{KUBERO_GEN_ALNUM:24}}'
  extraVolumes: []
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 512Mi
  healthcheck:
    enabled: false
  image:
    containerPort: '8000'
    pullPolicy: IfNotPresent
    repository: docker.io/kong/kong
    tag: '3.9.1'
    command:
    - /bin/bash
    - -c
    - |
      set -euo pipefail
      cat > /usr/local/kong/template.yml << 'ENDKONG'
      _format_version: '2.1'
      _transform: true

      ###
      ### Consumers / Users
      ###
      consumers:
        - username: DASHBOARD
        - username: anon
          keyauth_credentials:
            - key: ${SUPABASE_ANON_KEY}
            - key: ${SUPABASE_PUBLISHABLE_KEY}
        - username: service_role
          keyauth_credentials:
            - key: ${SUPABASE_SERVICE_KEY}
            - key: ${SUPABASE_SECRET_KEY}

      ###
      ### Access Control List
      ###
      acls:
        - consumer: anon
          group: anon
        - consumer: service_role
          group: admin

      ###
      ### Dashboard credentials
      ###
      basicauth_credentials:
        - consumer: DASHBOARD
          username: '${DASHBOARD_USERNAME}'
          password: '${DASHBOARD_PASSWORD}'

      ###
      ### API Routes
      ###
      services:
        ## Open Auth routes
        - name: auth-v1-open
          _comment: 'Auth: /auth/v1/verify* -> http://auth:9999/verify*'
          url: http://auth:9999/verify
          routes:
            - name: auth-v1-open
              strip_path: true
              paths:
                - /auth/v1/verify
          plugins:
            - name: cors
        - name: auth-v1-open-callback
          _comment: 'Auth: /auth/v1/callback* -> http://auth:9999/callback*'
          url: http://auth:9999/callback
          routes:
            - name: auth-v1-open-callback
              strip_path: true
              paths:
                - /auth/v1/callback
          plugins:
            - name: cors
        - name: auth-v1-open-authorize
          _comment: 'Auth: /auth/v1/authorize* -> http://auth:9999/authorize*'
          url: http://auth:9999/authorize
          routes:
            - name: auth-v1-open-authorize
              strip_path: true
              paths:
                - /auth/v1/authorize
          plugins:
            - name: cors
        - name: auth-v1-open-jwks
          _comment: 'Auth: /auth/v1/.well-known/jwks.json -> http://auth:9999/.well-known/jwks.json'
          url: http://auth:9999/.well-known/jwks.json
          routes:
            - name: auth-v1-open-jwks
              strip_path: true
              paths:
                - /auth/v1/.well-known/jwks.json
          plugins:
            - name: cors

        - name: auth-v1-open-sso-acs
          url: "http://auth:9999/sso/saml/acs"
          routes:
            - name: auth-v1-open-sso-acs
              strip_path: true
              paths:
              - /auth/v1/sso/saml/acs
          plugins:
            - name: cors

        - name: auth-v1-open-sso-metadata
          url: "http://auth:9999/sso/saml/metadata"
          routes:
            - name: auth-v1-open-sso-metadata
              strip_path: true
              paths:
              - /auth/v1/sso/saml/metadata
          plugins:
            - name: cors

        ## Secure Auth routes
        - name: auth-v1
          _comment: 'Auth: /auth/v1/* -> http://auth:9999/*'
          url: http://auth:9999/
          routes:
            - name: auth-v1-all
              strip_path: true
              paths:
                - /auth/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: ${LUA_AUTH_EXPR}"
                replace:
                  headers:
                    - "Authorization: ${LUA_AUTH_EXPR}"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## OpenAPI root - admin only
        - name: rest-v1-openapi
          _comment: 'PostgREST OpenAPI root: /rest/v1/ -> <http://rest:3000/> (admin only). See <https://github.com/orgs/supabase/discussions/42949>'
          url: http://rest:3000/
          routes:
            - name: rest-v1-openapi-root
              strip_path: true
              expression: 'http.path == "/rest/v1/"'
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: ${LUA_AUTH_EXPR}"
                replace:
                  headers:
                    - "Authorization: ${LUA_AUTH_EXPR}"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin

        ## Secure PostgREST routes
        - name: rest-v1
          _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
          url: http://rest:3000/
          routes:
            - name: rest-v1-all
              strip_path: true
              paths:
                - /rest/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: ${LUA_AUTH_EXPR}"
                replace:
                  headers:
                    - "Authorization: ${LUA_AUTH_EXPR}"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Secure GraphQL routes
        - name: graphql-v1
          _comment: 'PostgREST: /graphql/v1/* -> http://rest:3000/rpc/graphql'
          url: http://rest:3000/rpc/graphql
          routes:
            - name: graphql-v1-all
              strip_path: true
              paths:
                - /graphql/v1
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Content-Profile: graphql_public"
                    - "Authorization: ${LUA_AUTH_EXPR}"
                replace:
                  headers:
                    - "Authorization: ${LUA_AUTH_EXPR}"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Secure Realtime routes
        - name: realtime-v1-ws
          _comment: 'Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
          url: http://realtime-dev.supabase-realtime:4000/socket
          protocol: ws
          routes:
            - name: realtime-v1-ws
              strip_path: true
              paths:
                - /realtime/v1/
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "x-api-key:${LUA_RT_WS_EXPR}"
                replace:
                  querystring:
                    - "apikey:${LUA_RT_WS_EXPR}"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        # Block access to /realtime/v1/api/openapi
        - name: realtime-v1-rest-openapi
          _comment: 'Realtime: /realtime/v1/api/openapi/* -> http://realtime:4000/api/openapi/* (blocked)'
          url: http://realtime-dev.supabase-realtime:4000/api/openapi
          protocol: http
          routes:
            - name: realtime-v1-rest-openapi
              strip_path: true
              paths:
                - /realtime/v1/api/openapi
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."

        # Block access to /realtime/v1/api/tenants
        - name: realtime-v1-rest-tenants
          _comment: 'Realtime: /realtime/v1/api/tenants/* -> http://realtime:4000/api/tenants/* (blocked)'
          url: http://realtime-dev.supabase-realtime:4000/api/tenants
          protocol: http
          routes:
            - name: realtime-v1-rest-tenants
              strip_path: true
              paths:
                - /realtime/v1/api/tenants
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."

        - name: realtime-v1-rest
          _comment: 'Realtime: /realtime/v1/api/* -> http://realtime:4000/api/*'
          url: http://realtime-dev.supabase-realtime:4000/api
          protocol: http
          routes:
            - name: realtime-v1-rest
              strip_path: true
              paths:
                - /realtime/v1/api
          plugins:
            - name: cors
            - name: key-auth
              config:
                hide_credentials: false
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: ${LUA_AUTH_EXPR}"
                replace:
                  headers:
                    - "Authorization: ${LUA_AUTH_EXPR}"
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin
                  - anon

        ## Storage API endpoint (with Authorization header transformation).
        ## No key-auth - S3 protocol requests don't carry an apikey header.
        ##
        ## The request-transformer translates opaque API keys to asymmetric JWTs
        ## and passes through existing Authorization headers (user JWTs, AWS SigV4).
        ## When no Authorization or apikey header is present (S3 presigned URLs),
        ## the Lua expression evaluates to nil which Kong renders as empty string.
        ## The post-function strips this empty header so Storage's S3 signature
        ## verification falls through to query-parameter parsing.
        - name: storage-v1
          _comment: 'Storage: /storage/v1/* -> http://storage:5000/*'
          url: http://storage:5000/
          routes:
            - name: storage-v1-all
              strip_path: true
              paths:
                - /storage/v1/
          plugins:
            - name: cors
            - name: request-transformer
              config:
                add:
                  headers:
                    - "Authorization: ${LUA_AUTH_EXPR}"
                replace:
                  headers:
                    - "Authorization: ${LUA_AUTH_EXPR}"
            - name: post-function
              config:
                access:
                  - |
                    local auth = kong.request.get_header("authorization")
                    if auth == nil or auth == "" or auth:find("^%s*$") then
                      kong.service.request.clear_header("authorization")
                    end

        ## Edge Functions routes
        - name: functions-v1
          _comment: 'Edge Functions: /functions/v1/* -> http://functions:9000/*'
          url: http://functions:9000/
          read_timeout: 150000
          routes:
            - name: functions-v1-all
              strip_path: true
              paths:
                - /functions/v1/
          plugins:
            - name: cors

        ## OAuth 2.0 Authorization Server Metadata (RFC 8414)
        - name: well-known-oauth
          _comment: 'Auth: /.well-known/oauth-authorization-server -> http://auth:9999/.well-known/oauth-authorization-server'
          url: http://auth:9999/.well-known/oauth-authorization-server
          routes:
            - name: well-known-oauth
              strip_path: true
              paths:
                - /.well-known/oauth-authorization-server
          plugins:
            - name: cors

        ## Analytics routes
        ## Not used - Studio and Vector talk directly to analytics via Docker networking.
        ## If external access is needed, add routes with key-auth matching Logflare's x-api-key auth.
        # - name: analytics-v1-api
        #   _comment: 'Analytics: /analytics/v1/api/endpoints/* -> http://logflare:4000/api/endpoints/*'
        #   url: http://analytics:4000/api/endpoints
        #   routes:
        #     - name: analytics-v1-api
        #       strip_path: true
        #       paths:
        #         - /analytics/v1/api/endpoints/
        # - name: analytics-v1
        #   _comment: 'Analytics: /analytics/v1/* -> http://logflare:4000/*'
        #   url: http://analytics:4000/
        #   routes:
        #     - name: dashboard-v1-all
        #       strip_path: true
        #       paths:
        #         - /analytics/v1
        #   plugins:
        #     - name: cors
        #     - name: basic-auth
        #       config:
        #         hide_credentials: true

        ## Secure Database routes
        - name: meta
          _comment: 'pg-meta: /pg/* -> http://pg-meta:8080/*'
          url: http://meta:8080/
          routes:
            - name: meta-all
              strip_path: true
              paths:
                - /pg/
          plugins:
            - name: key-auth
              config:
                hide_credentials: false
            - name: acl
              config:
                hide_groups_header: true
                allow:
                  - admin

        ## Block access to /api/mcp
        - name: mcp-blocker
          _comment: 'Block direct access to /api/mcp'
          url: http://studio:3000/api/mcp
          routes:
            - name: mcp-blocker-route
              strip_path: true
              paths:
                - /api/mcp
          plugins:
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."

        ## MCP endpoint - local access
        - name: mcp
          _comment: 'MCP: /mcp -> http://studio:3000/api/mcp (local access)'
          url: http://studio:3000/api/mcp
          routes:
            - name: mcp
              strip_path: true
              paths:
                - /mcp
          plugins:
            # Block access to /mcp by default
            - name: request-termination
              config:
                status_code: 403
                message: "Access is forbidden."
            # Enable local access (danger zone!)
            # 1. Comment out the 'request-termination' section above
            # 2. Uncomment the entire section below, including 'deny'
            # 3. Add your local IPs to the 'allow' list
            #- name: cors
            #- name: ip-restriction
            #  config:
            #    allow:
            #      - 127.0.0.1
            #      - ::1
            #    deny: []

        ## Protected Dashboard - catch all remaining routes
        - name: dashboard
          _comment: 'Studio: /* -> http://studio:3000/*'
          url: http://studio:3000/
          routes:
            - name: dashboard-all
              strip_path: true
              paths:
                - /
          plugins:
            - name: cors
            # Sign-in is Studio's own page (STUDIO_SELF_HOSTED_LOGIN on the Studio
            # card); the gateway passes / through. API prefixes are separate routes
            # and stay on apikey auth.
      ENDKONG
      cat > /tmp/kong-entrypoint.sh << 'ENDENTRY'
      #!/bin/bash
      # Render the declarative Kong config, then start the gateway.
      # Placeholders in kong.yml are ${NAME}. Empty key lines (unset publishable
      # keys) are dropped so Kong does not reject the file.
      set -euo pipefail

      if [ -n "${SUPABASE_SECRET_KEY:-}" ] && [ -n "${SUPABASE_PUBLISHABLE_KEY:-}" ]; then
        export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or (headers.apikey == '${SUPABASE_SECRET_KEY}' and 'Bearer ${SERVICE_ROLE_KEY_ASYMMETRIC}') or (headers.apikey == '${SUPABASE_PUBLISHABLE_KEY}' and 'Bearer ${ANON_KEY_ASYMMETRIC}') or headers.apikey)"
        export LUA_RT_WS_EXPR="\$((query_params.apikey == '${SUPABASE_SECRET_KEY}' and '${SERVICE_ROLE_KEY_ASYMMETRIC}') or (query_params.apikey == '${SUPABASE_PUBLISHABLE_KEY}' and '${ANON_KEY_ASYMMETRIC}') or query_params.apikey)"
      else
        export LUA_AUTH_EXPR="\$((headers.authorization ~= nil and headers.authorization:sub(1, 10) ~= 'Bearer sb_' and headers.authorization) or headers.apikey)"
        export LUA_RT_WS_EXPR="\$(query_params.apikey)"
      fi

      sed \
        -e "s|\${SUPABASE_ANON_KEY}|${SUPABASE_ANON_KEY}|" \
        -e "s|\${SUPABASE_SERVICE_KEY}|${SUPABASE_SERVICE_KEY}|" \
        -e "s|\${SUPABASE_PUBLISHABLE_KEY}|${SUPABASE_PUBLISHABLE_KEY:-}|" \
        -e "s|\${SUPABASE_SECRET_KEY}|${SUPABASE_SECRET_KEY:-}|" \
        -e "s|\${ANON_KEY_ASYMMETRIC}|${ANON_KEY_ASYMMETRIC:-}|" \
        -e "s|\${SERVICE_ROLE_KEY_ASYMMETRIC}|${SERVICE_ROLE_KEY_ASYMMETRIC:-}|" \
        -e "s|\${LUA_AUTH_EXPR}|${LUA_AUTH_EXPR}|" \
        -e "s|\${LUA_RT_WS_EXPR}|${LUA_RT_WS_EXPR}|" \
        -e "s|\${DASHBOARD_USERNAME}|${DASHBOARD_USERNAME}|" \
        -e "s|\${DASHBOARD_PASSWORD}|${DASHBOARD_PASSWORD}|" \
        /usr/local/kong/template.yml \
        > /usr/local/kong/kong.yml

      sed -i '/^[[:space:]]*- key:[[:space:]]*$/d' /usr/local/kong/kong.yml

      # Catalog companions are Kubero Services named
      # supabase-<role>-<suffix>-kuberoapp (port 80 → the container port).
      # This pod is supabase-api-<suffix>-kuberoapp-web-…. Short compose names
      # (storage:5000, studio:3000) are not created with the apps, and Kong
      # caches the miss.
      self="${HOSTNAME%%-kuberoapp-*}"
      suffix="${self#supabase-api-}"
      sb_svc() { printf 'supabase-%s-%s-kuberoapp' "$1" "$suffix"; }
      sed -i \
        -e "s|http://auth:9999|http://$(sb_svc auth)|g" \
        -e "s|http://rest:3000|http://$(sb_svc rest)|g" \
        -e "s|http://realtime-dev.supabase-realtime:4000|http://$(sb_svc realtime)|g" \
        -e "s|http://storage:5000|http://$(sb_svc storage)|g" \
        -e "s|http://functions:9000|http://$(sb_svc functions)|g" \
        -e "s|http://meta:8080|http://$(sb_svc meta)|g" \
        -e "s|http://studio:3000|http://$(sb_svc studio)|g" \
        /usr/local/kong/kong.yml

      exec /entrypoint.sh kong docker-start
      ENDENTRY
      chmod +x /tmp/kong-entrypoint.sh
      exec /tmp/kong-entrypoint.sh
    run:
      securityContext:
        readOnlyRootFilesystem: false
  templateServices:
  - id: studio
    nameHint: supabase-studio
    exposeInternet: false
    usePrimaryAddons: true
    image:
      # stackblaze/supabase fork: self-hosted sign-in page and Edge Function
      # deploy/delete from the UI (upstream gates both behind IS_PLATFORM).
      repository: ghcr.io/stackblaze/supabase-studio
      tag: sha-d55414b
      containerPort: '3000'
      # Studio 500s on the Edge Functions page unless its management folders
      # exist; the image does not ship them.
      command:
      - /bin/sh
      - -c
      - |
        # No-op on the mounted volume; keeps the page working where the
        # volume is not attached.
        mkdir -p /app/edge-functions /tmp/snippets
        exec docker-entrypoint.sh node apps/studio/server.js
    # Function code lives on one volume: Studio owns the claim and lists it,
    # the functions service mounts the same claim and serves it.
    extraVolumes:
    - name: '{{KUBERO_APP_NAME}}-functions'
      mountPath: /app/edge-functions
      emptyDir: false
      storageClass: shared
      # 5Gi is the smallest size the dashboard provisions.
      size: 5Gi
      accessModes:
      - ReadWriteMany
    envVars:
    - name: HOSTNAME
      value: '::'
    - name: STUDIO_PORT
      value: '3000'
    - name: SUPABASE_URL
      value: http://supabase-api-{{KUBERO_NAME_SUFFIX}}-kuberoapp
    - name: SUPABASE_PUBLIC_URL
      value: '{{KUBERO_APP_URL}}'
    - name: STUDIO_PG_META_URL
      value: http://supabase-meta-{{KUBERO_NAME_SUFFIX}}-kuberoapp
    - name: POSTGRES_HOST
      value: '$(PGHOST)'
    - name: POSTGRES_PORT
      value: '$(PGPORT)'
    - name: POSTGRES_DB
      value: '$(PGDATABASE)'
    - name: POSTGRES_PASSWORD
      value: '$(PGPASSWORD)'
    # Studio builds pg-meta's connection string itself; without these it
    # dials supabase_admin, which no longer carries this tenant's password.
    - name: POSTGRES_USER_READ_WRITE
      value: '$(SUPABASE_DB_ADMIN_USER)'
    - name: POSTGRES_USER_READ_ONLY
      value: '$(SUPABASE_DB_READONLY_USER)'
    - name: SUPABASE_ANON_KEY
      value: *anonKey
    - name: SUPABASE_SERVICE_KEY
      value: *serviceKey
    - name: AUTH_JWT_SECRET
      value: your-super-secret-jwt-token-with-at-least-32-characters-long
    - name: DEFAULT_ORGANIZATION_NAME
      value: Default Organization
    - name: DEFAULT_PROJECT_NAME
      value: Default Project
    - name: EDGE_FUNCTIONS_MANAGEMENT_FOLDER
      value: /app/edge-functions
    - name: SNIPPETS_MANAGEMENT_FOLDER
      value: /tmp/snippets
    # Studio's own sign-in page. Same DASHBOARD_* names as the gateway card:
    # the dashboard materializes one generated value per name across cards.
    - name: STUDIO_SELF_HOSTED_LOGIN
      value: 'true'
    - name: DASHBOARD_USERNAME
      value: supabase
    - name: DASHBOARD_PASSWORD
      value: '{{KUBERO_GEN_ALNUM:24}}'
    healthcheck:
      enabled: true
      path: /
      startupSeconds: 300
  - id: auth
    nameHint: supabase-auth
    exposeInternet: false
    usePrimaryAddons: true
    image:
      repository: docker.io/supabase/gotrue
      tag: v2.186.0
      containerPort: '9999'
    envVars:
    - name: GOTRUE_API_HOST
      value: 0.0.0.0
    - name: GOTRUE_API_PORT
      value: '9999'
    - name: API_EXTERNAL_URL
      value: http://supabase-api-{{KUBERO_NAME_SUFFIX}}-kuberoapp
    - name: GOTRUE_SITE_URL
      value: http://supabase-api-{{KUBERO_NAME_SUFFIX}}-kuberoapp
    - name: GOTRUE_URI_ALLOW_LIST
