    - name: GOTRUE_MAILER_URLPATHS_RECOVERY
      value: /auth/v1/verify
    - name: GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE
      value: /auth/v1/verify
    - name: GOTRUE_DB_DRIVER
      value: postgres
    - name: GOTRUE_DB_DATABASE_URL
      # SUPABASE_DB_*_USER: per-tenant login users the platform creates next to PG*.
      value: 'postgres://$(SUPABASE_DB_AUTH_USER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)?sslmode=disable'
    healthcheck:
