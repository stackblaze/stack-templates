    image:
      repository: docker.io/supabase/edge-runtime
      tag: v1.71.2
      containerPort: '9000'
      command:
      - /bin/bash
      - -c
      - |
        set -euo pipefail
        mkdir -p /home/deno/functions/main
        cat > /home/deno/functions/main/index.ts << 'ENDFN'
        Deno.serve(async (req: Request) => {
          const service = new URL(req.url).pathname.split("/")[1] || ""
          if (!service) {
            return new Response(JSON.stringify({ msg: "missing function name in request" }), {
              status: 400,
              headers: { "Content-Type": "application/json" },
            })
          }
          try {
            const worker = await EdgeRuntime.userWorkers.create({
              servicePath: `/home/deno/functions/${service}`,
              memoryLimitMb: 150,
              workerTimeoutMs: 60000,
              noModuleCache: false,
              importMapPath: null,
              envVars: Object.entries(Deno.env.toObject()),
            })
            return await worker.fetch(req)
          } catch (e) {
            return new Response(JSON.stringify({ msg: String(e) }), {
              status: 500,
              headers: { "Content-Type": "application/json" },
            })
          }
        })
        ENDFN
        exec edge-runtime start --main-service /home/deno/functions/main
