apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: posthog
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: Open-source product analytics, session replay,
      feature flags, A/B testing and surveys platform built on PostgreSQL, ClickHouse
      and Kafka.
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/posthog/icon.png
    kubero.dev/template.installation: |-
      PostHog is a LARGE multi-service stack. This template deploys it as a group of apps:

        - posthog (this app, image ghcr.io/posthog/posthog, HTTP port 8000): the Django backend + frontend. On every start it runs `./bin/migrate` (Postgres and ClickHouse schemas) before it serves, so there is no separate migrate job.
        - posthog-worker: the same image running `./bin/docker-worker-celery --with-scheduler` (Celery async tasks and the scheduler). REQUIRED for the app to work.
        - posthog-ingestion: the Node.js image ghcr.io/posthog/posthog-node with PLUGIN_SERVER_MODE=ingestion-v2-combined. It consumes events from Kafka and writes them to ClickHouse; REQUIRED for any analytics data to appear.
        - posthog-plugins: the same Node.js image in its default mode (CDP destinations, webhooks, workflows, realtime cohorts, error tracking). Private web service on port 6738; the web app reaches it through CDP_API_URL.
        - posthog-kafka: Redpanda (Kafka API) in dev-container mode, ephemeral. KAFKA_HOSTS points at it.

      The worker and the Node.js apps inherit this app's env and add-ons, so they share the database, ClickHouse, Kafka and Valkey settings and the generated SECRET_KEY and ENCRYPTION_SALT_KEYS.

      ADD-ONS provisioned here: postgres (relational app DB), clickhouse (the OLAP event store, reached at clickhouse-posthog-clickhouse:8123 over plain HTTP, so CLICKHOUSE_SECURE=false and CLICKHOUSE_VERIFY=false), and valkey (Redis-compatible cache/broker, no password).

      NOT provisioned - deploy these yourself if you need them:
        - OBJECT STORAGE (session recordings, exports, uploads): PostHog requires S3-compatible storage for these. Deploy the platform's RustFS/S3 add-on or `minio/minio`, then set OBJECT_STORAGE_ENABLED=true, OBJECT_STORAGE_ENDPOINT, OBJECT_STORAGE_ACCESS_KEY_ID, OBJECT_STORAGE_SECRET_ACCESS_KEY and OBJECT_STORAGE_BUCKET on the web, worker and Node.js apps.
        - TEMPORAL (batch exports / scheduled jobs): image `temporalio/auto-setup` on gRPC 7233; only needed if you use batch exports.
        - (Optional high-scale, separate Rust images) CAPTURE -> `ghcr.io/posthog/posthog/capture`, FEATURE-FLAGS -> `ghcr.io/posthog/posthog/feature-flags`.

      SECRET_KEY and ENCRYPTION_SALT_KEYS are generated at deploy. ENCRYPTION_SALT_KEYS CANNOT change after first boot or stored secrets break.

      FIRST-RUN: the first start runs the migrations, which can take several minutes. Then open {{KUBERO_APP_URL}} and complete the on-screen setup wizard to create the first organization and admin user. SITE_URL is preset to your public URL and IS_BEHIND_PROXY=true / DISABLE_SECURE_SSL_REDIRECT=true are set because TLS is terminated at the Kubero ingress. NOTE: PostHog deprecated its official Helm chart - self-hosting is officially Docker-Compose-based and unsupported for high scale; PostHog Cloud is the recommended path for large workloads.
    kubero.dev/template.links: '["https://posthog.com/docs/self-host", "https://posthog.com/docs/self-host/configure/environment-variables"]'
    kubero.dev/template.screenshots: '["https://posthog.com/images/og/default.png"]'
    kubero.dev/template.source: https://github.com/PostHog/posthog
    kubero.dev/template.categories: '["data", "monitoring", "productivity"]'
    kubero.dev/template.title: PostHog
    kubero.dev/template.website: https://posthog.com
  labels:
    manager: kubero
spec:
  name: posthog
  deploymentstrategy: docker
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: posthog
              owner: posthog
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO posthog
              - GRANT CREATE ON SCHEMA public TO posthog
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO posthog
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: posthog
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: posthog
          password: posthog
  - displayName: ClickHouse
    env: []
    icon: /img/addons/clickhouse.svg
    id: clickhouse-operator
    kind: ClickHouseInstallation
    resourceDefinitions:
      ClickHouseInstallation:
        apiVersion: clickhouse.altinity.com/v1
        kind: ClickHouseInstallation
        metadata:
          name: '{{KUBERO_APP_NAME}}-clickhouse'
        spec:
          configuration:
            zookeeper:
              nodes:
              - host: 127.0.0.1
                port: 2181
              session_timeout_ms: 30000
              operation_timeout_ms: 10000
            files:
              config.d/posthog-remote-servers.xml: "<clickhouse>\n  <macros>\n   \
                \ <shard>01</shard>\n    <replica>ch1</replica>\n    <hostClusterType>online</hostClusterType>\n\
                \    <hostClusterRole>data</hostClusterRole>\n  </macros>\n  <remote_servers>\n\
                \    <posthog>\n      <shard>\n        <replica>\n          <host>localhost</host>\n\
                \          <port>9000</port>\n        </replica>\n      </shard>\n\
                \    </posthog>\n    <posthog_migrations>\n      <shard>\n       \
                \ <replica>\n          <host>localhost</host>\n          <port>9000</port>\n\
                \        </replica>\n      </shard>\n    </posthog_migrations>\n \
                \   <posthog_single_shard>\n      <shard>\n        <replica>\n   \
                \       <host>localhost</host>\n          <port>9000</port>\n    \
                \    </replica>\n      </shard>\n    </posthog_single_shard>\n   \
                \ <posthog_writable>\n      <shard>\n        <replica>\n         \
                \ <host>localhost</host>\n          <port>9000</port>\n        </replica>\n\
                \      </shard>\n    </posthog_writable>\n    <posthog_primary_replica>\n\
                \      <shard>\n        <replica>\n          <host>localhost</host>\n\
                \          <port>9000</port>\n        </replica>\n      </shard>\n\
                \    </posthog_primary_replica>\n  </remote_servers>\n</clickhouse>\n"
            users:
              admin/password: posthog
              admin/networks/ip:
              - 0.0.0.0/0
            clusters:
            - name: analytics
              layout:
                shardsCount: 1
                replicasCount: 1
              templates:
                podTemplate: clickhouse-pod-template
          defaults:
            templates:
              dataVolumeClaimTemplate: data-volume-template
              logVolumeClaimTemplate: log-volume-template
              podTemplate: clickhouse-pod-template
          templates:
            podTemplates:
            - name: clickhouse-pod-template
              spec:
                containers:
                - name: clickhouse
                  image: ghcr.io/stackblaze/stack-templates/clickhouse-server:24.8.7.41
                  resources:
                    requests:
                      cpu: 100m
                      memory: 512Mi
                    limits:
                      cpu: '1'
                      memory: 2Gi
                - name: zookeeper
                  image: docker.io/library/zookeeper:3.7.0
                  env:
                  - name: ZOO_AUTOPURGE_PURGEINTERVAL
                    value: '1'
                  - name: ZOO_AUTOPURGE_SNAPRETAINCOUNT
                    value: '3'
                  resources:
                    requests:
                      cpu: 50m
                      memory: 256Mi
                    limits:
                      cpu: 500m
                      memory: 512Mi
            volumeClaimTemplates:
            - name: data-volume-template
              spec:
                accessModes:
                - ReadWriteOnce
                storageClassName: fast
                resources:
                  requests:
                    storage: 5Gi
            - name: log-volume-template
              spec:
                accessModes:
                - ReadWriteOnce
                storageClassName: fast
                resources:
                  requests:
                    storage: 1Gi
  - displayName: Valkey
    env: []
    icon: /img/addons/redis.svg
    id: kubero-operator
    kind: Valkey
    resourceDefinitions:
      Valkey:
        apiVersion: rds.valkey.buf.red/v1alpha1
        kind: Valkey
        metadata:
          name: '{{KUBERO_APP_NAME}}-valkey'
        spec:
          version: '8.0'
          arch: replica
          replicas:
            shards: 1
            replicasOfShard: 1
          access:
            serviceType: ClusterIP
          storage:
            capacity: 1Gi
            storageClassName: fast
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
  envVars:
  - name: DATABASE_URL
    value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  - name: POSTHOG_DB_NAME
    value: '$(PGDATABASE)'
  - name: POSTHOG_DB_USER
    value: '$(PGUSER)'
  - name: POSTHOG_DB_PASSWORD
    value: '$(PGPASSWORD)'
  - name: POSTHOG_POSTGRES_HOST
    value: '$(PGHOST)'
  - name: POSTHOG_POSTGRES_PORT
    value: '$(PGPORT)'
  - name: CLICKHOUSE_HOST
    value: clickhouse-{{KUBERO_APP_NAME}}-clickhouse
  - name: CLICKHOUSE_DATABASE
    value: '$(PGDATABASE)'
  - name: CLICKHOUSE_USER
    value: admin
  - name: CLICKHOUSE_PASSWORD
    value: posthog
  - name: CLICKHOUSE_SECURE
    value: 'false'
  - name: CLICKHOUSE_VERIFY
    value: 'false'
  # The Redpanda (Kafka API) companion app below. Sibling apps of a catalog
  # group are reached as <nameHint>-<suffix>-kuberoapp on port 80.
  - name: KAFKA_HOSTS
    value: posthog-kafka-{{KUBERO_NAME_SUFFIX}}-kuberoapp:80
  - name: KAFKA_URL
    value: kafka://posthog-kafka-{{KUBERO_NAME_SUFFIX}}-kuberoapp:80
  - name: SITE_URL
    value: '{{KUBERO_APP_URL}}'
  # Generated at deploy. The worker and Node.js companions inherit this env,
  # so every app of the group gets the same values. ENCRYPTION_SALT_KEYS must
  # be 32 characters and must not change after the first boot.
  - name: SECRET_KEY
    value: '{{KUBERO_GEN_ALNUM:64}}'
  - name: ENCRYPTION_SALT_KEYS
    value: '{{KUBERO_GEN_ALNUM:32}}'
  - name: DISABLE_SECURE_SSL_REDIRECT
    value: 'true'
  - name: IS_BEHIND_PROXY
    value: 'true'
  - name: TRUST_ALL_PROXIES
    value: 'true'
  - name: DEPLOYMENT
    value: hobby
  - name: POSTHOG_SKIP_MIGRATION_CHECKS
    value: '1'
  - name: SKIP_ASYNC_MIGRATIONS_SETUP
    value: '1'
  - name: PERSONHOG_ENABLED
    value: 'false'
  - name: OTEL_SDK_DISABLED
    value: 'true'
  - name: OBJECT_STORAGE_ENABLED
    value: 'false'
  # The posthog-plugins companion below (Node.js CDP API, port 6738 behind
  # the group Service on 80).
  - name: CDP_API_URL
    value: http://posthog-plugins-{{KUBERO_NAME_SUFFIX}}-kuberoapp:80
  extraVolumes: []
  cronjobs: []
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 4Gi
  healthcheck:
    enabled: true
    path: /
    startupSeconds: 3600
    timeoutSeconds: 10
    periodSeconds: 10
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  image:
    containerPort: '8000'
    pullPolicy: Always
    repository: ghcr.io/posthog/posthog
    # PostHog publishes no release tags, only one per master commit; this is
    # the commit `latest` pointed at on 2026-10-20.
    tag: 48912b83f12851f5ca9188750b6ade3b97f93616
    # The image's default command (./bin/docker) also starts the Celery
    # worker and scheduler, which now run in the posthog-worker companion.
    # Run the migrations, then only the web server (as PostHog's own hobby
    # deployment does). The image ships bash.
    command:
    - bash
    - -c
    - ./bin/migrate && exec ./bin/docker-server
    run:
      securityContext:
        readOnlyRootFilesystem: false
  # Redpanda (Kafka API) as its own app. It was a Deployment + Service baked
  # into the Valkey add-on's resourceDefinitions, which the server refuses
  # (#136). Private web service: the group Service fronts the Kafka port on
  # 80, so Redpanda advertises that address to clients. Ephemeral, as before
  # (dev-container mode). No HTTP endpoint on the Kafka port, so the HTTP
  # health check stays off.
  templateServices:
  - id: kafka
    nameHint: posthog-kafka
    serviceType: web
    exposeInternet: false
    image:
      repository: docker.io/redpandadata/redpanda
      tag: v25.1.9
      containerPort: '9092'
      command:
      - rpk
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://posthog-kafka-{{KUBERO_NAME_SUFFIX}}-kuberoapp:80
      - --mode
      - dev-container
      - --smp
      - '1'
      - --memory
      - 256M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --set
      - redpanda.auto_create_topics_enabled=true
    healthcheck:
      enabled: false
  # Celery worker + scheduler (one scheduler per install: do not scale this
  # app above one replica). Same image and pin as the web app; it inherits
  # the web app's env, add-ons and generated secrets.
  - id: worker
    nameHint: posthog-worker
    serviceType: worker
    size: medium
    exposeInternet: false
    image:
      repository: ghcr.io/posthog/posthog
      tag: 48912b83f12851f5ca9188750b6ade3b97f93616
      containerPort: '8000'
      command:
      - ./bin/docker-worker-celery
      - --with-scheduler
    inheritEnvFrom: primary
    healthcheck:
      enabled: false
  # Event ingestion (the Node.js plugin server in ingestion mode): consumes
  # Kafka and writes events and persons to ClickHouse and Postgres. The
  # Node.js services ship in their own image, published only for commits
  # that change them; this is the newest one at or before the web pin.
  - id: ingestion
    nameHint: posthog-ingestion
    serviceType: worker
    size: medium
    exposeInternet: false
    image:
      repository: ghcr.io/posthog/posthog-node
      tag: 5e2fecf7e9e8e1c8ce0767809d109fd2b9314bba
      containerPort: '6738'
    inheritEnvFrom: primary
    envVars:
    - name: PLUGIN_SERVER_MODE
      value: ingestion-v2-combined
    - name: PERSONS_DATABASE_URL
      value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
    - name: BEHAVIORAL_COHORTS_DATABASE_URL
      value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
    - name: COOKIELESS_REDIS_HOST
      value: '$(REDISHOST)'
    - name: COOKIELESS_REDIS_PORT
      value: '$(REDISPORT)'
    - name: CDP_REDIS_HOST
      value: '$(REDISHOST)'
    - name: CDP_REDIS_PORT
      value: '$(REDISPORT)'
    healthcheck:
      enabled: false
  # The Node.js plugin server in its default mode (CDP destinations,
  # webhooks, workflows, realtime cohorts, error tracking). Private web
  # service: the web app calls its API through CDP_API_URL.
  - id: plugins
    nameHint: posthog-plugins
    serviceType: web
    size: medium
    exposeInternet: false
    image:
      repository: ghcr.io/posthog/posthog-node
      tag: 5e2fecf7e9e8e1c8ce0767809d109fd2b9314bba
      containerPort: '6738'
    inheritEnvFrom: primary
    envVars:
    - name: PERSONS_DATABASE_URL
      value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
    - name: BEHAVIORAL_COHORTS_DATABASE_URL
      value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
    - name: CDP_REDIS_HOST
      value: '$(REDISHOST)'
    - name: CDP_REDIS_PORT
      value: '$(REDISPORT)'
    healthcheck:
      enabled: true
      path: /_health
      timeoutSeconds: 5
      periodSeconds: 10
