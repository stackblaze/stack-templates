apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "Keep passwords, secure notes, and logins organized across all your devices. A lightweight alternative to 1Password and LastPass."
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/vaultwarden/icon.png
    kubero.dev/template.installation: ''
    kubero.dev/template.links: '[]'
    kubero.dev/template.screenshots: '["https://media.stackblaze.cloud/templates/vaultwarden/demo.mp4", "https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@c696003baf067cde4a262775c42fde3a75e3d872/services/vaultwarden/dashboard.png", "https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@c696003baf067cde4a262775c42fde3a75e3d872/services/vaultwarden/screenshot-login.png", "https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@c696003baf067cde4a262775c42fde3a75e3d872/services/vaultwarden/screenshot-generator.png"]'
    kubero.dev/template.source: https://github.com/dani-garcia/vaultwarden
    kubero.dev/template.categories: '["security", "utilities"]'
    kubero.dev/template.title: "Vaultwarden Passwords"
    kubero.dev/template.website: https://github.com/dani-garcia/vaultwarden
  name: vaultwarden
spec:
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: vaultwarden
              owner: vaultwarden
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO vaultwarden
              - GRANT CREATE ON SCHEMA public TO vaultwarden
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO vaultwarden
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: vaultwarden
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: vaultwarden
          password: vaultwarden
  # Platform email (see README "Email contract"). Vaultwarden reads SMTP_*
  # natively, so no env mapping — vars are injected only while Email is live.
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env: []
    resourceDefinitions: {}
  # Platform object storage (RustFS Tenant → communal-s3 logical bucket
  # on shared). Vaultwarden OpenDAL S3 via DATA_FOLDER; AWS_* creds
  # are injected. TMP must stay on the local volume.

  - displayName: RustFS
    env: []
    icon: /img/addons/rustfs.svg
    id: kubero-operator
    kind: Tenant
    resourceDefinitions:
      Tenant:
        apiVersion: rustfs.com/v1alpha1
        kind: Tenant
        metadata:
          name: '{{KUBERO_APP_NAME}}-rustfs'
          annotations:
            # The operator refuses custom-repo images it cannot verify for
            # RuntimeDefault seccomp ("WorkloadSecurityIncompatible") unless the
            # exact reference is acknowledged. Keep in sync with spec.image.
            operator.rustfs.com/runtime-default-image-ack: registry.stackblaze.cloud/rustfs/rustfs:1.0.0-beta.10
        spec:
          image: registry.stackblaze.cloud/rustfs/rustfs:1.0.0-beta.10
          credsSecret:
            name: '{{KUBERO_APP_NAME}}-rustfs-credentials'
          pools:
          - name: pool-0
            servers: 1
            persistence:
              volumesPerServer: 4
              volumeClaimTemplate:
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 2Gi
                storageClassName: slow
      credsSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-rustfs-credentials'
        type: Opaque
        stringData:
          accesskey: vaultwarden
          secretkey: '{{KUBERO_GEN_HEX:32}}'
  cronjobs: []
  deploymentstrategy: docker
  envVars:
  - name: DATABASE_URL
    value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  - name: DATA_FOLDER
    value: 's3://$(S3_BUCKET)?endpoint=$(S3_HOST):$(S3_PORT)&region=$(AWS_REGION)&enable_virtual_host_style=false'
  - name: TMP_FOLDER
    value: /data/tmp
  - name: TEMPLATES_FOLDER
    value: /data/templates
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /data
    name: '{{KUBERO_APP_NAME}}-data'
    size: 1Gi
    storageClass: shared
  image:
    containerPort: '80'
    pullPolicy: IfNotPresent
    # Referenced as docker.io on purpose: zone nodes mirror docker.io through
    # the regional registry (containerd hosts.d -> registry.<region>/v2/docker).
    # Not registry.stackblaze.cloud (sfo zot, 503). Pinned patch tag, not :latest.
    repository: docker.io/vaultwarden/server
    tag: '1.37.3'
    run:
      securityContext:
        readOnlyRootFilesystem: false
  name: vaultwarden
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
