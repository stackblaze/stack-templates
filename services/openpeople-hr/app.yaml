apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: openpeople-hr
  annotations:
    kubero.dev/template.architecture: '["linux/amd64"]'
    kubero.dev/template.description: "Keep everything about your people in one place: profiles, time off, timesheets, hiring, onboarding, benefits, performance, and reports.\nOpen-source HR for small and mid-sized teams in the United States and Canada. A self-hosted alternative to BambooHR, without payroll: it exports what your payroll or accounting software needs."
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/openpeople-hr/icon.png
    kubero.dev/template.installation: "Pulls the prebuilt ghcr.io/stackblaze-adam/openpeople-hr image. There is nothing to fill in before you deploy. On the first start the app creates its tables; then open the app's address and a short setup asks for your company (name, country, time zone, language), your name, work email and password, optional two-step login (an authenticator app or a passkey), and whether to start empty or with the Northwind Studio demo company. That first account becomes the workspace owner, and the setup page is gone for good. Open it soon after deploying: until then whoever opens the address first can claim it (set OPENPEOPLE_SETUP_CODE to have the setup ask for a code first). Postgres 16 is created with the app, and uploaded documents persist on the 5 GiB data volume. OPENPEOPLE_SECRET_ENCRYPTION_KEY is generated once and encrypts bank and identity numbers: copy it somewhere safe and never change it once people have been added. Email goes out through the platform's Email add-on when it is on; until then email waits in Settings, Email. Scheduled jobs (accruals, reminders) run inside the app. Load demo data preselects the demo company in the setup's last step; its logins share the owner's password, so leave it off for real use."
    kubero.dev/template.links: '["https://github.com/stackblaze-adam/openpeople-hr/blob/main/docs/help/owner/install.md", "https://github.com/stackblaze-adam/openpeople-hr/blob/main/docs/self-host.md"]'
    kubero.dev/template.screenshots: '["https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/openpeople-hr/dashboard.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/openpeople-hr/screenshot-people.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/openpeople-hr/screenshot-profile.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/openpeople-hr/screenshot-time-off.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/openpeople-hr/screenshot-hiring.png", "https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/openpeople-hr/screenshot-reports.png"]'
    kubero.dev/template.source: https://github.com/stackblaze-adam/openpeople-hr
    kubero.dev/template.categories: '["work", "productivity", "management"]'
    kubero.dev/template.title: Openpeople HR
    kubero.dev/template.website: https://github.com/stackblaze-adam/openpeople-hr
  labels:
    manager: kubero
spec:
  name: openpeople-hr
  deploymentstrategy: docker
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: openpeople
              owner: openpeople
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO openpeople
              - GRANT CREATE ON SCHEMA public TO openpeople
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO openpeople
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: '{{KUBERO_GEN_ALNUM:32}}'
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: openpeople
          password: '{{KUBERO_GEN_ALNUM:32}}'
  # Platform email (see README "Email contract"). The image reads the injected
  # SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD and SMTP_FROM itself and
  # turns them into OPENPEOPLE_SMTP_URL and OPENPEOPLE_MAIL_FROM (STARTTLS on
  # 587), so no mapping is needed. While Email is off, mail is held in the
  # app's outbox (Settings → Email) and sent once mail is set up.
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env: []
    resourceDefinitions: {}
  envVars:
  - name: DATABASE_URL
    value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)?sslmode=disable'
  # The public address. Links in email, invites, password resets, passkeys and
  # single sign-on are built from it.
  - name: OPENPEOPLE_APP_URL
    value: '{{KUBERO_APP_URL}}'
  # No owner is set here: on the first visit the app's setup (/setup) creates
  # the first account. For a scripted install, add OWNER_EMAIL and
  # OWNER_PASSWORD (at least 10 characters) and the container creates the
  # owner on its first start instead. Add OPENPEOPLE_SETUP_CODE to have the
  # setup ask for a code before anyone can create the first account.
  # Encrypts bank account and identity numbers. Generated once; keep a copy
  # outside the platform and never change it after people have been added.
  - name: OPENPEOPLE_SECRET_ENCRYPTION_KEY
    value: '{{KUBERO_GEN_ALNUM:64}}'
  # One ingress sits in front of the app.
  - name: OPENPEOPLE_TRUSTED_PROXIES
    value: '1'
  - name: OPENPEOPLE_DATA_DIR
    value: /data
  # 1 lets anyone create a separate workspace of their own. Leave at 0.
  - name: OPENPEOPLE_ALLOW_SIGNUP
    value: '0'
  # The dashboard's "Load demo data" switch: true preselects the Northwind
  # Studio demo company in the setup's last step (with OWNER_* set, it adds it
  # on the first start). Its logins share the owner's password.
  - name: STACKBLAZE_LOAD_DEMO_DATA
    value: 'false'
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /data
    name: '{{KUBERO_APP_NAME}}-data'
    size: 5Gi
    storageClass: shared
  # Scheduled jobs run inside the app (a database lock keeps two replicas from
  # running the same job), so no CronJob is needed.
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
  healthcheck:
    enabled: true
    path: /sign-in
    startupSeconds: 300
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '3200'
    pullPolicy: Always
    # Published by stackblaze-adam/openpeople-hr (.github/workflows/image.yml)
    # on every push to main. Pin a sha-<short> tag once one is published.
    repository: ghcr.io/stackblaze-adam/openpeople-hr
    tag: latest
    run:
      securityContext:
        readOnlyRootFilesystem: false
