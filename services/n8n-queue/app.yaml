apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: n8n in queue mode — Postgres for the workspace,
      Valkey for the job queue, and a worker that runs executions off the editor.
    kubero.dev/template.icon: https://avatars.githubusercontent.com/u/45487711?s=200&v=4
    kubero.dev/template.installation: Queue mode. The editor is the public URL; a
      companion worker runs executions. With Load demo data enabled, first boot creates
      owner demo@stackblaze.local / changeme and three sample workflows. Without it,
      complete the one-time owner setup at your app URL. N8N_ENCRYPTION_KEY is generated
      at deploy and shared with the worker — do not change it on only one of the apps.
    kubero.dev/template.links: '[]'
    kubero.dev/template.screenshots: '["https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/n8n/screenshot-workflow.png"]'
    kubero.dev/template.source: https://github.com/n8n-io/n8n
    kubero.dev/template.categories: '["work", "productivity", "utilities"]'
    kubero.dev/template.title: n8n Queue
    kubero.dev/template.website: https://n8n.io
  name: n8n-queue
spec:
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgres'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: n8n
              owner: n8n
              secret:
                name: '{{KUBERO_APP_NAME}}-postgres-app'
              postInitApplicationSQL:
              - CREATE EXTENSION IF NOT EXISTS "uuid-ossp"
              - GRANT ALL ON SCHEMA public TO n8n
              - GRANT CREATE ON SCHEMA public TO n8n
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO n8n
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgres-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgres-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: '123456'
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgres-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: n8n
          password: '123456'
  - displayName: Valkey
    env: []
    icon: /img/addons/redis.svg
    id: kubero-operator
    kind: Valkey
    resourceDefinitions:
      Valkey:
        apiVersion: rds.valkey.buf.red/v1alpha1
        kind: Valkey
        metadata:
          name: '{{KUBERO_APP_NAME}}-valkey'
        spec:
          version: '8.0'
          arch: replica
          replicas:
            shards: 1
            replicasOfShard: 1
          access:
            serviceType: ClusterIP
          storage:
            capacity: 1Gi
            storageClassName: fast
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
  cronjobs: []
  deploymentstrategy: docker
  envVars:
  - name: DB_TYPE
    value: postgresdb
  - name: DB_POSTGRESDB_HOST
    value: '$(PGHOST)'
  - name: DB_POSTGRESDB_PORT
    value: '$(PGPORT)'
  - name: DB_POSTGRESDB_USER
    value: '$(PGUSER)'
  - name: DB_POSTGRESDB_PASSWORD
    value: '$(PGPASSWORD)'
  - name: DB_POSTGRESDB_DATABASE
    value: '$(PGDATABASE)'
  - name: EXECUTIONS_MODE
    value: queue
  - name: QUEUE_BULL_REDIS_HOST
    value: '$(REDISHOST)'
  - name: QUEUE_BULL_REDIS_PORT
    value: '$(REDISPORT)'
  - name: QUEUE_HEALTH_CHECK_ACTIVE
    value: 'true'
  - name: OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS
    value: 'true'
  - name: N8N_ENCRYPTION_KEY
    value: '{{KUBERO_GEN_ALNUM:32}}'
  - name: N8N_BASIC_AUTH_ACTIVE
    value: 'false'
  - name: WEBHOOK_URL
    value: '{{KUBERO_APP_URL}}'
  - name: N8N_EDITOR_BASE_URL
    value: '{{KUBERO_APP_URL}}'
  - name: N8N_HOST
    value: '{{KUBERO_APP_HOST}}'
  - name: N8N_PORT
    value: '5678'
  - name: N8N_PROTOCOL
    value: https
  - name: N8N_PROXY_HOPS
    value: '1'
  - name: STACKBLAZE_LOAD_DEMO_DATA
    value: 'false'
  - name: STACKBLAZE_DEMO_EMAIL
    value: demo@stackblaze.local
  - name: STACKBLAZE_DEMO_PASSWORD
    value: changeme
  extraVolumes: []
  image:
    containerPort: '5678'
    repository: docker.n8n.io/n8nio/n8n
    tag: latest
    command:
    - /bin/sh
    - -c
    - "node -e \"fetch(process.argv[1]).then(async r=>{if(!r.ok)process.exit(1);require('fs').writeFileSync(process.argv[2],await r.text())})\"\
      \ \"https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/n8n/kubero-entrypoint.sh\"\
      \ /tmp/kubero-entrypoint.sh\nchmod +x /tmp/kubero-entrypoint.sh\nexec /tmp/kubero-entrypoint.sh\n"
    run:
      securityContext:
        readOnlyRootFilesystem: false
  name: n8n-queue
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  # Catalog-only. Dashboard expands this into a second docker card that shares
  # env (including the generated encryption key) and runs `n8n worker`.
  templateServices:
  - id: worker
    nameHint: n8n-worker
    exposeInternet: false
    image:
      repository: docker.n8n.io/n8nio/n8n
      tag: latest
      containerPort: '5678'
      command:
      - n8n
      - worker
    inheritEnvFrom: primary
    healthcheck:
      enabled: true
      path: /healthz
      timeoutSeconds: 5
      periodSeconds: 10
