apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: dittofeed
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: Open-source customer engagement and marketing
      automation platform for building messaging campaigns and user journeys across
      email, SMS, and push.
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/dittofeed/icon.png
    kubero.dev/template.installation: 'Dittofeed is a multi-service stack. This template
      runs the all-in-one dittofeed/dittofeed-lite image (API + dashboard + worker
      in one process) on port 3000 in single-tenant mode. It uses two operator add-ons
      (Postgres + ClickHouse, both provisioned here) and a Temporal companion app
      (temporalio/auto-setup:1.22.4, wired through TEMPORAL_ADDRESS) that keeps its
      temporal and temporal_visibility databases on the same Postgres add-on. Temporal
      creates those databases at first start, which needs CREATEDB: granted on a dedicated
      cluster, possibly not on shared zones. For production scale you may instead run the
      split images dittofeed/api, dittofeed/dashboard, and dittofeed/worker (worker
      handles the Temporal-driven journey processing) rather than the lite bundle;
      blob storage (any S3/MinIO) is optional. BOOTSTRAP=true auto-creates the default
      workspace and tables on first start. ROTATE before exposing: SECRET_KEY (openssl
      rand -base64 32) and the admin PASSWORD env (the Postgres and ClickHouse add-on
      passwords are generated at deploy). Set DASHBOARD_API_BASE / dashboard URLs to your public host. CLICKHOUSE_HOST
      must be the full http://host:8123 URL.'
    kubero.dev/template.links: '["https://docs.dittofeed.com/deployment/self-hosted",
      "https://docs.dittofeed.com/deployment/self-hosted/docker-compose"]'
    kubero.dev/template.screenshots: '["https://cdn.prod.website-files.com/664393f5bd2b0c6d4fdf5437/6848bc711eb36a4a566f65ad_3a1fb1ad611c0dcb0e506b3169e0e47f_og-dittofeed-homepage.png"]'
    kubero.dev/template.source: https://github.com/dittofeed/dittofeed
    kubero.dev/template.categories: '["communication", "automation", "crm"]'
    kubero.dev/template.title: Dittofeed
    kubero.dev/template.website: https://www.dittofeed.com/
  labels:
    manager: kubero
spec:
  name: dittofeed
  deploymentstrategy: docker
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: dittofeed
              owner: dittofeed
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO dittofeed
              - GRANT CREATE ON SCHEMA public TO dittofeed
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO dittofeed
              # The Temporal companion creates its own temporal and
              # temporal_visibility databases as this user.
              postInitSQL:
              - ALTER ROLE dittofeed CREATEDB
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: '{{KUBERO_GEN_ALNUM:32}}'
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: dittofeed
          password: '{{KUBERO_GEN_ALNUM:32}}'
  - displayName: ClickHouse
    env: []
    icon: /img/addons/clickhouse.svg
    id: clickhouse-operator
    kind: ClickHouseInstallation
    resourceDefinitions:
      ClickHouseInstallation:
        apiVersion: clickhouse.altinity.com/v1
        kind: ClickHouseInstallation
        metadata:
          name: '{{KUBERO_APP_NAME}}-clickhouse'
        spec:
          configuration:
            users:
              admin/password: '{{KUBERO_GEN_SHARED:CLICKHOUSE_PASSWORD:ALNUM:32}}'
              admin/networks/ip:
              - 0.0.0.0/0
            clusters:
            - name: analytics
              layout:
                shardsCount: 1
                replicasCount: 1
          defaults:
            templates:
              dataVolumeClaimTemplate: data-volume-template
              logVolumeClaimTemplate: log-volume-template
          templates:
            volumeClaimTemplates:
            - name: data-volume-template
              spec:
                accessModes:
                - ReadWriteOnce
                storageClassName: fast
                resources:
                  requests:
                    storage: 5Gi
            - name: log-volume-template
              spec:
                accessModes:
                - ReadWriteOnce
                storageClassName: fast
                resources:
                  requests:
                    storage: 1Gi
  envVars:
  - name: NODE_ENV
    value: production
  - name: NODE_OPTIONS
    value: --max-old-space-size=824
  - name: AUTH_MODE
    value: single-tenant
  - name: BOOTSTRAP
    value: 'true'
  - name: WORKSPACE_NAME
    value: Default
  - name: SECRET_KEY
    value: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  - name: PASSWORD
    value: dittofeed
  - name: DATABASE_HOST
    value: '$(PGHOST)'
  - name: DATABASE_PORT
    value: '$(PGPORT)'
  - name: DATABASE_USER
    value: '$(PGUSER)'
  - name: DATABASE_PASSWORD
    value: '$(PGPASSWORD)'
  - name: DATABASE_NAME
    value: '$(PGDATABASE)'
  - name: CLICKHOUSE_HOST
    value: http://clickhouse-{{KUBERO_APP_NAME}}-clickhouse:8123
  - name: CLICKHOUSE_USER
    value: admin
  # One generated value shared with the ClickHouse add-on's admin/password
  # (KUBERO_GEN_SHARED, kubero-server#1668).
  - name: CLICKHOUSE_PASSWORD
    value: '{{KUBERO_GEN_SHARED:CLICKHOUSE_PASSWORD:ALNUM:32}}'
  - name: CLICKHOUSE_DATABASE
    value: '$(PGDATABASE)'
  # The Temporal companion app below (gRPC). Sibling apps of a catalog group
  # are reached as <nameHint>-<suffix>-kuberoapp on port 80.
  - name: TEMPORAL_ADDRESS
    value: dittofeed-temporal-{{KUBERO_NAME_SUFFIX}}-kuberoapp:80
  - name: DASHBOARD_API_BASE
    value: '{{KUBERO_APP_URL}}'
  extraVolumes: []
  cronjobs: []
  healthcheck:
    enabled: true
    path: /
    startupSeconds: 600
    timeoutSeconds: 10
    periodSeconds: 15
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 1536Mi
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  image:
    containerPort: '3000'
    pullPolicy: Always
    repository: docker.io/dittofeed/dittofeed-lite
    tag: v0.23.0
    run:
      securityContext:
        readOnlyRootFilesystem: false
  # Temporal (journey/workflow engine) as its own app. It was a Deployment +
  # Service baked into the Postgres add-on's resourceDefinitions, which the
  # server refuses (#136). It shares the Postgres add-on (usePrimaryAddons
  # injects PGHOST/PGPORT/PGUSER/PGPASSWORD; the old one dialled the
  # superuser with a literal password) and auto-setup creates its databases.
  # Private web service so the group Service fronts gRPC 7233; Temporal
  # 1.22 has no HTTP endpoint, so the HTTP health check stays off.
  # BIND_ON_IP 0.0.0.0 makes the image's entrypoint broadcast the pod IP.
  templateServices:
  - id: temporal
    nameHint: dittofeed-temporal
    serviceType: web
    exposeInternet: false
    usePrimaryAddons: true
    image:
      repository: docker.io/temporalio/auto-setup
      tag: 1.22.4
      containerPort: '7233'
    envVars:
    - name: DB
      value: postgres12
    - name: DB_PORT
      value: '$(PGPORT)'
    - name: POSTGRES_SEEDS
      value: '$(PGHOST)'
    - name: POSTGRES_USER
      value: '$(PGUSER)'
    - name: POSTGRES_PWD
      value: '$(PGPASSWORD)'
    - name: DBNAME
      value: temporal
    - name: VISIBILITY_DBNAME
      value: temporal_visibility
    - name: ENABLE_ES
      value: 'false'
    - name: BIND_ON_IP
      value: 0.0.0.0
    healthcheck:
      enabled: false
