apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "Protect company credentials and share access securely across teams and roles. A business-focused alternative to 1Password and LastPass."
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/passbolt/icon.png
    kubero.dev/template.installation: ''
    kubero.dev/template.links: '[]'
    kubero.dev/template.screenshots: '["https://raw.githubusercontent.com/passbolt/passbolt_styleguide/master/src/img/screenshots/teaser-screenshot-login.png","https://raw.githubusercontent.com/passbolt/passbolt_styleguide/master/src/img/screenshots/teaser-screenshot-share.png","https://raw.githubusercontent.com/passbolt/passbolt_styleguide/master/src/img/screenshots/teaser-screenshot4.png"]'
    kubero.dev/template.source: https://github.com/passbolt/passbolt_api
    kubero.dev/template.categories: '["security", "utilities"]'
    kubero.dev/template.title: "Passbolt for Teams"
    kubero.dev/template.website: https://www.passbolt.com
  name: passbolt
spec:
  addons:
  - displayName: MariaDB
    env: []
    icon: /img/addons/mysql.svg
    id: kubero-operator
    kind: MariaDB
    resourceDefinitions:
      MariaDB:
        apiVersion: k8s.mariadb.com/v1alpha1
        kind: MariaDB
        metadata:
          name: '{{KUBERO_APP_NAME}}-mysql'
        spec:
          metrics:
            enabled: true
          rootPasswordSecretKeyRef:
            name: '{{KUBERO_APP_NAME}}-mysql-root'
            key: password
          database: passbolt
          username: passbolt
          passwordSecretKeyRef:
            name: '{{KUBERO_APP_NAME}}-mysql-app'
            key: password
          storage:
            size: 5Gi
            storageClassName: smart
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
      rootSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-mysql-root'
        type: Opaque
        stringData:
          password: changeme
      appSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-mysql-app'
        type: Opaque
        stringData:
          password: changeme
  # Platform email (see README "Email contract"). Applied only while the
  # Email add-on is live (paid plans). Passbolt cannot onboard users without
  # mail (the registration/recovery links go out by email), so nothing is
  # left in envVars: an explicit EMAIL_TRANSPORT_DEFAULT_HOST there would win
  # over this mapping. Unlinked, Passbolt keeps its localhost:25 default.
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env:
    - name: EMAIL_TRANSPORT_DEFAULT_HOST
      value: '$(SMTP_HOST)'
    - name: EMAIL_TRANSPORT_DEFAULT_PORT
      value: '$(SMTP_PORT)'
    - name: EMAIL_TRANSPORT_DEFAULT_USERNAME
      value: '$(SMTP_USER)'
    - name: EMAIL_TRANSPORT_DEFAULT_PASSWORD
      value: '$(SMTP_PASSWORD)'
    - name: EMAIL_TRANSPORT_DEFAULT_TLS
      value: 'true'
    - name: EMAIL_DEFAULT_FROM
      value: '$(SMTP_FROM)'
    - name: EMAIL_DEFAULT_FROM_NAME
      value: Passbolt
    resourceDefinitions: {}
  cronjobs: []
  deploymentstrategy: docker
  envVars:
  - name: APP_FULL_BASE_URL
    value: '{{KUBERO_APP_URL}}'
  - name: DATASOURCES_DEFAULT_HOST
    value: '$(MYSQL_HOST)'
  - name: DATASOURCES_DEFAULT_USERNAME
    value: '$(MYSQL_USER)'
  - name: DATASOURCES_DEFAULT_PASSWORD
    value: '$(MYSQL_PASSWORD)'
  - name: DATASOURCES_DEFAULT_DATABASE
    value: '$(MYSQL_DATABASE)'
  healthcheck:
    enabled: true
    path: /healthcheck/status.json
    startupSeconds: 600
    timeoutSeconds: 5
    periodSeconds: 10
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /etc/passbolt/gpg
    name: '{{KUBERO_APP_NAME}}-gpg'
    size: 1Gi
    storageClass: shared
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /etc/passbolt/jwt
    name: '{{KUBERO_APP_NAME}}-jwt'
    size: 1Gi
    storageClass: shared
  image:
    containerPort: '80'
    command:
    - sh
    - -c
    - mkdir -p /etc/passbolt/gpg /etc/passbolt/jwt && chown -R 33:33 /etc/passbolt/gpg
      /etc/passbolt/jwt && /usr/bin/wait-for.sh "${DATASOURCES_DEFAULT_HOST:-$MYSQL_HOST}:${MYSQL_PORT:-3306}"
      -t 300 && exec /docker-entrypoint.sh
    pullPolicy: IfNotPresent
    repository: docker.io/passbolt/passbolt
    run:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        readOnlyRootFilesystem: false
    tag: 5.16.0-1-ce
  name: passbolt
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
