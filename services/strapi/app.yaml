apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: strapi
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: Open-source headless CMS. Edit content in a clean
      admin panel and serve it to any frontend over REST and GraphQL, with a media
      library and role-based access.
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/strapi/icon.png
    kubero.dev/template.installation: 'Open /admin and register the first administrator
      (there is no default admin). The first start creates the database schema and
      can take a minute. The image is Strapi 5.62.0 built from create-strapi-app with
      Strapi''s example blog model (Article, Author, Category, About, Global). The Content-Type
      Builder is read-only in production: to add your own content types, build them
      locally with npm run develop from services/strapi/image in stackblaze/stack-templates,
      build the image and point this app at it. To expose content over REST, grant
      the Public role find/findOne in Settings > Users & Permissions, or create an
      API token; GraphQL is served at /graphql. Media uploads go to the uploads volume. Email (admin password reset,
      user confirmations) goes through the Email add-on. Keep APP_KEYS, the JWT secrets
      and ENCRYPTION_KEY unchanged after first use.'
    kubero.dev/template.links: '["https://docs.strapi.io/"]'
    kubero.dev/template.screenshots: '[]'
    kubero.dev/template.source: https://github.com/strapi/strapi
    kubero.dev/template.categories: '["cms", "development", "data"]'
    kubero.dev/template.title: Strapi
    kubero.dev/template.website: https://strapi.io
  labels:
    manager: kubero
spec:
  name: strapi
  deploymentstrategy: docker
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: strapi
              owner: strapi
              secret:
                name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO strapi
              - GRANT CREATE ON SCHEMA public TO strapi
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO strapi
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: strapi
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
  # The image reads SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD and
  # SMTP_FROM natively (config/plugins.ts switches to the nodemailer
  # provider when SMTP_HOST is set), so the Email add-on needs no mapping.
  - displayName: Email
    env: []
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    resourceDefinitions: {}
  envVars:
  - name: DATABASE_CLIENT
    value: postgres
  - name: DATABASE_HOST
    value: '$(PGHOST)'
  - name: DATABASE_PORT
    value: '$(PGPORT)'
  - name: DATABASE_NAME
    value: '$(PGDATABASE)'
  - name: DATABASE_USERNAME
    value: '$(PGUSER)'
  - name: DATABASE_PASSWORD
    value: '$(PGPASSWORD)'
  - name: DATABASE_SSL
    value: 'false'
  - name: PUBLIC_URL
    value: '{{STACKBLAZE_APP_URL}}'
  # Strapi's own generator (create-strapi-app) makes each secret 16 random
  # bytes in base64; any string works (JWT HMAC keys, Keygrip keys, salts,
  # and ENCRYPTION_KEY is SHA-256 hashed into the AES-256-GCM key).
  # APP_KEYS is a comma-separated list; each token expands independently.
  - name: APP_KEYS
    value: '{{STACKBLAZE_GEN_ALNUM:32}},{{STACKBLAZE_GEN_ALNUM:32}},{{STACKBLAZE_GEN_ALNUM:32}},{{STACKBLAZE_GEN_ALNUM:32}}'
  - name: API_TOKEN_SALT
    value: '{{STACKBLAZE_GEN_ALNUM:32}}'
  - name: ADMIN_JWT_SECRET
    value: '{{STACKBLAZE_GEN_ALNUM:32}}'
  - name: TRANSFER_TOKEN_SALT
    value: '{{STACKBLAZE_GEN_ALNUM:32}}'
  - name: JWT_SECRET
    value: '{{STACKBLAZE_GEN_ALNUM:32}}'
  - name: ENCRYPTION_KEY
    value: '{{STACKBLAZE_GEN_ALNUM:32}}'
  - name: STRAPI_TELEMETRY_DISABLED
    value: 'true'
  - name: STRAPI_DISABLE_UPDATE_NOTIFICATION
    value: 'true'
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /opt/app/public/uploads
    name: '{{STACKBLAZE_APP_NAME}}-uploads'
    size: 10Gi
    storageClass: shared
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 2Gi
  healthcheck:
    enabled: true
    path: /_health
    startupSeconds: 300
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '1337'
    pullPolicy: IfNotPresent
    # Built from services/strapi/image by .github/workflows/build-strapi.yaml.
    repository: ghcr.io/stackblaze/stack-templates/strapi
    tag: '5.62.0'
    run:
      securityContext:
        readOnlyRootFilesystem: false
        runAsUser: 1000
        runAsGroup: 1000
