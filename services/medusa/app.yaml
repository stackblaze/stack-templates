apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: medusa
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "Build custom shopping experiences with modular commerce APIs, product management, carts, and checkout.\nA developer-first alternative to Shopify Plus and commercetools."
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/medusa/icon.png
    kubero.dev/template.homepage: /app
    kubero.dev/template.installation: "Deploys the Medusa 2 server with its admin dashboard (the app URL opens /app), the Store API, Postgres and Valkey. The first start runs the migrations, seeds upstream's starter store (a Europe region, a warehouse, shipping options, four sample products and a publishable API key) and creates the admin user before the app is reachable. Sign in with admin@example.com (MEDUSA_ADMIN_EMAIL) and the generated password in MEDUSA_ADMIN_PASSWORD (Variables). To use your own address, invite it under Settings > Users (copy the invite link), accept it, then delete the first user. There is no storefront in this template: build one from upstream's starter (github.com/medusajs/dtc-starter, apps/storefront) with the publishable key from Settings > Publishable API Keys, and add its URL to STORE_CORS and AUTH_CORS. Product images upload to the data volume and are served from /static. Medusa sends no email on its own: password resets and invites need a notification module in your own build. RBAC roles and SSO are Medusa Enterprise features that need a licence key; the template runs without them."
    kubero.dev/template.links: '["https://docs.medusajs.com/learn/deployment/general", "https://docs.medusajs.com/", "https://github.com/medusajs/dtc-starter"]'
    kubero.dev/template.screenshots: '[]'
    kubero.dev/template.source: https://github.com/medusajs/medusa
    kubero.dev/template.categories: '["e-commerce", "development", "work"]'
    kubero.dev/template.title: "Medusa Commerce"
    kubero.dev/template.website: https://medusajs.com
  labels:
    manager: kubero
spec:
  name: medusa
  deploymentstrategy: docker
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: medusa
              owner: medusa
              secret:
                name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO medusa
              - GRANT CREATE ON SCHEMA public TO medusa
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO medusa
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: medusa
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
  # Valkey: REDIS_URL is injected. Upstream's production guide replaces the
  # in-memory development modules with Redis ones: admin sessions, the event
  # bus (subscribers such as the product search index), the workflow engine
  # (scheduled jobs, long-running workflows), the cache and locking.
  - displayName: Valkey
    env: []
    icon: /img/addons/redis.svg
    id: kubero-operator
    kind: Valkey
    resourceDefinitions:
      Valkey:
        apiVersion: rds.valkey.buf.red/v1alpha1
        kind: Valkey
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-valkey'
        spec:
          version: '8.0'
          arch: replica
          replicas:
            shards: 1
            replicasOfShard: 1
          access:
            serviceType: ClusterIP
          storage:
            capacity: 1Gi
            storageClassName: fast
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
  cronjobs: []
  envVars:
  - name: NODE_ENV
    value: production
  - name: PORT
    value: '9000'
  # No sslmode: Medusa then connects with TLS (rejectUnauthorized false) to a
  # non-local host (load-module-database-config.ts).
  - name: DATABASE_URL
    value: 'postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  # One process serves the API and the admin and runs subscribers and
  # scheduled jobs (upstream's "shared" worker mode).
  - name: MEDUSA_WORKER_MODE
    value: shared
  - name: DISABLE_MEDUSA_ADMIN
    value: 'false'
  - name: JWT_SECRET
    value: '{{STACKBLAZE_GEN_ALNUM:48}}'
  - name: COOKIE_SECRET
    value: '{{STACKBLAZE_GEN_ALNUM:48}}'
  # The app's own URL: public links of uploaded files (/static/…).
  - name: MEDUSA_BACKEND_URL
    value: '{{STACKBLAZE_APP_URL}}'
  # Add your storefront's URL to STORE_CORS and AUTH_CORS (comma-separated).
  - name: STORE_CORS
    value: '{{STACKBLAZE_APP_URL}}'
  - name: ADMIN_CORS
    value: '{{STACKBLAZE_APP_URL}}'
  - name: AUTH_CORS
    value: '{{STACKBLAZE_APP_URL}}'
  # The first admin user, created by a one-time migration script on a new
  # database (services/medusa/image). Changing these later changes nothing.
  - name: MEDUSA_ADMIN_EMAIL
    value: admin@example.com
  - name: MEDUSA_ADMIN_PASSWORD
    value: '{{STACKBLAZE_GEN_ALNUM:24}}'
  - name: MEDUSA_DISABLE_TELEMETRY
    value: 'true'
  # Product images and other uploads (Medusa's local file provider, served at
  # /static). Private files (product exports) land here too, as upstream's
  # local provider has no private store.
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /server/static
    name: '{{STACKBLAZE_APP_NAME}}-uploads'
    size: 5Gi
    storageClass: shared
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: '2'
      memory: 2Gi
  healthcheck:
    enabled: true
    path: /health
    startupSeconds: 600
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '9000'
    pullPolicy: IfNotPresent
    # Built from services/medusa/image by .github/workflows/build-medusa.yaml
    # (upstream publishes no runtime image). Anonymous pull.
    repository: ghcr.io/stackblaze/stack-templates/medusa
    tag: '2.22.7'
    run:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        readOnlyRootFilesystem: false
