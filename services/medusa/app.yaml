apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: medusa
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: Open-source headless commerce platform — products,
      carts, checkout, and an admin dashboard, with a REST/JS API for custom storefronts.
    kubero.dev/template.icon: https://avatars.githubusercontent.com/u/62591822?s=200&v=4
    kubero.dev/template.homepage: /app
    kubero.dev/template.installation: 'Deploys the Medusa 2 backend and admin (at /app)
      with PostgreSQL and Valkey add-ons. Open /app — the root URL has no storefront.
      First boot runs migrations and creates the admin user from MEDUSA_ADMIN_EMAIL /
      MEDUSA_ADMIN_PASSWORD (default admin@example.com / changeme — rotate immediately).
      JWT_SECRET and COOKIE_SECRET are generated per deploy. After login, create a
      publishable API key under Settings > API Key Management if you attach a Next.js
      storefront (official starter: github.com/medusajs/dtc-starter apps/storefront)
      and set STORE_CORS to that storefront URL. Product images persist on the uploads
      volume.'
    kubero.dev/template.links: '["https://docs.medusajs.com/learn/deployment/general",
      "https://docs.medusajs.com/"]'
    kubero.dev/template.screenshots: '["https://medusajs.com/images/og.jpg"]'
    kubero.dev/template.source: https://github.com/medusajs/medusa
    kubero.dev/template.categories: '["e-commerce", "development", "work"]'
    kubero.dev/template.title: Medusa
    kubero.dev/template.website: https://medusajs.com
  labels:
    manager: kubero
spec:
  name: medusa
  deploymentstrategy: docker
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: medusa
              owner: medusa
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO medusa
              - GRANT CREATE ON SCHEMA public TO medusa
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO medusa
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: medusa
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: medusa
          password: medusa
  - displayName: Valkey
    env: []
    icon: /img/addons/redis.svg
    id: kubero-operator
    kind: Valkey
    resourceDefinitions:
      Valkey:
        apiVersion: rds.valkey.buf.red/v1alpha1
        kind: Valkey
        metadata:
          name: '{{KUBERO_APP_NAME}}-valkey'
        spec:
          version: '8.0'
          arch: replica
          replicas:
            shards: 1
            replicasOfShard: 1
          access:
            serviceType: ClusterIP
          storage:
            capacity: 1Gi
            storageClassName: fast
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
  envVars:
  - name: NODE_ENV
    value: production
  - name: PORT
    value: '9000'
  - name: DATABASE_URL
    value: 'postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)?sslmode=disable'
  - name: MEDUSA_WORKER_MODE
    value: shared
  - name: DISABLE_MEDUSA_ADMIN
    value: 'false'
  - name: JWT_SECRET
    value: '{{KUBERO_GEN_ALNUM:32}}'
  - name: COOKIE_SECRET
    value: '{{KUBERO_GEN_ALNUM:32}}'
  - name: STORE_CORS
    value: '{{KUBERO_APP_URL}}'
  - name: ADMIN_CORS
    value: '{{KUBERO_APP_URL}}'
  - name: AUTH_CORS
    value: '{{KUBERO_APP_URL}}'
  - name: MEDUSA_BACKEND_URL
    value: '{{KUBERO_APP_URL}}'
  - name: MEDUSA_ADMIN_EMAIL
    value: admin@example.com
  - name: MEDUSA_ADMIN_PASSWORD
    value: changeme
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /server/static
    name: '{{KUBERO_APP_NAME}}-uploads'
    size: 5Gi
    storageClass: shared
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 3Gi
  healthcheck:
    enabled: true
    path: /health
    startupSeconds: 900
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '9000'
    pullPolicy: IfNotPresent
    # Referenced as ghcr.io on purpose: zone nodes mirror ghcr.io through
    # the regional registry (containerd hosts.d -> registry.<region>/v2/ghcr,
    # the zot in each services cluster, on-demand sync, ghcr.io fallback).
    # Anonymous read on the LAN, no pull secret. Pinned tag, not :latest.
    repository: ghcr.io/stackblaze/stack-templates/medusa
    tag: '2.21.0'
    run:
      securityContext:
        readOnlyRootFilesystem: false
  # Medusa 2 serves admin at /app. Without this, GET / is Express "Cannot GET /".
  ingress:
    annotations:
      nginx.ingress.kubernetes.io/app-root: /app
