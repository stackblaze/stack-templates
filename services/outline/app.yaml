apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: outline
  annotations:
    kubero.dev/template.architecture: '["linux/amd64", "linux/arm64", "linux/arm/v7"]'
    kubero.dev/template.description: The fastest knowledge base for growing teams.
      Beautiful, realtime collaborative, feature packed, and markdown compatible.
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/outline/icon.png
    kubero.dev/template.installation: ''
    kubero.dev/template.links: '[]'
    kubero.dev/template.screenshots: '["https://user-images.githubusercontent.com/380914/110356468-26374600-7fef-11eb-9f6a-f2cc2c8c6590.png"]'
    kubero.dev/template.source: https://github.com/outline/outline
    kubero.dev/template.categories: '["work", "utility"]'
    kubero.dev/template.title: Outline
    kubero.dev/template.website: https://www.getoutline.com/
  labels:
    manager: kubero
spec:
  name: outline
  deploymentstrategy: docker
  envVars:
  - name: NODE_ENV
    value: production
  - name: SECRET_KEY
    value: '{{KUBERO_GEN_HEX:64}}'
  - name: DATABASE_URL
    value: 'postgres://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  - name: PGSSLMODE
    value: disable
  - name: FILE_STORAGE
    value: local
  - name: FILE_STORAGE_LOCAL_ROOT_DIR
    value: /var/lib/outline/data
  - name: FILE_STORAGE_UPLOAD_MAX_SIZE
    value: '262144000'
  - name: LOG_LEVEL
    value: info
  - name: DEFAULT_LANGUAGE
    value: en_US
  - name: UTILS_SECRET
    value: '{{KUBERO_GEN_HEX:64}}'
  - name: URL
    value: '{{KUBERO_APP_URL}}'
  - name: CDN_URL
    value: '{{KUBERO_APP_URL}}'
  - name: FORCE_HTTPS
    value: 'false'
  - name: SLACK_CLIENT_ID
    value: ''
  - name: SLACK_CLIENT_SECRET
    value: ''
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    emptyDir: false
    mountPath: /var/lib/outline/data
    name: outline-volume
    size: 1Gi
    storageClass: shared
  cronjobs: []
  addons:
  - displayName: Valkey
    env: []
    icon: /img/addons/redis.svg
    id: kubero-operator
    kind: Valkey
    resourceDefinitions:
      Valkey:
        apiVersion: rds.valkey.buf.red/v1alpha1
        kind: Valkey
        metadata:
          name: '{{KUBERO_APP_NAME}}-valkey'
        spec:
          version: '8.0'
          arch: replica
          replicas:
            shards: 1
            replicasOfShard: 1
          access:
            serviceType: ClusterIP
          storage:
            capacity: 1Gi
            storageClassName: fast
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: outline
              owner: outline
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: outline
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: outline
          password: outline
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  image:
    containerPort: '3000'
    pullPolicy: Always
    repository: docker.getoutline.com/outlinewiki/outline
    tag: latest
    run:
      securityContext:
        readOnlyRootFilesystem: false
