apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "Build and manage websites, blogs, and content experiences with the world's most popular CMS. A flexible alternative to Wix and Squarespace."
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/wordpress/icon.png
    kubero.dev/template.installation: ''
    kubero.dev/template.links: '[]'
    kubero.dev/template.screenshots: '["https://wordpress.org/documentation/files/2021/07/test-widgets_v2-1-1024x643.jpeg","https://user-images.githubusercontent.com/12400734/168248949-f19a1a73-2c02-4eab-84d1-faaff57dbd07.png","https://wordpress.org/documentation/files/2021/06/menu-add-items-1024x557.png"]'
    kubero.dev/template.source: https://github.com/WordPress/WordPress
    kubero.dev/template.categories: '["cms"]'
    kubero.dev/template.title: "WordPress CMS"
    kubero.dev/template.website: https://wordpress.org
  name: wordpress
spec:
  addons:
  - displayName: MariaDB
    env: []
    icon: /img/addons/mysql.svg
    id: kubero-operator
    kind: MariaDB
    resourceDefinitions:
      MariaDB:
        apiVersion: k8s.mariadb.com/v1alpha1
        kind: MariaDB
        metadata:
          name: '{{KUBERO_APP_NAME}}-mariadb'
        spec:
          metrics:
            enabled: true
          rootPasswordSecretKeyRef:
            name: '{{KUBERO_APP_NAME}}-mariadb-root'
            key: password
          database: wordpress
          username: wordpress
          passwordSecretKeyRef:
            name: '{{KUBERO_APP_NAME}}-mariadb-app'
            key: password
          storage:
            size: 5Gi
            storageClassName: fast
          replicas: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
      rootSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-mariadb-root'
        type: Opaque
        stringData:
          password: wordpress
      appSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-mariadb-app'
        type: Opaque
        stringData:
          password: wordpress
  # Platform email (see README "Email contract"). WordPress has no SMTP
  # setting of its own: the must-use plugin written by image.command reads
  # the injected SMTP_* directly, so no mapping is needed here. Unlinked
  # (trial), SMTP_HOST is absent and the plugin does nothing.
  - displayName: Email
    env: []
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    resourceDefinitions: {}
  cronjobs: []
  deploymentstrategy: docker
  envVars:
  - name: WORDPRESS_DB_HOST
    value: '$(MYSQL_HOST)'
  - name: WORDPRESS_DB_USER
    value: '$(MYSQL_USER)'
  - name: WORDPRESS_DB_PASSWORD
    value: '$(MYSQL_PASSWORD)'
  - name: WORDPRESS_DB_NAME
    value: '$(MYSQL_DATABASE)'
  - name: WORDPRESS_CONFIG_EXTRA
    value: define('WP_HOME', 'https://' . $_SERVER['HTTP_HOST']); define('WP_SITEURL',
      'https://' . $_SERVER['HTTP_HOST']);
  - name: WORDPRESS_AUTH_KEY
    value: '{{KUBERO_GEN_ALNUM:64}}'
  - name: WORDPRESS_SECURE_AUTH_KEY
    value: '{{KUBERO_GEN_ALNUM:64}}'
  - name: WORDPRESS_LOGGED_IN_KEY
    value: '{{KUBERO_GEN_ALNUM:64}}'
  - name: WORDPRESS_NONCE_KEY
    value: '{{KUBERO_GEN_ALNUM:64}}'
  - name: WORDPRESS_AUTH_SALT
    value: '{{KUBERO_GEN_ALNUM:64}}'
  - name: WORDPRESS_SECURE_AUTH_SALT
    value: '{{KUBERO_GEN_ALNUM:64}}'
  - name: WORDPRESS_LOGGED_IN_SALT
    value: '{{KUBERO_GEN_ALNUM:64}}'
  - name: WORDPRESS_NONCE_SALT
    value: '{{KUBERO_GEN_ALNUM:64}}'
  extraVolumes:
  - accessModes:
    - ReadWriteMany
    storageClass: shared
    emptyDir: false
    mountPath: /var/www/html/wp-content
    name: '{{KUBERO_APP_NAME}}-data'
    size: 1Gi
  image:
    containerPort: '80'
    pullPolicy: IfNotPresent
    # docker.io/library so zone nodes mirror through the regional zot
    # (registry.<region>/v2/docker). Not registry.stackblaze.cloud (sfo, 503).
    # Pinned patch tag, not :latest.
    repository: docker.io/library/wordpress
    tag: 7.1.0-php8.3-apache
    # Drop a must-use plugin that routes wp_mail() through the platform
    # Email add-on, then hand over to the image entrypoint. Rewritten on
    # every start (wp-content is the persistent volume), inert without
    # SMTP_HOST. The From address is forced to SMTP_FROM: SES rejects any
    # other sender for the pipeline's login.
    command:
    - sh
    - -c
    - |
      mkdir -p /var/www/html/wp-content/mu-plugins
      cat > /var/www/html/wp-content/mu-plugins/stackblaze-email.php <<'PHP'
      <?php
      /**
       * Plugin Name: Stackblaze Email
       * Description: Sends wp_mail() through the platform Email add-on (SMTP_* environment). Managed by the template — rewritten on every restart.
       */
      if (!getenv('SMTP_HOST')) {
          return;
      }
      add_action('phpmailer_init', function ($phpmailer) {
          $phpmailer->isSMTP();
          $phpmailer->Host       = getenv('SMTP_HOST');
          $phpmailer->Port       = (int) (getenv('SMTP_PORT') ?: 587);
          $phpmailer->SMTPAuth   = true;
          $phpmailer->Username   = getenv('SMTP_USER');
          $phpmailer->Password   = getenv('SMTP_PASSWORD');
          $phpmailer->SMTPSecure = 'tls'; // STARTTLS on 587
      });
      add_filter('wp_mail_from', function () {
          return getenv('SMTP_FROM');
      });
      PHP
      exec docker-entrypoint.sh apache2-foreground
    run:
      securityContext:
        readOnlyRootFilesystem: false
  name: wordpress
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
