apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: cryptomator
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: Self-hosted key management and access control
      server for sharing Cryptomator-encrypted vaults across teams.
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/cryptomator/icon.png
    kubero.dev/template.installation: Deploys Cryptomator Hub with PostgreSQL (CloudNativePG)
      and a Cryptomator Keycloak companion app (ghcr.io/cryptomator/keycloak) seeded
      with a cryptomator realm for a smoke-test boot. Keycloak gets its own public
      URL; after the first deploy set HUB_KEYCLOAK_PUBLIC_URL on the Hub app to that
      URL (browsers sign in there) and redeploy. Keycloak stores its data in a separate
      `keycloak` database that the PostgreSQL add-on creates on a dedicated cluster;
      on shared zones that database is not provisioned. The seed realm's `admin` user
      password (CRYPTOMATOR_REALM_ADMIN_PASSWORD on the Keycloak app, changed at first
      sign-in) and the system client secret (HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET, the same
      on both apps) are generated at deploy. Use the cryptomator.org/hub/self-hosted Setup Wizard
      output to customize realm/clients for production.
    kubero.dev/template.links: '["https://docs.cryptomator.org/hub/", "https://docs.cryptomator.org/hub/deployment/"]'
    kubero.dev/template.screenshots: '[]'
    kubero.dev/template.source: https://github.com/cryptomator/hub
    kubero.dev/template.categories: '["security", "identity", "storage"]'
    kubero.dev/template.title: Cryptomator Hub
    kubero.dev/template.website: https://cryptomator.org/hub/
  labels:
    manager: kubero
spec:
  name: cryptomator
  deploymentstrategy: docker
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: cryptomator
              owner: cryptomator
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO cryptomator
              - GRANT CREATE ON SCHEMA public TO cryptomator
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO cryptomator
              - CREATE DATABASE keycloak OWNER cryptomator
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: cryptomator
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: cryptomator
          password: cryptomator
  envVars:
  - name: QUARKUS_HTTP_PORT
    value: '8080'
  - name: QUARKUS_DATASOURCE_JDBC_URL
    value: 'jdbc:postgresql://$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  - name: QUARKUS_DATASOURCE_USERNAME
    value: '$(PGUSER)'
  - name: QUARKUS_DATASOURCE_PASSWORD
    value: '$(PGPASSWORD)'
  - name: HUB_PUBLIC_ROOT_PATH
    value: /
  - name: HUB_PUBLIC_URL
    value: '{{KUBERO_APP_URL}}'
  # Browser-facing Keycloak URL: set it to the public URL of the
  # cryptomator-keycloak app once that app has one (see installation notes).
  - name: HUB_KEYCLOAK_PUBLIC_URL
    value: '{{KUBERO_APP_URL}}/kc'
  # The Keycloak companion app below; sibling apps of a catalog group are
  # reached as <nameHint>-<suffix>-kuberoapp on port 80.
  - name: HUB_KEYCLOAK_LOCAL_URL
    value: http://cryptomator-keycloak-{{KUBERO_NAME_SUFFIX}}-kuberoapp
  - name: HUB_KEYCLOAK_REALM
    value: cryptomator
  - name: HUB_KEYCLOAK_SYSTEM_CLIENT_ID
    value: cryptomatorhub-system
  # Generated at deploy and shared with the Keycloak companion (one value per
  # variable name across the group), whose seed realm uses it as the
  # cryptomatorhub-system client secret.
  - name: HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET
    value: '{{KUBERO_GEN_ALNUM:32}}'
  - name: HUB_KEYCLOAK_SYNCER_PERIOD
    value: 5m
  - name: HUB_KEYCLOAK_OIDC_CRYPTOMATOR_CLIENT_ID
    value: cryptomator
  - name: QUARKUS_OIDC_AUTH_SERVER_URL
    value: http://cryptomator-keycloak-{{KUBERO_NAME_SUFFIX}}-kuberoapp/realms/cryptomator
  - name: QUARKUS_OIDC_CLIENT_ID
    value: cryptomatorhub
  - name: QUARKUS_OIDC_TOKEN_ISSUER
    value: any
  - name: QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING
    value: 'true'
  - name: QUARKUS_OTEL_SDK_DISABLED
    value: 'true'
  extraVolumes: []
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
  healthcheck:
    enabled: true
    path: /
    startupSeconds: 600
    timeoutSeconds: 10
    periodSeconds: 15
  image:
    containerPort: '8080'
    pullPolicy: Always
    repository: ghcr.io/cryptomator/hub
    tag: stable
    run:
      securityContext:
        readOnlyRootFilesystem: false
  # Keycloak for Hub sign-in, as its own app (it was a Deployment + Service
  # baked into the Postgres add-on's resourceDefinitions, which the server
  # refuses: #136). It shares the Hub's Postgres add-on (usePrimaryAddons
  # injects PGHOST/PGPORT/PGUSER/PGPASSWORD) and uses the `keycloak` database
  # the add-on's initdb creates. The command writes the seed realm from
  # CRYPTOMATOR_REALM_JSON into Keycloak's import folder, then starts it
  # (the image ships bash, which kc.sh needs anyway).
  # exposeInternet is left unset on purpose: the dashboard then gives this
  # companion its own public URL (browsers must reach Keycloak to sign in)
  # without making it the group's public entry, so the Hub stays public too.
  templateServices:
  - id: keycloak
    nameHint: cryptomator-keycloak
    serviceType: web
    usePrimaryAddons: true
    image:
      repository: ghcr.io/cryptomator/keycloak
      tag: 26.6.2
      containerPort: '8080'
      command:
      - /bin/bash
      - -c
      - |
        mkdir -p /opt/keycloak/data/import
        printf '%s' "$CRYPTOMATOR_REALM_JSON" > /opt/keycloak/data/import/realm.json
        exec /opt/keycloak/bin/kc.sh start --import-realm
    envVars:
    - name: KC_DB
      value: postgres
    - name: KC_DB_URL_HOST
      value: '$(PGHOST)'
    - name: KC_DB_URL_PORT
      value: '$(PGPORT)'
    - name: KC_DB_URL_DATABASE
      value: keycloak
    - name: KC_DB_USERNAME
      value: '$(PGUSER)'
    - name: KC_DB_PASSWORD
      value: '$(PGPASSWORD)'
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      value: admin
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      value: '{{KUBERO_GEN_ALNUM:24}}'
    - name: KC_HEALTH_ENABLED
      value: 'true'
    - name: KC_METRICS_ENABLED
      value: 'true'
    - name: KC_HTTP_ENABLED
      value: 'true'
    - name: KC_PROXY_HEADERS
      value: xforwarded
    - name: KC_HOSTNAME_STRICT
      value: 'false'
    - name: QUARKUS_TRANSACTION_MANAGER_ENABLE_RECOVERY
      value: 'false'
    # Same name as on the Hub app, so both get the same generated value.
    - name: HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET
      value: '{{KUBERO_GEN_ALNUM:32}}'
    # First password of the realm's `admin` user (Hub sign-in); Keycloak
    # makes the user change it at first login.
    - name: CRYPTOMATOR_REALM_ADMIN_PASSWORD
      value: '{{KUBERO_GEN_ALNUM:24}}'
    # $(NAME) references are expanded by Kubernetes from the variables above.
    - name: CRYPTOMATOR_REALM_JSON
      value: |
        {
          "realm": "cryptomator",
          "displayName": "Cryptomator Hub",
          "loginTheme": "cryptomator",
          "enabled": true,
          "sslRequired": "external",
          "defaultRole": { "name": "user", "description": "User" },
          "roles": {
            "realm": [
              { "name": "user", "description": "User", "composite": false },
              { "name": "create-vaults", "description": "Can create vaults", "composite": false },
              {
                "name": "admin",
                "description": "Administrator",
                "composite": true,
                "composites": {
                  "realm": ["user", "create-vaults"],
                  "client": { "realm-management": ["realm-admin"] }
                }
              }
            ]
          },
          "users": [
            {
              "username": "admin",
              "enabled": true,
              "credentials": [{ "type": "password", "value": "$(CRYPTOMATOR_REALM_ADMIN_PASSWORD)", "temporary": true }],
              "requiredActions": ["UPDATE_PASSWORD"],
              "realmRoles": ["admin"]
            },
            {
              "username": "system",
              "email": "system@localhost",
              "enabled": true,
              "serviceAccountClientId": "cryptomatorhub-system",
              "clientRoles": {
                "realm-management": ["realm-admin", "view-system"]
              }
            }
          ],
          "scopeMappings": [{ "client": "cryptomatorhub", "roles": ["user", "admin"] }],
          "clients": [
            {
              "clientId": "cryptomatorhub",
              "serviceAccountsEnabled": false,
              "publicClient": true,
              "name": "Cryptomator Hub",
              "enabled": true,
              "redirectUris": ["*"],
              "webOrigins": ["+"],
              "bearerOnly": false,
              "frontchannelLogout": false,
              "protocol": "openid-connect",
              "attributes": { "pkce.code.challenge.method": "S256" }
            },
            {
              "clientId": "cryptomator",
              "serviceAccountsEnabled": false,
              "publicClient": true,
              "name": "Cryptomator App",
              "enabled": true,
              "redirectUris": ["*"],
              "webOrigins": ["+"],
              "protocol": "openid-connect",
              "attributes": { "pkce.code.challenge.method": "S256" }
            },
            {
              "clientId": "cryptomatorhub-system",
              "serviceAccountsEnabled": true,
              "publicClient": false,
              "name": "Cryptomator Hub System",
              "enabled": true,
              "clientAuthenticatorType": "client-secret",
              "secret": "$(HUB_KEYCLOAK_SYSTEM_CLIENT_SECRET)",
              "standardFlowEnabled": false
            }
          ]
        }
    healthcheck:
      enabled: true
      path: /realms/cryptomator
      startupSeconds: 600
      timeoutSeconds: 10
      periodSeconds: 15
