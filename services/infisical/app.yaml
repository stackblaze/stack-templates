apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: infisical
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: Open-source secrets management and internal PKI
      platform for developers and teams.
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/infisical/icon.png
    kubero.dev/template.installation: ENCRYPTION_KEY and AUTH_SECRET are generated
      per deploy. Sign-up is open on first boot; create the admin in the UI.
    kubero.dev/template.links: '["https://infisical.com/docs/"]'
    kubero.dev/template.screenshots: '["https://infisical.com/images/og-image.png"]'
    kubero.dev/template.source: https://github.com/Infisical/infisical
    kubero.dev/template.categories: '["security", "development", "work"]'
    kubero.dev/template.title: Infisical
    kubero.dev/template.website: https://infisical.com/
  labels:
    manager: kubero
spec:
  name: infisical
  deploymentstrategy: docker
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: infisical
              owner: infisical
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO infisical
              - GRANT CREATE ON SCHEMA public TO infisical
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO infisical
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: infisical
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: infisical
          password: infisical
  - displayName: Valkey
    env: []
    icon: /img/addons/redis.svg
    id: kubero-operator
    kind: Valkey
    resourceDefinitions:
      Valkey:
        apiVersion: rds.valkey.buf.red/v1alpha1
        kind: Valkey
        metadata:
          name: '{{KUBERO_APP_NAME}}-valkey'
        spec:
          version: '8.0'
          arch: replica
          replicas:
            shards: 1
            replicasOfShard: 1
          access:
            serviceType: ClusterIP
          storage:
            capacity: 1Gi
            storageClassName: fast
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
  # Platform email. Infisical already reads SMTP_HOST, SMTP_PORT, and
  # SMTP_PASSWORD. Map the names that differ. STARTTLS on 587 is the default.
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env:
    - name: SMTP_USERNAME
      value: '$(SMTP_USER)'
    - name: SMTP_FROM_ADDRESS
      value: '$(SMTP_FROM)'
    - name: SMTP_FROM_NAME
      value: Infisical
    resourceDefinitions: {}
  envVars:
  - name: SITE_URL
    value: '{{KUBERO_APP_URL}}'
  - name: NODE_ENV
    value: production
  - name: TELEMETRY_ENABLED
    value: 'false'
  - name: DB_CONNECTION_URI
    value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)?sslmode=disable'
  # 16-byte hex (openssl rand -hex 16). 32-byte base64 (openssl rand -base64 32).
  - name: ENCRYPTION_KEY
    value: '{{KUBERO_GEN_HEX:32}}'
  - name: AUTH_SECRET
    value: '{{KUBERO_GEN_ALNUM:43}}='
  extraVolumes: []
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  # Community standalone image. Docker Hub publishes it as
  # infisical/infisical (there is no infisical/community repository).
  # HOST=0.0.0.0 and PORT=8080 are baked into the image. Valkey injects REDIS_URL.
  image:
    containerPort: '8080'
    pullPolicy: IfNotPresent
    repository: docker.io/infisical/infisical
    tag: v0.165.16
    run:
      securityContext:
        readOnlyRootFilesystem: false
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: '1'
      memory: 2Gi
  healthcheck:
    enabled: true
    path: /api/status
    startupSeconds: 300
    timeoutSeconds: 5
    periodSeconds: 10
