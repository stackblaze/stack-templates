apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: langfuse
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "Open-source LLM observability platform \u2014\
      \ traces, evals, prompt management, datasets, and cost analytics for AI applications."
    kubero.dev/template.icon: https://raw.githubusercontent.com/stackblaze/stack-templates/main/services/langfuse/icon.png
    kubero.dev/template.installation: 'Langfuse v3 is a multi-service stack. This
      template runs the PRIMARY web/API container (ghcr.io/langfuse/langfuse, port
      3000). Bundled add-ons provision Postgres (transactional data), ClickHouse (trace/observation
      store), Valkey (Redis-compatible queue/cache), plus a MinIO companion app
      (S3 for event/media uploads, on a 5Gi volume, root password generated at deploy
      and shared with Langfuse). You may swap MinIO for the RustFS add-on or external
      S3. A langfuse-worker companion app (ghcr.io/langfuse/langfuse-worker,
      same release as the web image) shares the web app''s env and processes ingestion.
      NEXTAUTH_SECRET, SALT and the MinIO password are generated at deploy. ROTATE before
      production: ENCRYPTION_KEY (64-char hex via openssl rand -hex 32; set the same value
      on the web and worker apps), the Postgres/ClickHouse credentials, and LANGFUSE_INIT_*
      seed values. Instrument your app with the Langfuse
      SDK and set LANGFUSE_HOST={{KUBERO_APP_URL}}.'
    kubero.dev/template.links: '["https://langfuse.com/docs", "https://langfuse.com/self-hosting"]'
    kubero.dev/template.screenshots: '["https://langfuse.com/api/og?title=Langfuse+%E2%80%93+Open+Source+AI+Engineering+Platform&amp;description=Traces%2C+evals%2C+prompt+management+and+metrics+to+debug+and+improve+your+LLM+application."]'
    kubero.dev/template.source: https://github.com/langfuse/langfuse
    kubero.dev/template.categories: '["ai", "monitoring", "development"]'
    kubero.dev/template.title: Langfuse
    kubero.dev/template.website: https://langfuse.com
  labels:
    manager: kubero
spec:
  name: langfuse
  deploymentstrategy: docker
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: langfuse
              owner: langfuse
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO langfuse
              - GRANT CREATE ON SCHEMA public TO langfuse
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO langfuse
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: langfuse
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: langfuse
          password: langfuse
  - displayName: ClickHouse
    env: []
    icon: /img/addons/clickhouse.svg
    id: clickhouse-operator
    kind: ClickHouseInstallation
    resourceDefinitions:
      ClickHouseInstallation:
        apiVersion: clickhouse.altinity.com/v1
        kind: ClickHouseInstallation
        metadata:
          name: '{{KUBERO_APP_NAME}}-clickhouse'
        spec:
          configuration:
            users:
              admin/password: langfuse
              admin/networks/ip:
              - 0.0.0.0/0
            clusters:
            - name: analytics
              layout:
                shardsCount: 1
                replicasCount: 1
              templates:
                podTemplate: clickhouse-pod-template
          defaults:
            templates:
              dataVolumeClaimTemplate: data-volume-template
              logVolumeClaimTemplate: log-volume-template
              podTemplate: clickhouse-pod-template
          templates:
            podTemplates:
            - name: clickhouse-pod-template
              spec:
                containers:
                - name: clickhouse
                  image: ghcr.io/stackblaze/stack-templates/clickhouse-server:24.8.7.41
            volumeClaimTemplates:
            - name: data-volume-template
              spec:
                accessModes:
                - ReadWriteOnce
                storageClassName: fast
                resources:
                  requests:
                    storage: 2Gi
            - name: log-volume-template
              spec:
                accessModes:
                - ReadWriteOnce
                storageClassName: fast
                resources:
                  requests:
                    storage: 512Mi
  - displayName: Valkey
    env: []
    icon: /img/addons/redis.svg
    id: kubero-operator
    kind: Valkey
    resourceDefinitions:
      Valkey:
        apiVersion: rds.valkey.buf.red/v1alpha1
        kind: Valkey
        metadata:
          name: '{{KUBERO_APP_NAME}}-valkey'
        spec:
          version: '8.0'
          arch: replica
          replicas:
            shards: 1
            replicasOfShard: 1
          access:
            serviceType: ClusterIP
          storage:
            capacity: 1Gi
            storageClassName: fast
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
  envVars:
  - name: CHHOST
    value: clickhouse-{{KUBERO_APP_NAME}}-clickhouse
  # The MinIO companion app below. Sibling apps of a catalog group are
  # reached as <nameHint>-<suffix>-kuberoapp on port 80.
  - name: S3HOST
    value: langfuse-minio-{{KUBERO_NAME_SUFFIX}}-kuberoapp
  # Shared with the MinIO companion (one value per variable name across the
  # group), which uses it as MINIO_ROOT_PASSWORD.
  - name: LANGFUSE_MINIO_PASSWORD
    value: '{{KUBERO_GEN_ALNUM:32}}'
  - name: DATABASE_URL
    value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  - name: NEXTAUTH_URL
    value: '{{KUBERO_APP_URL}}'
  # Generated at deploy; the worker companion inherits this env, so both get
  # the same SALT (API key hashing).
  - name: NEXTAUTH_SECRET
    value: '{{KUBERO_GEN_ALNUM:32}}'
  - name: SALT
    value: '{{KUBERO_GEN_ALNUM:32}}'
  - name: ENCRYPTION_KEY
    value: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  - name: CLICKHOUSE_MIGRATION_URL
    value: clickhouse://clickhouse-{{KUBERO_APP_NAME}}-clickhouse:9000
  - name: CLICKHOUSE_URL
    value: http://clickhouse-{{KUBERO_APP_NAME}}-clickhouse:8123
  - name: CLICKHOUSE_USER
    value: admin
  - name: CLICKHOUSE_PASSWORD
    value: langfuse
  - name: CLICKHOUSE_CLUSTER_ENABLED
    value: 'false'
  - name: REDIS_HOST
    value: '$(REDISHOST)'
  - name: REDIS_PORT
    value: '$(REDISPORT)'
  - name: LANGFUSE_S3_EVENT_UPLOAD_BUCKET
    value: langfuse
  - name: LANGFUSE_S3_EVENT_UPLOAD_REGION
    value: us-east-1
  - name: LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID
    value: langfuseadmin
  - name: LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY
    value: '$(LANGFUSE_MINIO_PASSWORD)'
  - name: LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT
    value: http://$(S3HOST)
  - name: LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE
    value: 'true'
  - name: LANGFUSE_S3_MEDIA_UPLOAD_BUCKET
    value: langfuse
  - name: LANGFUSE_S3_MEDIA_UPLOAD_REGION
    value: us-east-1
  - name: LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID
    value: langfuseadmin
  - name: LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY
    value: '$(LANGFUSE_MINIO_PASSWORD)'
  - name: LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT
    value: http://$(S3HOST)
  - name: LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE
    value: 'true'
  - name: LANGFUSE_INIT_ORG_ID
    value: my-org
  - name: LANGFUSE_INIT_ORG_NAME
    value: My Org
  - name: LANGFUSE_INIT_PROJECT_ID
    value: my-project
  - name: LANGFUSE_INIT_PROJECT_NAME
    value: My Project
  - name: LANGFUSE_INIT_USER_EMAIL
    value: admin@example.com
  - name: LANGFUSE_INIT_USER_NAME
    value: Admin
  - name: LANGFUSE_INIT_USER_PASSWORD
    value: change-me
  extraVolumes: []
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 2Gi
  healthcheck:
    enabled: true
    path: /api/public/health
    startupSeconds: 600
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '3000'
    pullPolicy: Always
    repository: ghcr.io/langfuse/langfuse
    # Same pin as the langfuse-worker companion below: web and worker must
    # run the same release.
    tag: 3.225.11
    command:
    - sh
    - -c
    - 'node -e "const net=require(''net'');const wait=(h,p)=>new Promise(r=>{const
      go=()=>{const s=net.connect(p,h,()=>{s.end();r();});s.on(''error'',()=>setTimeout(go,2000));};go();});Promise.all([wait(process.env.PGHOST,+(process.env.PGPORT||5432)),wait(process.env.CHHOST,8123),wait(process.env.REDIS_HOST,+process.env.REDIS_PORT),wait(process.env.S3HOST,80)]).then(()=>process.exit(0));"
      && dumb-init -- ./web/entrypoint.sh sh -c ''node ./web/server.js --keepAliveTimeout
      110000''

      '
    run:
      securityContext:
        readOnlyRootFilesystem: false
  # MinIO (S3) for event/media uploads, as its own app. It was a
  # Deployment + Service baked into the Postgres add-on's resourceDefinitions,
  # which the server refuses (#136). Same image and start command as
  # Langfuse's docker-compose (the mkdir creates the `langfuse` bucket); data
  # now lives on a volume instead of an emptyDir. Private web service on the
  # S3 port; the root password is the group-shared LANGFUSE_MINIO_PASSWORD.
  templateServices:
  - id: minio
    nameHint: langfuse-minio
    serviceType: web
    exposeInternet: false
    image:
      repository: cgr.dev/chainguard/minio
      tag: latest
      containerPort: '9000'
      command:
      - sh
      - -c
      - mkdir -p /data/langfuse && exec minio server --address :9000 --console-address :9001 /data
    envVars:
    - name: LANGFUSE_MINIO_PASSWORD
      value: '{{KUBERO_GEN_ALNUM:32}}'
    - name: MINIO_ROOT_USER
      value: langfuseadmin
    - name: MINIO_ROOT_PASSWORD
      value: '$(LANGFUSE_MINIO_PASSWORD)'
    extraVolumes:
    - accessModes:
      - ReadWriteMany
      emptyDir: false
      mountPath: /data
      name: '{{KUBERO_APP_NAME}}-minio-data'
      size: 5Gi
      storageClass: shared
    healthcheck:
      enabled: true
      path: /minio/health/live
      timeoutSeconds: 5
      periodSeconds: 10
  # The Langfuse v3 worker: it processes the ingestion queue (events land in
  # S3 + Valkey, the worker writes them to ClickHouse), so traces never show
  # up without it. Same release as the web image, default entrypoint (it does
  # not run the database migrations; the web app does). It inherits the web
  # app's env (and so its add-ons and generated secrets) and serves nothing.
  - id: worker
    nameHint: langfuse-worker
    serviceType: worker
    size: medium
    exposeInternet: false
    image:
      repository: ghcr.io/langfuse/langfuse-worker
      tag: 3.225.11
      containerPort: '3030'
    inheritEnvFrom: primary
    healthcheck:
      enabled: false
