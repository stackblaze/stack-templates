apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: plane
  annotations:
    kubero.dev/template.architecture: '[]'
    kubero.dev/template.description: "Plan projects, prioritize issues, and deliver work through cycles, modules, and roadmaps.\nA streamlined alternative to Jira and Linear."
    kubero.dev/template.icon: https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4f5f2b23abb891e030a3800ce263a27c1ed93170/services/plane/icon.png
    kubero.dev/template.installation: |
      Deploys the stackblaze/plane fork as a multi-service group: api + worker + beat (ghcr.io/stackblaze/plane-backend:latest), web/space/live frontends, and plane-proxy as the public entrypoint. Shared add-ons (PostgreSQL, Valkey, RabbitMQ, RustFS) attach to the api service; invites and magic-code login use Platform Email while that add-on is connected. Uploads go to the platform object-storage add-on (a communal S3 bucket on shared zones). The instance is configured from env on every API boot (ADMIN_EMAIL / ADMIN_PASSWORD / WORKSPACE_NAME, ENABLE_* and EMAIL_*); the /god-mode admin app is not deployed. Open the proxy URL and sign in with ADMIN_EMAIL/ADMIN_PASSWORD. With Platform Email connected, everyone else signs in with a code sent to their email — no password to remember. Rotate ADMIN_PASSWORD, SECRET_KEY, LIVE_SERVER_SECRET_KEY, and RustFS credentials before production use.
    kubero.dev/template.links: '["https://developers.plane.so/"]'
    kubero.dev/template.screenshots: '["https://media.stackblaze.cloud/templates/plane/demo.mp4", "https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4f5f2b23abb891e030a3800ce263a27c1ed93170/services/plane/dashboard.png", "https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4f5f2b23abb891e030a3800ce263a27c1ed93170/services/plane/screenshot-all-projects.png", "https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4f5f2b23abb891e030a3800ce263a27c1ed93170/services/plane/screenshot-home.png", "https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4f5f2b23abb891e030a3800ce263a27c1ed93170/services/plane/screenshot-analytics.png", "https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4f5f2b23abb891e030a3800ce263a27c1ed93170/services/plane/screenshot-settings.png"]'
    kubero.dev/template.source: https://github.com/stackblaze/plane
    kubero.dev/template.categories: '["productivity", "work", "collaboration"]'
    kubero.dev/template.title: "Plane Project Management"
    kubero.dev/template.website: https://plane.so/
  labels:
    manager: kubero
spec:
  name: plane
  deploymentstrategy: docker
  # Synthetic monorepo key — Architecture groups siblings by clone_url (+ branch).
  gitrepo:
    admin: false
    clone_url: https://github.com/stackblaze/plane.git
    default_branch: preview
    private: false
    ssh_url: ''
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: plane
              owner: plane
              secret:
                name: '{{KUBERO_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO plane
              - GRANT CREATE ON SCHEMA public TO plane
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO plane
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: plane
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: plane
          password: plane
  - displayName: Valkey
    env: []
    icon: /img/addons/redis.svg
    id: kubero-operator
    kind: Valkey
    resourceDefinitions:
      Valkey:
        apiVersion: rds.valkey.buf.red/v1alpha1
        kind: Valkey
        metadata:
          name: '{{KUBERO_APP_NAME}}-valkey'
        spec:
          version: '8.0'
          arch: replica
          replicas:
            shards: 1
            replicasOfShard: 1
          access:
            serviceType: ClusterIP
          storage:
            capacity: 1Gi
            storageClassName: fast
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
  # Platform email (see README "Email contract"). Plane reads EMAIL_* from
  # env (and Instance Admin); map from injected SMTP_*.
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env:
    - name: EMAIL_HOST
      value: '$(SMTP_HOST)'
    - name: EMAIL_PORT
      value: '$(SMTP_PORT)'
    - name: EMAIL_HOST_USER
      value: '$(SMTP_USER)'
    - name: EMAIL_HOST_PASSWORD
      value: '$(SMTP_PASSWORD)'
    - name: EMAIL_FROM
      value: '$(SMTP_FROM)'
    - name: EMAIL_USE_TLS
      value: '1'
    - name: EMAIL_USE_SSL
      value: '0'
    - name: ENABLE_SMTP
      value: '1'
    - name: ENABLE_MAGIC_LINK_LOGIN
      value: '1'
    resourceDefinitions: {}
  # Platform object storage (RustFS Tenant → communal-s3 logical bucket
  # on shared). Plane natively reads AWS_*; map endpoint/bucket from the
  # injected S3_* contract (access keys arrive as AWS_ACCESS_KEY_ID /
  # AWS_SECRET_ACCESS_KEY from the Tenant secret).
  - displayName: RustFS
    env: []
    icon: /img/addons/rustfs.svg
    id: kubero-operator
    kind: Tenant
    resourceDefinitions:
      Tenant:
        apiVersion: rustfs.com/v1alpha1
        kind: Tenant
        metadata:
          name: '{{KUBERO_APP_NAME}}-rustfs'
          annotations:
            # The operator refuses custom-repo images it cannot verify for
            # RuntimeDefault seccomp ("WorkloadSecurityIncompatible") unless the
            # exact reference is acknowledged. Keep in sync with spec.image.
            operator.rustfs.com/runtime-default-image-ack: registry.stackblaze.cloud/rustfs/rustfs:1.0.0-beta.10
        spec:
          image: registry.stackblaze.cloud/rustfs/rustfs:1.0.0-beta.10
          credsSecret:
            name: '{{KUBERO_APP_NAME}}-rustfs-credentials'
          pools:
          - name: pool-0
            servers: 1
            persistence:
              volumesPerServer: 4
              volumeClaimTemplate:
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 2Gi
                storageClassName: slow
      credsSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{KUBERO_APP_NAME}}-rustfs-credentials'
        type: Opaque
        stringData:
          accesskey: plane
          secretkey: '{{KUBERO_GEN_HEX:32}}'
  - displayName: RabbitMQ
    env: []
    icon: /img/addons/rabbitmq.svg
    id: kubero-operator
    kind: RabbitmqCluster
    resourceDefinitions:
      RabbitmqCluster:
        apiVersion: rabbitmq.com/v1beta1
        kind: RabbitmqCluster
        metadata:
          name: '{{KUBERO_APP_NAME}}-rabbitmq'
        spec:
          replicas: 1
          persistence:
            storageClassName: lite
            storage: 1Gi
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          rabbitmq:
            additionalConfig: "default_user = plane\ndefault_pass = plane\ndefault_vhost\
              \ = plane\n"
  envVars:

  - name: WEB_URL
    value: '{{KUBERO_APP_URL}}'
  - name: CORS_ALLOWED_ORIGINS
    value: '{{KUBERO_APP_URL}}'
  # Seeded on first API boot (no /god-mode). Sign in with these, then use the app.
  - name: ADMIN_EMAIL
    value: admin@example.com
  - name: ADMIN_PASSWORD
    # Fixed so catalog e2e can sign in; rotate for production.
    value: KuberoQaPlaneAdmin1!
  - name: ADMIN_FIRST_NAME
    value: Admin
  - name: INSTANCE_NAME
    value: Plane
  - name: WORKSPACE_NAME
    value: Plane
  - name: WORKSPACE_SLUG
    value: plane
  - name: ENABLE_SIGNUP
    value: '1'
  - name: ENABLE_EMAIL_PASSWORD
    value: '1'
  - name: DATABASE_URL
    value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  - name: CELERY_BROKER_URL
    value: 'redis://$(REDISHOST):$(REDISPORT)/0'
  - name: CELERY_RESULT_BACKEND
    value: 'redis://$(REDISHOST):$(REDISPORT)/0'
  - name: AMQP_URL
    value: amqp://plane:plane@{{KUBERO_APP_NAME}}-rabbitmq:5672/plane
  - name: RABBITMQ_HOST
    value: '{{KUBERO_APP_NAME}}-rabbitmq'
  - name: RABBITMQ_PORT
    value: '5672'
  - name: SECRET_KEY
    value: '{{KUBERO_GEN_ALNUM:50}}'
  - name: LIVE_SERVER_SECRET_KEY
    value: '{{KUBERO_GEN_ALNUM:32}}'
  - name: USE_MINIO
    value: '1'
  - name: AWS_S3_ENDPOINT_URL
    value: '$(S3_ENDPOINT)'
  - name: AWS_S3_BUCKET_NAME
    value: '$(S3_BUCKET)'
  - name: AWS_REGION
    value: '$(AWS_REGION)'
  # Also on primary so inheritEnvFrom copies them even if a dashboard
  # build still replaces companion env instead of merging it.
  - name: API_BASE_URL
    value: http://api:8000
  - name: SITE_ADDRESS
    value: ':80'
  - name: FILE_SIZE_LIMIT
    value: '5242880'
  - name: BUCKET_NAME
    value: '$(S3_BUCKET)'
  - name: GUNICORN_WORKERS
    value: '1'
  extraVolumes: []
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: '1'
      memory: 2Gi
    limits:
      cpu: '2'
      memory: 3Gi
  healthcheck:
    enabled: true
    path: /
    startupSeconds: 900
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '8000'
    pullPolicy: Always
    # Published by stackblaze/plane on every push to preview
    # (ghcr.io/stackblaze/plane-*:latest). Anonymous read, no pull secret.
    repository: ghcr.io/stackblaze/plane-backend
    tag: latest
    run:
      securityContext:
        readOnlyRootFilesystem: false
  # Catalog-only (not written to the KuberoApp CR). Dashboard expands these into
  # docker multi-app cards; addons stay on the primary api card above.
  # exposeInternet:false → web replicas, no Ingress (proxy is the public entry).
  templateServices:
  - id: worker
    nameHint: plane-worker
    exposeInternet: false
    image:
      repository: ghcr.io/stackblaze/plane-backend
      tag: latest
      pullPolicy: Always
      containerPort: '8000'
      command:
      - ./bin/docker-entrypoint-worker.sh
    inheritEnvFrom: primary
    healthcheck:
      enabled: false
  - id: beat
    nameHint: plane-beat
    exposeInternet: false
    image:
      repository: ghcr.io/stackblaze/plane-backend
      tag: latest
      pullPolicy: Always
      containerPort: '8000'
      command:
      - ./bin/docker-entrypoint-beat.sh
    inheritEnvFrom: primary
    healthcheck:
      enabled: false
  - id: web
    nameHint: plane-web
    exposeInternet: false
    image:
      repository: ghcr.io/stackblaze/plane-frontend
      tag: latest
      pullPolicy: Always
      containerPort: '3000'
    envVars:
    - name: WEB_URL
      value: '{{KUBERO_APP_URL}}'
    healthcheck:
      enabled: true
      path: /
  - id: space
    nameHint: plane-space
    exposeInternet: false
    image:
      repository: ghcr.io/stackblaze/plane-space
      tag: latest
      pullPolicy: Always
      containerPort: '3000'
    envVars:
    - name: WEB_URL
      value: '{{KUBERO_APP_URL}}'
    healthcheck:
      enabled: false
  - id: live
    nameHint: plane-live
    exposeInternet: false
    inheritEnvFrom: primary
    image:
      repository: ghcr.io/stackblaze/plane-live
      tag: latest
      pullPolicy: Always
      containerPort: '3000'
    envVars:
    - name: API_BASE_URL
      value: http://api:8000
    - name: WEB_URL
      value: '{{KUBERO_APP_URL}}'
    healthcheck:
      enabled: false
  - id: proxy
    nameHint: plane-proxy
    exposeInternet: true
    publicUrlSource: true
    inheritEnvFrom: primary
    image:
      repository: ghcr.io/stackblaze/plane-proxy
      tag: latest
      pullPolicy: Always
      containerPort: '80'
      command:
      - /bin/sh
      - -c
      - |
        export SITE_ADDRESS="${SITE_ADDRESS:-:80}"
        export FILE_SIZE_LIMIT="${FILE_SIZE_LIMIT:-5242880}"
        export BUCKET_NAME="${BUCKET_NAME:-$S3_BUCKET}"
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    envVars:
    - name: BUCKET_NAME
      value: '$(S3_BUCKET)'
    - name: FILE_SIZE_LIMIT
      value: '5242880'
    - name: SITE_ADDRESS
      value: ':80'
    healthcheck:
      enabled: true
      path: /
  # Alias Services the plane-proxy Caddyfile expects (created post-install /
  # by the deploy helper). Selectors use KuberoApp instance labels.
  templateServiceAliases:
  - name: api
    port: 8000
    targetRole: primary
  - name: web
    port: 3000
    targetRole: web
  - name: space
    port: 3000
    targetRole: space
  - name: live
    port: 3000
    targetRole: live
  - name: plane-minio
    port: 9000
    externalNameRole: rustfs-io
