apiVersion: application.kubero.dev/v1alpha1
kind: KuberoApp
metadata:
  name: plane
  annotations:
    kubero.dev/template.architecture: '["linux/amd64"]'
    kubero.dev/template.description: Plan projects, track issues and ship work through
      cycles, modules and pages. Open source project management with LDAP, OIDC and
      SAML sign-in, time tracking and workflows included.
    kubero.dev/template.icon: https://cdn.jsdelivr.net/gh/stackblaze/stack-templates@4f5f2b23abb891e030a3800ce263a27c1ed93170/services/plane/icon.png
    kubero.dev/template.installation: 'Open the URL of the plane-proxy service and
      sign in with the email in ADMIN_EMAIL and the password generated in
      ADMIN_PASSWORD (both under Variables on the api service). The template creates
      this admin and a first workspace on the first start, so there is no setup
      page, and later starts never reset the password. Sign-up is closed: invite
      people from Workspace settings > Members (invites are sent through the Email
      add-on, and invited members can sign in with a code sent by email). Uploads
      (attachments, covers, avatars) are stored in the S3 bucket add-on
      and served through the proxy. Instance settings such as sign-in methods,
      SMTP and LDAP/OIDC/SAML are read from the api environment on every start
      (ENABLE_*, EMAIL_*, LDAP_*, OIDC_*, SAML_*); there is no /god-mode admin
      app. The first start runs the database migrations and takes a few minutes.
      Telemetry is off (ENABLE_TELEMETRY=0). Built from github.com/stackblaze/plane,
      Plane v1.4.3.'
    kubero.dev/template.links: '["https://developers.plane.so/"]'
    kubero.dev/template.screenshots: '[]'
    kubero.dev/template.source: https://github.com/stackblaze/plane
    kubero.dev/template.categories: '["productivity", "work", "collaboration"]'
    kubero.dev/template.title: Plane
    kubero.dev/template.website: https://plane.so/
  labels:
    manager: kubero
spec:
  name: plane
  deploymentstrategy: docker
  # Synthetic monorepo key: the canvas groups siblings by clone_url (+ branch).
  gitrepo:
    admin: false
    clone_url: https://github.com/stackblaze/plane.git
    default_branch: preview
    private: false
    ssh_url: ''
  # Dependency check (Plane v1.4.3 + stackblaze/plane fork):
  # - Database: Postgres (DATABASE_URL, apps/api/plane/settings/common.py).
  # - Cache/queue: Valkey. Django cache via the injected REDIS_URL; Celery broker
  #   via CELERY_BROKER_URL (fork: RabbitMQ is only the Celery broker and the
  #   platform injects no RabbitMQ credentials, so no RabbitMQ add-on).
  # - Volume: none. Uploads go to S3.
  # - S3: S3 bucket add-on (attachments, covers, avatars), served through the
  #   proxy at /<bucket>/ (USE_MINIO=1; the proxy dials S3_HOST:S3_PORT).
  # - SMTP: invites, sign-in codes, notifications (Email add-on env below).
  addons:
  - displayName: PostgreSQL (CloudNativePG)
    env: []
    icon: /img/addons/pgsql.svg
    id: kubero-operator
    kind: Cluster
    resourceDefinitions:
      Cluster:
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql'
        spec:
          instances: 1
          imageName: ghcr.io/cloudnative-pg/postgresql:16
          primaryUpdateStrategy: unsupervised
          storage:
            storageClass: smart
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '1'
              memory: 1Gi
          bootstrap:
            initdb:
              database: plane
              owner: plane
              secret:
                name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
              postInitApplicationSQL:
              - GRANT ALL ON SCHEMA public TO plane
              - GRANT CREATE ON SCHEMA public TO plane
              - ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO plane
          enableSuperuserAccess: true
          superuserSecret:
            name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
      superuserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-superuser'
        type: kubernetes.io/basic-auth
        stringData:
          username: postgres
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
      appUserSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-postgresql-app'
        type: kubernetes.io/basic-auth
        stringData:
          username: plane
          password: '{{STACKBLAZE_GEN_ALNUM:24}}'
  - displayName: Valkey
    env: []
    icon: /img/addons/redis.svg
    id: kubero-operator
    kind: Valkey
    resourceDefinitions:
      Valkey:
        apiVersion: rds.valkey.buf.red/v1alpha1
        kind: Valkey
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-valkey'
        spec:
          version: '8.0'
          arch: replica
          replicas:
            shards: 1
            replicasOfShard: 1
          access:
            serviceType: ClusterIP
          storage:
            capacity: 1Gi
            storageClassName: fast
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 256Mi
  # Platform email (README "Email contract"). Plane reads EMAIL_* as instance
  # configuration from the environment on every api start.
  - displayName: Email
    icon: /img/addons/email.svg
    id: kubero-smtp
    kind: Smtp
    env:
    - name: EMAIL_HOST
      value: '$(SMTP_HOST)'
    - name: EMAIL_PORT
      value: '$(SMTP_PORT)'
    - name: EMAIL_HOST_USER
      value: '$(SMTP_USER)'
    - name: EMAIL_HOST_PASSWORD
      value: '$(SMTP_PASSWORD)'
    - name: EMAIL_FROM
      value: '$(SMTP_FROM)'
    - name: EMAIL_USE_TLS
      value: '1'
    - name: EMAIL_USE_SSL
      value: '0'
    - name: ENABLE_SMTP
      value: '1'
    - name: ENABLE_MAGIC_LINK_LOGIN
      value: '1'
    resourceDefinitions: {}
  # S3 bucket add-on (Tenant). Plane serves files through its proxy at
  # /<bucket>/, so the in-cluster endpoint is never sent to the browser.
  - displayName: S3 bucket
    env: []
    icon: /img/addons/rustfs.svg
    id: kubero-operator
    kind: Tenant
    resourceDefinitions:
      Tenant:
        apiVersion: rustfs.com/v1alpha1
        kind: Tenant
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-rustfs'
          annotations:
            operator.rustfs.com/runtime-default-image-ack: docker.io/rustfs/rustfs:1.0.0-beta.10
        spec:
          image: docker.io/rustfs/rustfs:1.0.0-beta.10
          credsSecret:
            name: '{{STACKBLAZE_APP_NAME}}-rustfs-credentials'
          pools:
          - name: pool-0
            servers: 1
            persistence:
              volumesPerServer: 4
              volumeClaimTemplate:
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 2Gi
                storageClassName: slow
      credsSecret:
        apiVersion: v1
        kind: Secret
        metadata:
          name: '{{STACKBLAZE_APP_NAME}}-rustfs-credentials'
        type: Opaque
        stringData:
          accesskey: plane
          secretkey: '{{STACKBLAZE_GEN_HEX:32}}'
  envVars:
  # Public URL: the proxy's. The primary (api) is not exposed, so the dashboard
  # fills WEB_URL and CORS_ALLOWED_ORIGINS from the proxy's host after deploy.
  - name: WEB_URL
    value: '{{STACKBLAZE_APP_URL}}'
  - name: CORS_ALLOWED_ORIGINS
    value: '{{STACKBLAZE_APP_URL}}'
  # First admin + workspace, created on the first api start (seed_from_env).
  - name: ADMIN_EMAIL
    value: admin@example.com
  - name: ADMIN_PASSWORD
    value: '{{STACKBLAZE_GEN_ALNUM:24}}'
  - name: ADMIN_FIRST_NAME
    value: Admin
  - name: INSTANCE_NAME
    value: Plane
  - name: WORKSPACE_NAME
    value: Plane
  - name: WORKSPACE_SLUG
    value: plane
  # Closed: the URL is public. Members join by invite.
  - name: ENABLE_SIGNUP
    value: '0'
  - name: ENABLE_EMAIL_PASSWORD
    value: '1'
  - name: ENABLE_TELEMETRY
    value: '0'
  - name: DATABASE_URL
    value: 'postgresql://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)'
  - name: CELERY_BROKER_URL
    value: '$(REDIS_URL)'
  - name: SECRET_KEY
    value: '{{STACKBLAZE_GEN_ALNUM:50}}'
  - name: LIVE_SERVER_SECRET_KEY
    value: '{{STACKBLAZE_GEN_ALNUM:32}}'
  - name: USE_MINIO
    value: '1'
  - name: AWS_S3_ENDPOINT_URL
    value: '$(S3_ENDPOINT)'
  - name: AWS_S3_BUCKET_NAME
    value: '$(S3_BUCKET)'
  - name: API_BASE_URL
    value: http://api:8000
  - name: FILE_SIZE_LIMIT
    value: '5242880'
  - name: GUNICORN_WORKERS
    value: '2'
  extraVolumes: []
  cronjobs: []
  web:
    replicaCount: 1
  worker:
    replicaCount: 0
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      cpu: '2'
      memory: 2Gi
  healthcheck:
    enabled: true
    path: /
    startupSeconds: 600
    timeoutSeconds: 5
    periodSeconds: 10
  image:
    containerPort: '8000'
    pullPolicy: IfNotPresent
    # stackblaze/plane (Plane v1.4.3 + fork commits), built by its image.yml.
    repository: ghcr.io/stackblaze/plane-backend
    tag: sha-d67e897
    run:
      securityContext:
        readOnlyRootFilesystem: false
  # The api is internal: the proxy below is the group's public entry.
  exposeInternet: false
  # Catalog-only (not written to the KuberoApp CR). The dashboard expands these
  # into sibling apps; add-ons stay on the api.
  templateServices:
  - id: worker
    nameHint: plane-worker
    exposeInternet: false
    image:
      repository: ghcr.io/stackblaze/plane-backend
      tag: sha-d67e897
      pullPolicy: IfNotPresent
      containerPort: '8000'
      command:
      - ./bin/docker-entrypoint-worker.sh
    inheritEnvFrom: primary
    healthcheck:
      enabled: false
  - id: beat
    nameHint: plane-beat
    exposeInternet: false
    image:
      repository: ghcr.io/stackblaze/plane-backend
      tag: sha-d67e897
      pullPolicy: IfNotPresent
      containerPort: '8000'
      command:
      - ./bin/docker-entrypoint-beat.sh
    inheritEnvFrom: primary
    healthcheck:
      enabled: false
  # web and space are static builds (nginx); their URLs are same-origin.
  - id: web
    nameHint: plane-web
    exposeInternet: false
    image:
      repository: ghcr.io/stackblaze/plane-frontend
      tag: sha-d67e897
      pullPolicy: IfNotPresent
      containerPort: '3000'
    healthcheck:
      enabled: true
      path: /
  - id: space
    nameHint: plane-space
    exposeInternet: false
    image:
      repository: ghcr.io/stackblaze/plane-space
      tag: sha-d67e897
      pullPolicy: IfNotPresent
      containerPort: '3000'
    healthcheck:
      enabled: true
      path: /spaces/
  - id: live
    nameHint: plane-live
    exposeInternet: false
    inheritEnvFrom: primary
    image:
      repository: ghcr.io/stackblaze/plane-live
      tag: sha-d67e897
      pullPolicy: IfNotPresent
      containerPort: '3000'
    healthcheck:
      enabled: false
  - id: proxy
    nameHint: plane-proxy
    exposeInternet: true
    publicUrlSource: true
    # Add-on env only (S3_BUCKET for the Caddyfile), not the api's secrets.
    usePrimaryAddons: true
    image:
      repository: ghcr.io/stackblaze/plane-proxy
      tag: sha-d67e897
      pullPolicy: IfNotPresent
      containerPort: '80'
    envVars:
    - name: BUCKET_NAME
      value: '$(S3_BUCKET)'
    - name: FILE_SIZE_LIMIT
      value: '5242880'
    - name: SITE_ADDRESS
      value: ':80'
    healthcheck:
      enabled: true
      path: /
  # Services the plane-proxy Caddyfile dials (apps/proxy/Caddyfile.ce). The
  # bucket path goes to the S3 add-on's injected S3_HOST:S3_PORT, so there is
  # no plane-minio alias.
  templateServiceAliases:
  - name: api
    port: 8000
    targetRole: primary
  - name: web
    port: 3000
    targetRole: web
  - name: space
    port: 3000
    targetRole: space
  - name: live
    port: 3000
    targetRole: live
